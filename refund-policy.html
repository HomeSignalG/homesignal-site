      <div class="eyebrow">Legal</div>
      <h1>HomeSignal Refund Policy</h1>
      <p>Last updated October 9, 2026. How billing errors and refund requests are handled for HomeSignal Development Activity subscriptions.</p>
    </div>
    <div class="block prose" style="max-width:840px">
      <div class="cnote"><b>The short version:</b> cancelling stops future charges. If you were charged in error or have another problem, email us and we will review it.</div>

      <h2 class="bt">Who this applies to</h2>
      <p>This policy applies to paid subscriptions to HomeSignal Development Activity ($79 per month, 100 new reports each month). Free evaluation reports are not charged.</p>

      <h2 class="bt">How to ask for a refund</h2>
      <p>If you have a billing error, a duplicate charge, or another reason to request a refund, email <a href="mailto:hello@homesignal.net">hello@homesignal.net</a> with your account email and the charge in question. We will respond and review each request based on the circumstances and applicable law.</p>

      <h2 class="bt">If a refund is approved</h2>
      <p>Approved refunds are returned to the original payment method through the payment provider that processed the charge. Timing depends on that provider and your bank or card issuer.</p>

      <h2 class="bt">Cancellation is separate</h2>
      <p>You can cancel your subscription at any time. Cancelling prevents the next renewal charge, and paid access continues through the end of the billing period already paid. Cancelling does not by itself refund a charge that was already made; to request a refund, contact us as described above. See the <a href="terms.html">Terms of Service</a>.</p>

      <h2 class="bt">Your legal rights</h2>
      <p>Nothing in this policy limits any rights you have under applicable law that cannot be waived.</p>

      <h2 class="bt">Contact</h2>
      <p><a href="mailto:hello@homesignal.net">hello@homesignal.net</a> or the <a href="contact.html">contact page</a>. See also our <a href="privacy.html">Privacy Notice</a>.</p>
    </div>

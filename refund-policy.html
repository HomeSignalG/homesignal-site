      <div class="eyebrow">Legal</div>
      <h1>HomeSignal Refund Policy</h1>
      <p>Last updated November 16, 2026. This policy covers the paid plans of HomeSignal Development Activity: Professional at $78 per month and the Private Partner Offer at $234 for six months. There is no free plan and no free trial.</p>
    </div>
    <div class="block prose" style="max-width:840px">
      <h2 class="bt">Who handles your payment</h2>
      <p>Our order process is conducted by our online reseller Paddle.com. Paddle.com is the Merchant of Record for all orders. It takes your payment, charges any sales tax or VAT, issues your receipt, and processes refunds, under its <a href="https://www.paddle.com/legal/checkout-buyer-terms" rel="noopener">Checkout Buyer Terms</a>. You can ask Paddle about an order from the link in your receipt, or ask us and we will help you.</p>

      <h2 class="bt">Professional ($78 per month)</h2>
      <ul>
        <li><strong>Cancel any time.</strong> Cancel from the billing section of your account (it opens Paddle&rsquo;s management page). Cancelling stops the next renewal. You keep access to the end of the period you have paid for, then the subscription ends.</li>
        <li><strong>No partial-month refunds.</strong> A month that has been paid for is not refunded because you cancelled part-way through it, or because you did not use all 100 reports.</li>
        <li><strong>Mistakes and the law.</strong> We will refund a duplicate or mistaken charge, a charge made after a cancellation you completed in time, and any amount that the law where you live entitles you to have refunded (for example a statutory cooling-off period).</li>
      </ul>

      <h2 class="bt">Private Partner Offer ($234, six months)</h2>
      <ul>
        <li><strong>One payment, no renewal.</strong> You are charged once. Access ends automatically six months after purchase, nothing is charged again, and there is nothing to cancel.</li>
        <li><strong>No refund of unused months.</strong> Because the offer is a fixed-price, fixed-term access, the months left when it ends are not refunded.</li>
        <li><strong>Eligibility.</strong> The offer is for eligible members of the partner brokerage that gave you the private link, and we re-check that membership every 30 days (the interval can differ by partner brokerage). A late check does not end your access. If we confirm that you were not or are no longer eligible, access to new reports is suspended; contact us and we will review whether a refund is due.</li>
        <li><strong>Mistakes and the law.</strong> The same duplicate-charge and legal-rights refunds as above apply.</li>
      </ul>

      <h2 class="bt">What a refund does to your access</h2>
      <p>A full refund or a chargeback ends access to the plan it refunds, immediately. A partial refund does not change your access. Reports you made while your plan was active remain available to open, share, download and print.</p>

      <h2 class="bt">How to ask</h2>
      <p>Tell us the email on your account and the date of the charge, or use the link in your Paddle receipt. We will answer by email.</p>
      <p>For any question, contact:<br>Email: <a href="mailto:hello@homesignal.net">hello@homesignal.net</a><br>Phone: <a href="tel:+15716019432">571-601-9432</a></p>
      <p>See also our <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Notice</a>.</p>

      <div class="eyebrow">Legal</div>
      <h1>HomeSignal Refund Policy</h1>
      <p>Last updated October 12, 2026. How billing, cancellation and refund requests work for HomeSignal purchases.</p>
    </div>
    <div class="block prose" style="max-width:840px">
      <div class="cnote"><b>The short version:</b> cancelling stops future charges, and a refund is a separate request. For purchases processed through Paddle, Paddle handles billing, cancellations and refund requests. HomeSignal handles the product and technical support.</div>

      <h2 class="bt">Who handles what</h2>
      <p>When a purchase is processed through Paddle, Paddle is the merchant of record for that transaction. Paddle collects payment and applicable taxes, and handles payment-related refund requests, billing problems and subscription cancellations. You can visit <a href="https://paddle.net" rel="noopener">paddle.net</a> or use the support links in your Paddle receipt.</p>
      <p>HomeSignal provides the product and technical support at <a href="mailto:hello@homesignal.net">hello@homesignal.net</a>. HomeSignal cannot approve or issue a refund for a Paddle transaction. Paddle decides refund requests under its <a href="https://www.paddle.com/legal/refund-policy" rel="noopener">Refund Policy</a> and <a href="https://www.paddle.com/legal/buyer-terms" rel="noopener">Buyer Terms</a>.</p>
      <p>The provider that processes your purchase, and its terms, are shown at checkout and on your receipt. If a purchase is processed by a different provider, that provider&#8217;s terms and receipt links apply to it, and you can email us to be pointed to the right place.</p>

      <h2 class="bt">HomeSignal Development Activity: $79 per month</h2>
      <p>HomeSignal Development Activity provides quality-of-life intelligence on development activity. The paid plan costs $79 per month and includes 100 new Development Activity reports each month. It is a recurring monthly subscription: while it is active, it renews and bills automatically each month until you cancel. Free evaluation reports (10 for an individual account) are not a paid subscription and are not charged. Brokerage and enterprise arrangements are made by custom quote under a separate agreement, which sets their billing and refund terms.</p>
      <p><b>To cancel</b> a subscription managed by Paddle, use the cancellation or manage-subscription link in your Paddle receipt, or go to <a href="https://paddle.net" rel="noopener">paddle.net</a>. Cancelling prevents the next renewal charge, and paid access continues through the end of the billing period already paid. If you cannot find the link, email us and we will help you reach the right place.</p>
      <p><b>Cancelling is not a refund.</b> Cancelling does not by itself refund a charge that was already made. Refund requests for a Paddle-processed charge are decided by Paddle under its Refund Policy and any consumer rights that apply to you. HomeSignal does not promise a refund period or an automatic refund.</p>

      <h2 class="bt">Product problems</h2>
      <p>If a HomeSignal report or alert does not work as described, email <a href="mailto:hello@homesignal.net">hello@homesignal.net</a> with your account email and what happened, and we will work to fix it. You do not have to wait for us before asking for a refund: Paddle&#8217;s Refund Policy can set time limits on requests, so if you want a refund considered, submit it through Paddle promptly. If a defect is not resolved, you can ask Paddle for a refund and tell them what happened.</p>

      <h2 class="bt">Your legal rights</h2>
      <p>Nothing in this policy limits any rights you have under applicable law that cannot be waived, including any statutory right to withdraw from a purchase that applies where you live. Those rights are handled as described in Paddle&#8217;s Refund Policy for Paddle transactions.</p>

      <h2 class="bt">Contact</h2>
      <p><a href="mailto:hello@homesignal.net">hello@homesignal.net</a> or the <a href="contact.html">contact page</a>. For billing, see <a href="https://paddle.net" rel="noopener">paddle.net</a>. See also our <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Notice</a>.</p>

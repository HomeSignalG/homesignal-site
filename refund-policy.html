      <div class="eyebrow">Legal</div>
      <h1>HomeSignal Refund Policy</h1>
      <p>This policy explains billing, cancellation, and refund requests for HomeSignal Development Activity subscriptions.</p>
    </div>
    <div class="block prose" style="max-width:840px">
      <h2 class="bt">The short version</h2>
      <p>Cancelling a monthly subscription prevents future renewal charges but does not automatically refund a payment already made.</p>
      <p>For purchases processed through Paddle, Paddle handles billing and refund requests. HomeSignal provides software and product support.</p>

      <h2 class="bt">Who this applies to</h2>
      <p>This policy applies to the HomeSignal Development Activity Professional subscription, offered at $79 per month for 100 new Development Activity reports each month.</p>
      <p>Eligible free evaluation reports do not require payment.</p>

      <h2 class="bt">How to request a refund</h2>
      <p>If your purchase was processed through Paddle, you may request a refund using the support link in your Paddle receipt or by visiting <a href="https://paddle.net" rel="noopener">https://paddle.net</a>.</p>
      <p>Refund eligibility is governed by Paddle's Refund Policy at <a href="https://www.paddle.com/legal/refund-policy" rel="noopener">https://www.paddle.com/legal/refund-policy</a> and applicable law.</p>
      <p>Submitting a refund request does not guarantee approval.</p>
      <p>If your payment was processed by another provider, use the support information on your receipt or contact HomeSignal for assistance.</p>

      <h2 class="bt">Technical or product problems</h2>
      <p>For problems accessing HomeSignal or using a Development Activity report, contact:<br>Email: <a href="mailto:hello@homesignal.net">hello@homesignal.net</a><br>Phone: <a href="tel:+15716019432">571-601-9432</a></p>
      <p>HomeSignal assists customers with investigating and resolving product-related problems.</p>
      <p>For unresolved problems involving a Paddle-processed purchase, customers may also contact Paddle Buyer Support.</p>

      <h2 class="bt">If a refund is approved</h2>
      <p>For Paddle-processed purchases, Paddle handles approved refunds in accordance with its policies and applicable law.</p>
      <p>Refunds are generally returned to the original payment method where possible. Processing times depend on the payment provider and financial institution.</p>

      <h2 class="bt">Subscription cancellation</h2>
      <p>HomeSignal Development Activity is a recurring monthly subscription.</p>
      <p>Customers may cancel an active subscription to prevent future renewal charges.</p>
      <p>For Paddle-processed subscriptions, cancellation is available through the subscription-management link in the Paddle receipt or <a href="https://paddle.net" rel="noopener">https://paddle.net</a>.</p>
      <p>Paid access normally continues until the end of the current paid billing period.</p>
      <p>Cancellation does not automatically refund previous charges.</p>

      <h2 class="bt">Your legal rights</h2>
      <p>Nothing in this policy limits mandatory consumer rights under applicable law.</p>

      <h2 class="bt">Contact</h2>
      <p>HomeSignal product and technical support:<br>Email: <a href="mailto:hello@homesignal.net">hello@homesignal.net</a><br>Phone: <a href="tel:+15716019432">571-601-9432</a></p>
      <p>Paddle payment, billing, and refund support:<br><a href="https://paddle.net" rel="noopener">https://paddle.net</a></p>
      <p>See also our <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Notice</a>.</p>

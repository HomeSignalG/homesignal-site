      <div class="eyebrow">Legal</div>
      <h1>HomeSignal Refund Policy</h1>
      <p>Last updated November 27, 2026. This policy covers the paid plans of HomeSignal Development Activity: Professional at $78 per month and the Private Partner Offer at $234 for six months. There is no free plan and no free trial.</p>
    </div>
    <div class="block prose" style="max-width:840px">
      <h2 class="bt">Who handles your payment</h2>
      <p>Our order process is conducted by our online reseller Paddle.com. Paddle.com is the Merchant of Record for all orders. It takes your payment, charges any sales tax or VAT, issues your receipt, and issues refunds, under its <a href="https://www.paddle.com/legal/checkout-buyer-terms" rel="noopener">Checkout Buyer Terms</a> and its <a href="https://www.paddle.com/legal/refund-policy" rel="noopener">Refund Policy</a>. Refunds and billing questions are handled by Paddle, not by HomeSignal. HomeSignal does not process refunds, and the decision and the payment of any refund are Paddle&rsquo;s, under the law where you live.</p>

      <h2 class="bt">Professional ($78 per month)</h2>
      <ul>
        <li><strong>Cancel any time.</strong> Cancel from the billing section of your account (it opens Paddle&rsquo;s management page). Cancelling stops the next renewal. You keep access to the end of the period you have paid for, then the subscription ends.</li>
        <li><strong>Refunds.</strong> All sales are final. We do not offer refunds, including for a month you did not fully use or reports you did not use. Where the law gives you a right to a refund or to withdraw from the purchase (for example a statutory cooling-off period), that right applies and nothing in this policy limits it.</li>
        <li><strong>Mistakes.</strong> If you were charged twice, or charged after a cancellation you completed in time, contact Paddle using the link in your Paddle receipt.</li>
      </ul>

      <h2 class="bt">Private Partner Offer ($234, six months)</h2>
      <ul>
        <li><strong>One payment, no renewal.</strong> You are charged once. Access ends automatically six months after purchase, nothing is charged again, and there is nothing to cancel.</li>
        <li><strong>Refunds.</strong> All sales are final. We do not offer refunds, including for a month you did not fully use or reports you did not use. Where the law gives you a right to a refund or to withdraw from the purchase, that right applies and nothing in this policy limits it.</li>
        <li><strong>Eligibility.</strong> The offer is for eligible members of the partner brokerage that gave you the private link, and we re-check that membership every 30 days (the interval can differ by partner brokerage). A late check does not end your access. If we confirm that you were not or are no longer eligible, access to new reports is suspended.</li>
        <li><strong>Mistakes.</strong> The same duplicate-charge route (Paddle), and the same legal rights, as above apply.</li>
      </ul>

      <h2 class="bt">What a refund does to your access</h2>
      <p>As our own rule, a full refund or a chargeback ends your access to the plan it refunds immediately. A partial refund does not change your access. Reports you made while your plan was active remain available to open, share, download and print.</p>

      <h2 class="bt">How to ask for a refund or billing help</h2>
      <p>Contact Paddle, using the link in your Paddle receipt. HomeSignal does not handle refunds or billing questions.</p>
      <p>See also our <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Notice</a>.</p>

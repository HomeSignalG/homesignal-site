    <section>
      <h2>Your MLS tells you about the property.<br>HomeSignal tells you what’s changing around it.</h2>
      <p>Your client can see the house.</p>
      <p>You know the neighborhood.</p>
      <p>But it can be much harder to know that a residential project has been proposed nearby, a commercial project was approved, a permit was issued down the road, or infrastructure work is moving forward.</p>
      <p>That’s the gap HomeSignal Development Activity is built to fill.</p>
    </section>

    <!-- 9. WHAT THE REPORT ANSWERS + Type / Stage -->
    <section>
      <h2>See development before it becomes obvious</h2>
      <p>Enter a property address and HomeSignal organizes Development Activity found in its covered official sources around that property.</p>
      <h3 style="margin-top:26px">Scan by Type. Understand the Stage.</h3>
      <p>Quickly isolate Residential, Commercial, Industrial, Data Center, Roads &amp; Infrastructure, or Civic &amp; Public activity—and see whether each project is proposed, approved, permitted, or under construction.</p>
      <div class="da-cols2" style="margin:18px 0 6px">

          <ul class="da-list">
            <li>Residential</li>
            <li>Commercial</li>
            <li>Industrial</li>
            <li>Data Center</li>
            <li>Roads &amp; Infrastructure</li>
            <li>Civic &amp; Public</li>
            <li>Other Project only as a fallback when no more specific Type is supported</li>
          </ul>
        </div>
        <div>
          <h3>Stage — how far along is it?</h3>
          <ul class="da-list">
            <li>Approved / Coming</li>
            <li>Proposed / Under Review</li>
            <li>Permitted / Under Construction</li>
          </ul>
          <p style="margin-top:14px">Select a Type and see it across every Stage, without scrolling through each one.</p>
        </div>
      </div>
      <p style="margin-top:26px;font-weight:700;color:var(--ink)">The report helps the agent understand:</p>
      <dl class="da-def">
        <dt>Approved / Coming</dt>
        <dd>Projects that have moved beyond the proposal stage and have publisher evidence supporting the stronger status.</dd>
        <dt>Proposed / Under Review</dt>
        <dd>Applications and projects that are still being considered.</dd>
        <dt>Permitted / Under Construction</dt>
        <dd>Projects shown here only when official evidence explicitly supports permit or construction status.</dd>
        <dt>Things to Review With Your Client</dt>
        <dd>Nearby official records that may warrant a client conversation or further investigation.</dd>
        <dt>Official Evidence &amp; Coverage</dt>
        <dd>The source, published timing, status, freshness, limitations and official links behind the report.</dd>
        <dt>Keep Watching</dt>
        <dd>Continue monitoring the property for meaningful official changes.</dd>
      </dl>
    </section>

    <section>
      <h2>Not another neighborhood report</h2>
      <p>HomeSignal is intentionally different.</p>
      <p>We don’t try to tell an experienced agent where the nearest school is, what restaurants are nearby, where the grocery store is, or what the neighborhood is like.</p>
      <p>You already know your market.</p>
      <p>HomeSignal focuses on information that is much harder to keep track of: what’s being planned, approved, permitted and changed around the property.</p>
      <p class="da-muted">This report focuses on development activity and change. It is not an inventory of existing schools, parks, businesses, buildings or neighborhood amenities.</p>
    </section>

<script src="lib/templates.js?v=49ae3c36"></script>
<script src="lib/premium-waitlist.js?v=02c305ee"></script>
<script src="lib/community-request.js?v=e1d9c7d7"></script>
<script src="shell.js?v=d066a57f"></script>
<script>
/* Development Activity landing page.
   Two behaviours, both built on existing HomeSignal code:
   (1) COVERAGE CHECK. Reuses HS.data.isCovered (the same authority the shell's "Add a zip code" uses)
       and, for an address, the same geocode-address edge function the shell's "Add an address" uses.
       It can prove exactly two things: the ZIP is inside the HomeSignal ZIP network, or it is not.
       It does NOT classify Report-Ready / Change-Ready / Limited Coverage: that preflight does not exist
       yet (frozen plan, Master Step 10), so this page never claims it.
   (2) SAMPLE REPORT. A structural sample with illustrative entries. Type and Stage are separate fields;
       the Type filter narrows the same list across all three Stage sections. Stage labels are display
       groupings only and create no lifecycle value (founder ruling R2). Every count is computed from
       the entries below, so the numbers on the page cannot disagree with the list.
   The commerce buttons are inert (aria-disabled) and HIDDEN (founder, 2026-10-02): the 20-report entitlement
   and the $79/month checkout are launch blockers (plan sections 18 and 25). */
(function () {
  'use strict';

  // ---------------------------------------------------------------- coverage check
  function coverageResult(kind, headline, body, note) {
    var box = document.getElementById('daCoverResult');
    box.className = 'da-result ' + kind;
    box.textContent = '';
    if (headline) { var b = document.createElement('b'); b.textContent = headline; box.appendChild(b); }
    box.appendChild(document.createTextNode(body));
    if (note) { var s = document.createElement('small'); s.textContent = note; box.appendChild(s); }
    box.hidden = false;
  }
  async function resolveZip(raw) {
    if (/^\d{5}$/.test(raw)) return { zip: raw, matched: null };
    if (raw.length < 8 || raw.indexOf(' ') < 0) return { bad: true };
    var m = null;
    try {
      var r = await HS.sb().functions.invoke('geocode-address', { body: { address: raw } });
      if (r.error) return { unavailable: true };
      m = (r.data && r.data.match) || null;
    } catch (e) { return { unavailable: true }; }
    if (!m || !m.zip) return { nomatch: true };
    return { zip: String(m.zip).slice(0, 5), matched: m.matchedAddress || raw };
  }
  async function checkCoverage() {
    var input = document.getElementById('daCoverInput'), btn = document.getElementById('daCoverBtn');
    var raw = input.value.trim();
    if (!raw) { coverageResult('err', '', 'Enter a property address or a 5-digit ZIP.'); return; }
    btn.disabled = true;
    try {
      var z = await resolveZip(raw);
      if (z.bad) { coverageResult('err', '', 'Enter a full street address, or a 5-digit ZIP.'); return; }
      if (z.unavailable) { coverageResult('err', '', 'The address service couldn’t be reached. Try again in a minute. This is not a coverage result.'); return; }
      if (z.nomatch) { coverageResult('err', '', 'We couldn’t confirm that address against U.S. Census records. Try a different spelling, or add the city or ZIP.'); return; }
      var covered;
      try { covered = await HS.data.isCovered(z.zip); } catch (e) { covered = null; }
      if (covered === null) { coverageResult('err', '', 'The coverage check couldn’t be reached. Try again in a minute. This is not a coverage result.'); return; }
      var where = (z.matched ? z.matched + ' · ' : '') + 'ZIP ' + z.zip;
      if (covered) {
        coverageResult('in', 'INSIDE THE PRODUCT NETWORK', where + '. Source depth and report readiness vary by property.',
          'This check does not determine report-ready or change-ready status.');
      } else {
        coverageResult('out', 'OUTSIDE COVERAGE', where + '. The property resolves outside HomeSignal’s canonical 12,722-ZIP product network.');
      }
    } finally { btn.disabled = false; }
  }

  // ---------------------------------------------------------------- sample report
  var TYPES = [
    { key: 'all', label: 'All' },
    { key: 'residential', label: 'Residential' },
    { key: 'commercial', label: 'Commercial' },
    { key: 'industrial', label: 'Industrial' },
    { key: 'datacenter', label: 'Data Center' },
    { key: 'infrastructure', label: 'Roads & Infrastructure' },
    { key: 'civic', label: 'Civic & Public' },
    { key: 'other', label: 'Other Project' }   // fallback Type: its chip renders only when an entry carries it
  ];
  var STAGES = [
    { key: 'approved',  label: 'Approved / Coming' },
    { key: 'proposed',  label: 'Proposed / Under Review' },
    { key: 'permitted', label: 'Permitted / Under Construction' }
  ];
  // Illustrative entries. dist is miles from the sample property; angle only positions the plot marker.
  var ITEMS = [
    { n: 1, type: 'residential',    stage: 'approved',  dist: 0.3, angle: 35,  date: '2026-09-24', title: '186-unit project approved',                    status: 'Approved',                        review: 'Review published project details and construction timing.', source: 'County Planning Commission' },
    { n: 2, type: 'commercial',     stage: 'approved',  dist: 0.4, angle: 160, date: '2026-09-17', title: 'Retail building site plan approved',           status: 'Site plan approved',              review: 'Review the approved site plan and timing.',                 source: 'City Planning Department' },
    { n: 3, type: 'civic',          stage: 'approved',  dist: 0.5, angle: 250, date: '2026-09-10', title: 'School expansion approved',                    status: 'Approved',                        review: 'Review published project details and schedule.',            source: 'School District Board' },
    { n: 4, type: 'residential',    stage: 'proposed',  dist: 0.2, angle: 100, date: '2026-09-22', title: 'Subdivision application under review',        status: 'Application under review',        review: 'Review application and hearing schedule.',                  source: 'City Planning Department' },
    { n: 5, type: 'infrastructure', stage: 'proposed',  dist: 0.4, angle: 330, date: '2026-09-19', title: 'Planning application under review',            status: 'Application under review',        review: 'Review application and agency schedule.',                   source: 'State Transportation Department' },
    { n: 6, type: 'industrial',     stage: 'proposed',  dist: 0.3, angle: 205, date: '2026-09-15', title: 'Warehouse site-plan application filed',        status: 'Application filed',               review: 'Review application and hearing schedule.',                  source: 'County Planning Commission' },
    { n: 7, type: 'datacenter',     stage: 'proposed',  dist: 0.5, angle: 65,  date: '2026-09-12', title: 'Rezoning application for a data center campus', status: 'Rezoning application under review', review: 'Review application and hearing schedule.',               source: 'County Planning Commission' },
    { n: 8, type: 'residential',    stage: 'permitted', dist: 0.4, angle: 292, date: '2026-09-20', title: 'Townhome building permits issued',             status: 'Permit issued',                   review: 'Review permit details and construction timing.',            source: 'City Building Department' },
    { n: 9, type: 'infrastructure', stage: 'permitted', dist: 0.2, angle: 355, date: '2026-09-08', title: 'Road widening under construction',             status: 'Construction started',            review: 'Review project details and construction schedule.',         source: 'State Transportation Department' }
  ];
  var state = { type: 'all', sel: null };
  var NS = 'http://www.w3.org/2000/svg';
  var ITEM_BY = {};
  var chips = {}, stageEls = {};

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function svg(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function labelOf(list, key) { for (var i = 0; i < list.length; i++) if (list[i].key === key) return list[i].label; return key; }
  function fmt(iso) { return new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
  function count(pred) { return ITEMS.filter(pred).length; }

  // A stage marker is drawn by shape AND outline, never colour alone:
  // approved = solid circle, proposed = dashed hollow circle, permitted = solid square.
  function markerShape(stage, r) {
    if (stage === 'permitted') return svg('rect', { class: 'da-shape', x: -r, y: -r, width: r * 2, height: r * 2, rx: 3, fill: '#0f5c37', stroke: '#0f5c37', 'stroke-width': 2 });
    if (stage === 'proposed') return svg('circle', { class: 'da-shape', r: r, fill: '#fff', stroke: '#c47a1a', 'stroke-width': 2, 'stroke-dasharray': '3 2.5' });
    return svg('circle', { class: 'da-shape', r: r, fill: '#157a49', stroke: '#157a49', 'stroke-width': 2 });
  }
  function markerInk(stage) { return stage === 'proposed' ? '#c47a1a' : '#fff'; }

  function buildActivity() {
    var m = document.getElementById('daMetrics');
    STAGES.forEach(function (s) {
      var d = el('div', 'da-metric');
      d.appendChild(el('b', '', String(count(function (i) { return i.stage === s.key; }))));
      d.appendChild(el('span', '', s.label));
      m.appendChild(d);
    });
    var latest = ITEMS.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; })[0];
    document.getElementById('daRecent').textContent = 'Most recent: ' + labelOf(TYPES, latest.type) + ' — ' + latest.title + ' · ' + latest.dist.toFixed(1) + ' mi · ' + fmt(latest.date);
    document.getElementById('daGenerated').textContent = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function buildScan() {
    var host = document.getElementById('daTypeChips');
    TYPES.forEach(function (t) {
      if (t.key === 'other' && !count(function (i) { return i.type === 'other'; })) return;
      var b = el('button', 'wchip da-chip', t.label);
      b.type = 'button';
      b.setAttribute('aria-pressed', t.key === 'all' ? 'true' : 'false');
      b.dataset.type = t.key;
      b.addEventListener('click', function () { state.type = t.key; apply(); });
      chips[t.key] = b;
      host.appendChild(b);
    });
    var sl = document.getElementById('daStageLinks');
    STAGES.forEach(function (s) {
      var a = el('a', 'da-stagelink', s.label);
      a.href = '#daStage-' + s.key;
      var c = el('b', '', '');
      a.appendChild(c);
      stageEls[s.key] = { navCount: c };
      sl.appendChild(a);
    });
  }

  function buildPlot() {
    var p = document.getElementById('daPlot'), C = 180, R = 150;
    [1, 0.5].forEach(function (f) { p.appendChild(svg('circle', { cx: C, cy: C, r: R * f, fill: 'none', stroke: '#e4e8e4', 'stroke-width': 1, 'stroke-dasharray': f === 1 ? '' : '2 4' })); });
    p.appendChild(svg('line', { x1: C - R, y1: C, x2: C + R, y2: C, stroke: '#eef1ee', 'stroke-width': 1 }));
    p.appendChild(svg('line', { x1: C, y1: C - R, x2: C, y2: C + R, stroke: '#eef1ee', 'stroke-width': 1 }));
    var t = svg('text', { x: C + R - 4, y: C - 8, 'text-anchor': 'end', 'font-size': 10, fill: '#83918a', 'font-family': 'inherit' });
    t.textContent = '0.5 mi';
    p.appendChild(t);
    var subj = svg('g', {});
    subj.appendChild(svg('rect', { x: C - 7, y: C - 7, width: 14, height: 14, fill: '#16211c', transform: 'rotate(45 ' + C + ' ' + C + ')' }));
    var st = svg('text', { x: C, y: C + 24, 'text-anchor': 'middle', 'font-size': 10, 'font-weight': 700, fill: '#16211c', 'font-family': 'inherit' });
    st.textContent = 'Property';
    subj.appendChild(st);
    p.appendChild(subj);
    ITEMS.forEach(function (it) {
      var r = (it.dist / 0.5) * R, th = it.angle * Math.PI / 180;
      var g = svg('g', { class: 'da-mk', tabindex: '0', role: 'button', transform: 'translate(' + (C + r * Math.cos(th)).toFixed(1) + ' ' + (C - r * Math.sin(th)).toFixed(1) + ')' });
      g.setAttribute('aria-label', 'Project ' + it.n + ': ' + it.title + ', ' + labelOf(TYPES, it.type) + ', ' + labelOf(STAGES, it.stage) + ', ' + it.dist.toFixed(1) + ' miles');
      g.appendChild(markerShape(it.stage, 11));
      var tx = svg('text', { fill: markerInk(it.stage) });
      tx.textContent = String(it.n);
      g.appendChild(tx);
      g.addEventListener('click', function () { select(it.n); });
      g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(it.n); } });
      p.appendChild(g);
      it.mk = g;
    });
    var lg = document.getElementById('daLegend');
    STAGES.forEach(function (s) {
      var li = el('li');
      var sv = svg('svg', { width: 24, height: 24, viewBox: '-12 -12 24 24', 'aria-hidden': 'true' });
      sv.appendChild(markerShape(s.key, 8));
      li.appendChild(sv);
      li.appendChild(document.createTextNode(s.label));
      lg.appendChild(li);
    });
  }

  function buildStages() {
    var host = document.getElementById('daStages');
    STAGES.forEach(function (s) {
      var sec = el('div', 'da-stage');
      sec.id = 'daStage-' + s.key;
      var head = el('div', 'da-stagehead');
      head.appendChild(el('h3', '', s.label));
      var cnt = el('span', '', '');
      head.appendChild(cnt);
      sec.appendChild(head);
      var empty = el('p', 'da-empty', '');
      empty.hidden = true;
      sec.appendChild(empty);
      var cards = el('div', 'da-cards');
      ITEMS.filter(function (i) { return i.stage === s.key; }).forEach(function (it) {
        var c = el('article', 'da-card');
        c.tabIndex = 0;
        c.dataset.n = String(it.n);
        c.dataset.type = it.type;
        c.dataset.stage = it.stage;
        var h = el('h4');
        h.appendChild(el('span', 'da-num', String(it.n)));
        h.appendChild(document.createTextNode(it.title));
        c.appendChild(h);
        var tags = el('div', 'da-tags');
        var ts = el('span', 'da-tag da-s-' + it.stage);
        ts.appendChild(el('i', '', 'Stage'));
        ts.appendChild(document.createTextNode(s.label));
        var tt = el('span', 'da-tag');
        tt.appendChild(el('i', '', 'Type'));
        tt.appendChild(document.createTextNode(labelOf(TYPES, it.type)));
        tags.appendChild(ts); tags.appendChild(tt);
        tags.appendChild(el('span', 'da-tag', it.dist.toFixed(1) + ' mi'));
        c.appendChild(tags);
        c.appendChild(el('p', '', 'Publisher status: ' + it.status + ' · ' + fmt(it.date)));
        c.appendChild(el('p', '', it.review));
        c.appendChild(el('p', 'da-src', it.source + ' · Official source →'));
        c.addEventListener('click', function () { select(it.n); });
        c.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(it.n); } });
        it.card = c;
        cards.appendChild(c);
      });
      sec.appendChild(cards);
      stageEls[s.key].count = cnt;
      stageEls[s.key].empty = empty;
      stageEls[s.key].cards = cards;
      host.appendChild(sec);
    });
  }

  function select(n) {
    state.sel = state.sel === n ? null : n;
    ITEMS.forEach(function (it) {
      var on = it.n === state.sel;
      it.card.classList.toggle('sel', on);
      it.mk.classList.toggle('sel', on);
    });
  }

  // One function decides what is shown: the same Type predicate hides cards and dims markers.
  function apply() {
    var t = state.type, tl = labelOf(TYPES, t);
    var match = function (it) { return t === 'all' || it.type === t; };
    ITEMS.forEach(function (it) {
      var on = match(it);
      it.card.hidden = !on;
      it.mk.classList.toggle('dim', !on);
      it.mk.setAttribute('aria-hidden', on ? 'false' : 'true');
      it.mk.setAttribute('tabindex', on ? '0' : '-1');
    });
    if (state.sel && !match(ITEM_BY[state.sel])) select(state.sel);
    Object.keys(chips).forEach(function (k) { chips[k].setAttribute('aria-pressed', k === t ? 'true' : 'false'); });
    var total = 0, parts = [];
    STAGES.forEach(function (s) {
      var n = count(function (i) { return i.stage === s.key && match(i); });
      total += n;
      stageEls[s.key].navCount.textContent = String(n);
      stageEls[s.key].count.textContent = n + (n === 1 ? ' project' : ' projects');
      stageEls[s.key].empty.hidden = n > 0;
      stageEls[s.key].empty.textContent = n > 0 ? '' : 'No ' + tl + ' projects in this stage in this sample.';
      stageEls[s.key].cards.hidden = n === 0;
      parts.push(s.label + ' ' + n);
    });
    document.getElementById('daFilterStatus').textContent = t === 'all'
      ? 'Showing all ' + total + ' projects across the three Stage sections.'
      : 'Showing ' + total + ' ' + tl + (total === 1 ? ' project' : ' projects') + ' across the three Stage sections: ' + parts.join(' · ') + '.';
  }

  function init() {
    ITEMS.forEach(function (it) { ITEM_BY[it.n] = it; });
    buildActivity(); buildScan(); buildPlot(); buildStages(); apply();
    document.getElementById('daCoverBtn').addEventListener('click', checkCoverage);
    document.getElementById('daHeroCheck').addEventListener('click', function () {
      setTimeout(function () { var i = document.getElementById('daCoverInput'); if (i) i.focus({ preventScroll: true }); }, 0);
    });
    // The commerce buttons are inert until entitlement and checkout exist.
    document.querySelectorAll('.da-off').forEach(function (b) {
      b.addEventListener('click', function (e) { e.preventDefault(); });
    });
  }
  HS.onReady(init);
})();
</script>
</body>
</html>

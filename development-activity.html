<script>
/* Development Activity landing page.
   Two behaviours, both built on existing HomeSignal code:
   (1) COVERAGE CHECK. Reuses HS.data.isCovered (the same authority the shell's "Add a zip code" uses)
       and, for an address, the same geocode-address edge function the shell's "Add an address" uses.
       It can prove exactly two things: the ZIP is inside the HomeSignal ZIP network, or it is not.
       It does NOT classify Report-Ready / Change-Ready / Limited Coverage: that preflight does not exist
       yet (frozen plan, Master Step 10), so this page never claims it.
   (2) SAMPLE REPORT. Drawn by lib/da-report-view.js, the one view every customer report uses, over illustrative
       entries shaped like the engine's response. This page owns no report layout, so the sample cannot drift from
       the real report; Type, Stage, counts, map and table all come from the view.
   The three Start free buttons are inert (aria-disabled) and HIDDEN (founder, 2026-10-02): the 100-report entitlement
   entitlement is a launch blocker (plan sections 18 and 25); the old Join link is a link, not a button. */
(function () {
  'use strict';

  // ---------------------------------------------------------------- coverage check
  function coverageResult(kind, headline, body, note) {
    var box = document.getElementById('daCoverResult');
    box.className = 'da-result ' + kind;
    box.textContent = '';
    if (headline) { var b = document.createElement('b'); b.textContent = headline; box.appendChild(b); }
    box.appendChild(document.createTextNode(body));
    if (note) { var s = document.createElement('small'); s.textContent = note; box.appendChild(s); }
    box.hidden = false;
  }
  async function resolveZip(raw) {
    if (/^\d{5}$/.test(raw)) return { zip: raw, matched: null };
    if (raw.length < 8 || raw.indexOf(' ') < 0) return { bad: true };
    var m = null;
    try {
      var r = await HS.sb().functions.invoke('geocode-address', { body: { address: raw } });
      if (r.error) return { unavailable: true };
      m = (r.data && r.data.match) || null;
    } catch (e) { return { unavailable: true }; }
    if (!m || !m.zip) return { nomatch: true };
    return { zip: String(m.zip).slice(0, 5), matched: m.matchedAddress || raw };
  }
  async function checkCoverage() {
    var input = document.getElementById('daCoverInput'), btn = document.getElementById('daCoverBtn');
    var raw = input.value.trim();
    if (!raw) { coverageResult('err', '', 'Enter a property address or a 5-digit ZIP.'); return; }
    btn.disabled = true;
    try {
      var z = await resolveZip(raw);
      if (z.bad) { coverageResult('err', '', 'Enter a full street address, or a 5-digit ZIP.'); return; }
      if (z.unavailable) { coverageResult('err', '', 'The address service couldn’t be reached. Try again in a minute. This is not a coverage result.'); return; }
      if (z.nomatch) { coverageResult('err', '', 'We couldn’t confirm that address against U.S. Census records. Try a different spelling, or add the city or ZIP.'); return; }
      var covered;
      try { covered = await HS.data.isCovered(z.zip); } catch (e) { covered = null; }
      if (covered === null) { coverageResult('err', '', 'The coverage check couldn’t be reached. Try again in a minute. This is not a coverage result.'); return; }
      var where = (z.matched ? z.matched + ' · ' : '') + 'ZIP ' + z.zip;
      if (covered) {
        coverageResult('in', 'INSIDE THE PRODUCT NETWORK', where + '. Source depth and report readiness vary by property.',
          'This check does not determine report-ready or change-ready status.');
      } else {
        coverageResult('out', 'OUTSIDE COVERAGE', where + '. The property resolves outside HomeSignal’s canonical 12,722-ZIP product network.');
      }
    } finally { btn.disabled = false; }
  }

  // ---------------------------------------------------------------- sample report
  // The sample is drawn by the SAME view that draws every customer report (lib/da-report-view.js), so it cannot drift from the real
  // layout: when the report changes, this section changes with it. What this page supplies is only the DATA, in the shape the national
  // report engine returns. Every entry is illustrative (no real address, project or agency), and no entry carries a link: a real report
  // links each record to its official source. Dates are offsets from today so the sample always reads as a recent report.
  // [id, Type key, stage key, miles, bearing (deg, 0 = north), title, publisher status, publisher stage, event kind, event label, days ago, agency]
  var SAMPLE = [
    ['s1', 'residential',    'approved',  0.3, 40,  '186-unit residential project',           'Approved',                  'Approved',     'approved', 'Approved', 23, 'County Planning Commission'],
    ['s2', 'commercial',     'approved',  0.4, 160, 'Retail building site plan',              'Site plan approved',        'Approved',     'approved', 'Approved', 30, 'City Planning Department'],
    ['s3', 'civic',          'approved',  0.5, 250, 'School expansion',                       'Approved',                  'Approved',     'approved', 'Approved', 37, 'School District Board'],
    ['s4', 'residential',    'proposed',  0.2, 100, 'Subdivision application',                'Application under review',  'Under review', 'filed',    'Filed',    25, 'City Planning Department'],
    ['s5', 'infrastructure', 'proposed',  0.4, 330, 'Road improvement planning application',  'Application under review',  'Under review', 'filed',    'Filed',    28, 'State Transportation Department'],
    ['s6', 'industrial',     'proposed',  0.3, 205, 'Warehouse site-plan application',        'Application filed',         'Accepted',     'filed',    'Filed',    32, 'County Planning Commission'],
    ['s7', 'datacenter',     'proposed',  0.5, 65,  'Rezoning application for a data center campus', 'Rezoning application under review', 'Under review', 'filed', 'Filed', 35, 'County Planning Commission'],
    ['s8', 'residential',    'permitted', 0.4, 292, 'Townhome building permits',              'Approved',                  'Issued',       'issued',   'Issued',   27, 'City Building Department'],
    ['s9', 'infrastructure', 'permitted', 0.2, 355, 'Road widening',                          'Approved',                  'Issued',       'issued',   'Issued',   39, 'State Transportation Department']
  ];
  var STAGE_LABEL = { approved: 'Approved / Coming', proposed: 'Proposed / Under Review', permitted: 'Permitted / Under Construction' };
  function isoDaysAgo(n) { var d = new Date(Date.now() - n * 86400000); return d.toISOString().slice(0, 10); }

  /** The engine's response shape ({ status, report, render }), as national-report.ts returns it, over the illustrative entries. */
  function sampleResponse() {
    var PT = window.HS && window.HS.categoryFor;
    var projects = [], byStage = { approved: [], proposed: [], permitted: [] }, byLife = { approved: [], proposed: [], operating: [], unknown: [] };
    var dist = {}, bearing = {}, activity = [];
    SAMPLE.forEach(function (r) {
      var cat = PT ? PT(r[1]) : null;
      var life = r[2] === 'proposed' ? 'proposed' : 'approved';
      projects.push({
        project_id: r[0], source_family: 'illustrative-sample', name: r[5],
        type: { key: r[1], label: cat ? cat.label : r[1] },
        lifecycle: { key: life, label: life === 'proposed' ? 'Proposed' : 'Approved' },
        stage: { key: r[2], label: STAGE_LABEL[r[2]] },
        publisher_status: r[6], publisher_stage: r[7],
        publisher_event: { kind: r[8], label: r[9], date: isoDaysAgo(r[10]) },
        record_date: { kind: r[8], label: r[9], date: isoDaysAgo(r[10]), older_than_a_year: false, verify: null },
        developer: null, size: null, investment: null,
        source: { url: null, attribution: r[11] }
      });
      byStage[r[2]].push(r[0]); byLife[life].push(r[0]); activity.push(r[0]);
      dist[r[0]] = r[3]; bearing[r[0]] = r[4];
    });
    return {
      status: 'OK',
      report: {
        product: 'HOMESIGNAL DEVELOPMENT ACTIVITY', report_version: 'development-activity-national-3', as_of: isoDaysAgo(0), zip: '', radius_mi: 0.5, recent_days: 90,
        activity: { outcome: 'DEVELOPMENT_SHOWN', label: 'Development shown' },
        coverage: { zip_supported: true, state: 'CHANGE_READY', change_ready: true, area_truncated: false, limitations: [] },
        sections: { what_changed_recently: [], recent_official_activity: activity, by_lifecycle: byLife, by_stage: byStage },
        projects: projects
      },
      render: { distances_mi: dist, bearings_deg: bearing }
    };
  }

  function init() {
    var V = window.HS && window.HS.daReportView, host = document.getElementById('daReport');
    if (V && host) {
      V.mount(host, sampleResponse(), { subject: '1234 Sample Street', label: 'Sample property', brokerage: 'Sample Realty', agent: 'Agent Name', hide: ['compare', 'watch', 'share', 'pdf'] });
    }
    document.getElementById('daCoverBtn').addEventListener('click', checkCoverage);
    // The commerce buttons are inert until entitlement and checkout exist.
    document.querySelectorAll('.da-off').forEach(function (b) {
      b.addEventListener('click', function (e) { e.preventDefault(); });
    });
  }
  HS.onReady(init);
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; form-action 'self'">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://homesignal.net/dashboard.html">
<title>HomeSignal — Reports has moved</title>
<script>
// RETIRED 2026-09-10 (A-019). This page was already hidden from the sidebar; what it
// carried - four static report labels over live data, plus Share - is the Dashboard's
// "Intelligence Reports" module (A-009), which was proven live before this redirect was
// written. Its flagship-project PREVIEW DOCUMENT was deliberately NOT ported: it makes
// claims the product does not back, and A-009 is a capability list, not a document
// renderer. Nothing was invented in its place - no history, no CSV, no PDF, no
// persistence, no scheduling.
//
// Its unguarded projects.sort(...)[0] - which threw on every ZIP carrying no development
// records - is retired with it and is deliberately NOT reproduced; A-009 already guards
// that pick.
//
// Every in-product CTA now targets dashboard.html#dashReports directly, so the designed
// path never hops through this file and there is no redirect loop. The file stays as a
// REDIRECT because the URL is reachable from bookmarks. Query string carried across;
// location.replace, so it does not sit in the back-button history. Same convention as
// maps.html.
(function () {
  var q = window.location.search || '';
  window.location.replace('/dashboard.html' + q + '#dashReports');
})();
</script>
</head>
<body>
<p>Reports is now <a href="/dashboard.html#dashReports">Intelligence Reports on your Dashboard &rarr;</a></p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>HomeSignal — Dashboard</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://server.arcgisonline.com; font-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; worker-src blob:; child-src blob:; connect-src 'self' https://qwnnmljucajnexpxdgxr.supabase.co wss://qwnnmljucajnexpxdgxr.supabase.co https://server.arcgisonline.com https://*.tile.openstreetmap.org; form-action 'self'">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>#dashMap{height:300px}#dashMap .maplibregl-canvas{border-radius:15px}</style>
</head>
<body data-nav="dash">
<template id="hs-content">
  <div class="page">
    <div class="ph">
      <div class="eyebrow">Dashboard</div>
      <h1 id="dashHi">Welcome back</h1>
      <p id="dashSub"></p>
    </div>
    <div class="strip" id="dashStrip"></div>
    <div class="cols">
      <div>
        <div class="block" style="padding:16px 18px">
          <div class="bt-row"><h2>Development Overview</h2><a href="homesignalmap.html" data-znav="homesignalmap.html" id="dashMapLink">Open full map →</a></div>
          <div class="mapwrap dash-mapwrap" id="dashMap" style="box-shadow:none" tabindex="0" role="region" aria-label="Map preview — open the full map"></div>
        </div>
        <div class="block">
          <div class="bt-row"><h2>Needs Your Attention</h2><a href="alerts.html" data-znav="alerts.html" id="dashAttentionAll" style="font-size:12.5px;color:var(--green);text-decoration:none;font-weight:600">All alerts →</a></div>
          <div id="dashAttention"></div>
        </div>
        <div class="block">
          <h2 class="bt">Your Briefing</h2>
          <p class="brief" id="dashBrief"></p>
        </div>
        <div class="bt-row"><h2 style="font-size:15px;margin:0">Recent Changes</h2><a href="alerts.html" data-znav="alerts.html" id="dashAllAlerts" style="font-size:12.5px;color:var(--green);text-decoration:none;font-weight:600">All alerts →</a></div>
        <div id="dashRecent"></div>
      </div>
      <div>
        <div class="block">
          <div class="bt-row"><h2>Your Places</h2><a href="properties.html">Manage →</a></div>
          <div class="bt-row" style="margin:2px 0 4px"><h3 style="font-size:12px;margin:0;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em">Addresses</h3></div>
          <div id="dashProps"></div>
          <button class="addbtn" type="button" style="width:100%;justify-content:center;margin-top:10px" id="dashAddPlace">+ Add Address</button>
          <div class="bt-row" style="margin:14px 0 4px"><h3 style="font-size:12px;margin:0;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em">ZIP Codes</h3><a href="community.html" data-znav="community.html" id="dashZipOpen" style="font-size:12.5px;color:var(--green);text-decoration:none;font-weight:600">Open →</a></div>
          <div id="dashCommunities"></div>
        </div>
        <div class="block">
          <div class="bt-row"><h2 class="bt" style="margin:0"><a href="alerts.html" data-znav="alerts.html" id="dashMeetingsHead" class="section-link">Coming Up</a></h2></div>
          <div id="dashComingUp"></div>
        </div>
        <div class="block" id="dashWatchBlock">
          <div class="bt-row"><h2>Worth Watching</h2><a href="homesignalmap.html" data-znav="homesignalmap.html" id="dashWatchMap">See on map →</a></div>
          <div class="chips" id="dashWatch"></div>
        </div>
        <div class="block">
          <div class="bt-row"><h2>Intelligence Reports</h2><a href="dashboard.html#dashReports" id="dashReportsOpen" style="font-size:12.5px;color:var(--green);text-decoration:none;font-weight:600">Open Reports →</a></div>
          <div id="dashReports"></div>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="config.js"></script>
<script src="seed/delvalle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="lib/data.js"></script>
<script src="lib/topic-prefs.js"></script>
<script src="lib/templates.js?v=5f556744"></script>
<script src="lib/map.js?v=969ce603"></script>
<script src="shell.js?v=3b30734a"></script>
<script>
HS.onReady(async function () {
  var S = HS.state, home = S.activeProperty, zip = S.zip;
  var realHome = HS.realHome();
  var nav = HS.pageHref ? HS.pageHref.bind(HS) : function (p, o) { return HS.navHref(p, (o && o.zip) || zip); };

  // Never hang silently: a failed read renders an honest retry state.
  var c, projects, changes, meetings;
  try {
    c = await HS.data.community(S.zip);
    projects = await HS.data.projects(S.zip, home);
    changes = await HS.data.changes(S.zip, home);
    meetings = await HS.data.meetings(S.zip, home);
  } catch (e) {
    console.warn('[dashboard] data load failed', e);
    document.querySelector('.page').innerHTML = '<div class="ph"><h1>We couldn\'t load your dashboard</h1>'
      + '<p>Your connection may have dropped, or our data service is briefly unavailable.</p></div>'
      + '<button class="btn primary" onclick="location.reload()">Try again</button>';
    return;
  }

  function mapCtx() {
    var o = { zip: zip };
    if (realHome && realHome.id) o.place = realHome.id;
    return o;
  }

  // FIRST-TIME vs RETURNING: a signed-out visitor has never been here — never
  // greet them "Welcome back"; lead with what HomeSignal does. With no homes
  // followed, the subline is an invitation (plus honest sample-ZIP disclosure),
  // never "0 homes followed".
  var name = S.session && S.session.name ? S.session.name.split(' ')[0] : '';
  document.getElementById('dashHi').textContent = S.session
    ? (name ? 'Welcome back, ' + name : 'Welcome back')
    : 'See what\'s changing around your home';
  document.getElementById('dashSub').textContent = S.properties.length
    ? S.properties.length + ' saved place' + (S.properties.length === 1 ? '' : 's') + ' — here\'s what needs you across them.'
    : 'Add your home and we\'ll watch official county and permit records around it'
      + ((HS.isSample && HS.isSample()) ? ' — right now you\'re viewing our sample ZIP code, Del Valle, TX.' : '.');

  // ---------------------------------------------------------------- module pools ----
  // ONE data plane, and it is the one this page already had: current-ZIP community meta,
  // projects, changes and meetings, plus the visitor's saved Addresses and followed ZIPs.
  // No portfolio aggregator, no new API, no ingest change was invented for Phase 3.
  //
  // TWO SIGNALS IN THIS DATA ARE VACUOUS IN PRODUCTION, measured 2026-09-10 over all
  // 168,963 app_changes rows: `impacts` is NULL on 168,963 of them and `quiet` is true on
  // 0. So ranking by impacts.length sorts nothing and filtering on !quiet removes nothing.
  // `window_closes_at` is the only real attention signal there is: 1,622 rows carry one and
  // 1,298 are still open. Every module below is therefore built on a signal that exists,
  // rather than on a field that would make it look populated while ordering at random.
  var liveChanges = changes.filter(function (x) { return !x.quiet; });

  // A-004 NEEDS YOUR ATTENTION — the prioritized ACTION queue: changes whose public
  // comment window is still open, soonest deadline first. This is the queue the
  // "Need Attention" strip metric counts.
  var attention = liveChanges
    .filter(function (x) { var d = HS.daysUntil(x.window_closes_at); return d != null && d >= 0; })
    .sort(function (a, b) { return HS.daysUntil(a.window_closes_at) - HS.daysUntil(b.window_closes_at); });

  // A-003 COMING UP — the merge of today.html's "Action windows" and this page's
  // "Upcoming meetings". BOTH of those rendered MEETINGS (today.html: meetings.map(
  // HS.tpl.meetingRow)), so the merge is one chronological schedule of upcoming public
  // meetings and hearings. It is kept DISJOINT from Needs Your Attention by TYPE — a
  // deadline is an action, a meeting is an appointment — so no item is rendered as a card
  // twice on this page, which is what A-003 forbids.
  var comingUp = meetings.slice().sort(function (a, b) {
    return new Date(a.starts_at || 0) - new Date(b.starts_at || 0);
  });

  // A-002 (Dashboard half) — Place = Address + ZIP Code. The two TYPES stay distinct and
  // keep their own drill-downs; only the Dashboard SUMMARY is unified here. My Places
  // management (All/Addresses/ZIP Codes, Remove Address, + Add ZIP Code) is Phase 4.
  var followedZips = HS.followedCommunities ? HS.followedCommunities() : [];
  var placesMonitored = S.properties.length + followedZips.length;

  // A-001 PORTFOLIO STRIP — exactly four PORTFOLIO metrics, locked.
  // ZIP Score and Growth pressure are deliberately GONE from here: ZIP-health belongs to
  // A-022 on authenticated /community/<zip>/, and A-001 excludes it from this strip by
  // name. Nothing replaced them on Dashboard.
  document.getElementById('dashStrip').innerHTML =
    HS.tpl.statTileLink(placesMonitored, 'Places Monitored', '', 'properties.html')
    + HS.tpl.statTileLink(liveChanges.length, 'New Changes', '', nav('alerts.html', mapCtx()))
    + HS.tpl.statTileLink(attention.length, 'Need Attention', 'accent', nav('alerts.html', Object.assign({ band: 'open' }, mapCtx())))
    + HS.tpl.statTileLink(comingUp.length, 'Coming Up', 'g', nav('alerts.html', Object.assign({ category: 'Government & civic' }, mapCtx())));

  // Stamp ZIP-aware header links (paintNavHrefs runs at boot; re-stamp after we know data).
  var mapHref = nav('homesignalmap.html', mapCtx());
  ['dashMapLink', 'dashWatchMap', 'dashAllAlerts', 'dashZipOpen', 'dashMeetingsHead'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    if (id === 'dashMeetingsHead') el.href = nav('alerts.html', Object.assign({ category: 'Government & civic' }, mapCtx()));
    else if (id === 'dashAllAlerts') el.href = nav('alerts.html', mapCtx());
    else if (id === 'dashZipOpen') el.href = nav('community.html', mapCtx());
    else el.href = mapHref;
  });

  // map preview — HS.buildLive is the guarded backbone chain (GL -> Leaflet raster
  // -> schematic; never throws into this init). NEVER-FAKED rule: the home dot and
  // home-anchored center exist ONLY for a real resident home in this ZIP — otherwise
  // the ZIP centroid (app_community_meta.lat/lng) anchors, else the first record.
  var items = changes.filter(function (x) { return !x.quiet; }).concat(projects)
    .filter(function (x) { return x.lat && x.lng; }).slice(0, 6);
  var dashMap = document.getElementById('dashMap');
  var hasRealHome = !!realHome;
  var center = (hasRealHome ? { lat: home.lat, lng: home.lng } : null)
    || (c && c.lat != null && c.lng != null ? { lat: c.lat, lng: c.lng } : null)
    || (items[0] ? { lat: items[0].lat, lng: items[0].lng } : null);

  function goMapPreview() { location.href = mapHref; }
  function onMarkerClick(it) {
    var href = HS.itemNavHref ? HS.itemNavHref(it, zip) : null;
    if (href) location.href = href;
  }

  HS.buildLive(dashMap, {
    center: center, items: items, home: hasRealHome ? home : null,
    interactive: true, zoom: 12.4, radiusMi: 1.5, w: 640, h: 300,
    itemClick: onMarkerClick,
    onReady: function (map) {
      if (map && map.on) {
        map.on('dragstart', function () { dashMap._hsDragged = true; });
        map.on('dragend', function () { setTimeout(function () { dashMap._hsDragged = false; }, 0); });
      }
    }
  });

  // The preview surface opens the full map; marker clicks route to the record.
  dashMap.style.cursor = 'pointer';
  dashMap.addEventListener('click', function (e) {
    if (dashMap._hsDragged || e.target.closest('[data-hs-map-item]')) return;
    goMapPreview();
  });
  dashMap.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.target.closest('[data-hs-map-item]')) goMapPreview();
  });

  var projectIds = new Set(projects.map(function (p) { return p.id; }));

  // A-006 RECENT CHANGES — a concise cross-portfolio snapshot of what actually changed,
  // not the full Alerts feed and not a "near you" physical-proximity claim. Deliberately
  // capped; "All alerts →" remains the route to the complete record.
  // Ordered by recency: HS.data.changes already returns occurred_at desc, and the previous
  // impacts-based sort was a no-op (impacts is NULL on every production row), so removing
  // it changes nothing except the honesty of the code.
  var recent = liveChanges.slice(0, 2);
  document.getElementById('dashRecent').innerHTML = recent.map(function (ch) {
    var href = HS.itemNavHref ? HS.itemNavHref(ch, zip) : null;
    return HS.tpl.miniCardLink(ch, ch.category, href);
  }).join('');

  // properties — each row selects that place and opens its property page.
  document.getElementById('dashProps').innerHTML = S.properties.map(function (p) {
    return '<a class="swrow swrow-link" href="property.html?id=' + encodeURIComponent(p.id) + '" data-place-id="' + HS.esc(p.id) + '">'
      + '<div class="miniscore">' + (p.score || '') + '</div>'
      + '<div class="pinfo"><div class="pt">' + HS.esc(p.address) + ' <span style="font-size:10px;color:var(--green);font-weight:700">· ' + HS.esc(String(p.tag || p.label || 'home').toUpperCase()) + '</span></div>'
      + '<div class="pa">' + HS.esc(p.city) + '</div></div></a>';
  }).join('');
  document.getElementById('dashProps').addEventListener('click', function (e) {
    var row = e.target.closest('[data-place-id]');
    if (row) HS.selectProperty(row.getAttribute('data-place-id'));
  });

  document.getElementById('dashAddPlace').addEventListener('click', function () { HS.addHome(); });

  // followed ZIP codes
  document.getElementById('dashCommunities').innerHTML = HS.communitiesStripHTML({ zipLabels: true });

  // A-007 WORTH WATCHING — discovery only. Closest REAL project records, as already
  // implemented; each chip is a plain link to its detail page. No follow, watch, notify,
  // watchlist or Map Watch control may be added here.
  var watch = projects.slice()
    .sort(function (a, b) { return (a.distance_mi || 9e9) - (b.distance_mi || 9e9); }).slice(0, 4);
  if (watch.length) {
    document.getElementById('dashWatch').innerHTML = watch.map(function (p) {
      return '<a class="wchip wchip-link" href="' + HS.esc(nav('development.html', { zip: zip, id: p.id })) + '">'
        + HS.esc(p.name) + (p.dist ? ' · ' + HS.esc(p.dist) : '') + '</a>';
    }).join('');
  } else {
    var wb = document.getElementById('dashWatchBlock'); if (wb) wb.style.display = 'none';
  }

  // A-003 COMING UP — one chronological list, each row keeping its TYPE identity so a
  // meeting is still recognisable as a meeting.
  document.getElementById('dashComingUp').innerHTML = comingUp.length
    ? comingUp.map(function (m) {
        var href = HS.meetingNavHref ? HS.meetingNavHref(m, zip, projectIds) : null;
        return HS.tpl.meetingRowLink(m, href);
      }).join('')
    : '<p class="quiet" style="font-size:12.5px;margin:0">Nothing scheduled for this ZIP yet.</p>';

  // A-004 NEEDS YOUR ATTENTION — action rows, not alert cards. Each carries the closing
  // countdown that makes it actionable and links to its own record.
  document.getElementById('dashAttention').innerHTML = attention.length
    ? attention.slice(0, 3).map(function (ch) {
        var d = HS.daysUntil(ch.window_closes_at);
        var href = HS.itemNavHref ? HS.itemNavHref(ch, zip) : null;
        return '<div class="prow"><span class="pk" style="background:var(--red)"></span>'
          + '<div class="pmain"><div class="pt">' + HS.esc(ch.title) + '</div>'
          + '<div class="pd">' + HS.esc(ch.plain_language || '') + '</div>'
          + '<div class="pmeta"><span class="win">◔ Window closes in ' + d + ' day' + (d === 1 ? '' : 's') + '</span></div></div>'
          + (href ? '<a class="btn primary" href="' + HS.esc(href) + '">Act</a>' : '') + '</div>';
      }).join('')
    : '<p class="quiet" style="font-size:12.5px;margin:0">Nothing needs your attention right now.</p>';

  // A-005 YOUR BRIEFING — synthesis. It INTERPRETS what the other modules list; it must
  // never become a second card feed, so it renders as one short paragraph and repeats no
  // card markup.
  var briefBits = [];
  briefBits.push('You are monitoring <b>' + placesMonitored + ' place' + (placesMonitored === 1 ? '' : 's') + '</b>'
    + (c && c.name ? ', and ' + HS.esc(c.name) + ' is the area in view' : '') + '.');
  briefBits.push(liveChanges.length
    ? 'There ' + (liveChanges.length === 1 ? 'is <b>1 change</b>' : 'are <b>' + liveChanges.length + ' changes</b>') + ' on record here.'
    : 'No changes are on record here yet.');
  if (attention.length) {
    var top = attention[0], td = HS.daysUntil(top.window_closes_at);
    briefBits.push('The most time-sensitive is <span class="hl">' + HS.esc(top.title) + '</span> — the comment window closes in '
      + td + ' day' + (td === 1 ? '' : 's') + '.');
  }
  if (comingUp.length) {
    briefBits.push('<b>' + comingUp.length + '</b> public meeting' + (comingUp.length === 1 ? ' is' : 's are') + ' scheduled next.');
  }
  if (c && c.value_trend != null) {
    briefBits.push('Value outlook for this area is <span class="hl">' + HS.trend(c.value_trend) + ' over the next 12 months</span>.');
  }
  document.getElementById('dashBrief').innerHTML = briefBits.join(' ');

  // A-009 INTELLIGENCE REPORTS — the report capability, generated from live data. Nothing
  // is invented — no history, no CSV, no PDF, no persistence, no scheduling.
  //
  // A-019 (Phase 8) retired reports.html to a redirect stub once this module was proven to
  // carry the capability. Every CTA that used to target reports.html now targets THIS
  // module directly (dashboard.html#dashReports), so the designed path never hops through
  // the stub and cannot loop back into it.
  //
  // The flagship pick is GUARDED here. reports.html:38 takes projects.sort(...)[0] with no
  // empty check and dereferences it, which throws on the 1,959 canonical ZIPs that carry no
  // development records (measured 2026-09-10). That defect is recorded and deliberately not
  // fixed in its own file this phase; this module simply must not reproduce it.
  var flagship = projects.slice().sort(function (a, b) {
    return (b.impact_score || 0) - (a.impact_score || 0);
  })[0] || null;
  var reportRows = [
    { icon: '⌂', t: (realHome ? realHome.address : 'Your home') + ' — Property Intelligence Report',
      d: 'Score, nearby projects, risk & value outlook', href: 'dashboard.html#dashReports' },
    { icon: '◍', t: (c && c.zip ? c.zip : zip) + ' — Community Snapshot',
      d: 'What\'s changing across ' + ((c && c.name) || 'this area'), href: nav('community.html', mapCtx()) }
  ];
  if (flagship) {
    reportRows.push({ icon: '◈', t: flagship.name + ' — Impact Analysis',
      d: 'Full project impact, timeline & recommended actions',
      href: nav('development.html', { zip: zip, id: flagship.id }) });
  }
  reportRows.push({ icon: '✉', t: 'Your Weekly Briefing', d: 'The changes that mattered near you this week', href: 'dashboard.html#dashReports' });
  document.getElementById('dashReports').innerHTML = reportRows.map(function (r) {
    return '<a class="swrow swrow-link" href="' + HS.esc(r.href) + '" style="text-decoration:none">'
      + '<div class="miniscore" style="font-size:15px">' + r.icon + '</div>'
      + '<div class="pinfo"><div class="pt">' + HS.esc(r.t) + '</div>'
      + '<div class="pa">' + HS.esc(r.d) + '</div></div></a>';
  }).join('');
});
</script>
</body>
</html>

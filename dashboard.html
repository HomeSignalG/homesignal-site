<link rel="stylesheet" href="app.css?v=20814d85">
<style>
  /* Dashboard-scoped only — app.css is untouched (Fix 8 §1). */
  /* §4: main ~70-75%, rail ~25-30%. app.css ships 1.55fr/.95fr (62/38) for the older pages. */
  .dashpage .cols{grid-template-columns:2.6fr 1fr}
  /* A grid item defaults to min-width:auto, so a column cannot shrink below the min-content
     width of its widest row — and the compact rows below deliberately use white-space:nowrap
     on the type pill and the CTA. Without this the whole page scrolled sideways at 390px
     (measured), which §4 forbids. min-width:0 lets the column shrink; the rows then wrap. */
  .dashpage .cols > *{min-width:0}
  @media(max-width:900px){.dashpage .cols{grid-template-columns:1fr}}
  @media(max-width:560px){
    /* Stack each row's CTA under its content rather than squeezing the title to nothing. */
    .dashpage .crow,.dashpage .drow{flex-wrap:wrap}
    .dashpage .crow .ck{flex:0 0 100%;margin-bottom:2px}
    .dashpage .crow .cmain,.dashpage .drow .dmain{flex:1 1 100%}
    .dashpage .crow .cgo,.dashpage .drow .cgo{margin-top:6px}
    /* The count block is a number and a 250px note side by side, and it is flex:0 0 auto in
       the header — so at 390px it refuses to shrink and pushes the page sideways. Here it
       takes a full row of its own and becomes shrinkable; the note drops its fixed width and
       its left rule, which only reads as a divider when the two sit side by side. */
    .dashpage .dashcount{padding-top:14px;flex:1 1 100%;min-width:0}
    .dashpage .dashcount .note{max-width:none;min-width:0;border-left:0;padding-left:0}
  }
  .dashhead{display:flex;gap:26px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
  .dashhead .dhl{min-width:0;flex:1 1 380px}
  .dashcount{display:flex;gap:18px;align-items:center;flex:0 0 auto;padding-top:4px}
  .dashcount .n{font-size:34px;font-weight:700;line-height:1;letter-spacing:-.02em}
  .dashcount .lbl{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-top:5px}
  .dashcount .note{max-width:250px;font-size:12px;color:var(--ink-2);line-height:1.45;
                   border-left:1px solid var(--line);padding-left:18px}
  @media(max-width:640px){.dashcount .note{border-left:0;padding-left:0}}
  /* Compact list rows — §5 "not large feature cards". */
  .crow{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line-2)}
  .crow:last-child{border-bottom:none}
  /* A FIXED type column, so every title starts at the same x. Without it the pill sizes
     the column per row ("GOVERNMENT NOTICE" is wider than "DEVELOPMENT") and the titles
     step in and out — the approved visual reads as aligned columns. */
  /* 140px, not 132: the widest label ("GOVERNMENT NOTICE") measures 137px, and a pill that
     overflows its basis pushes its own title out of the column — measured as titles at two
     x positions, 454 and 449. The column must fit the widest pill for the column to exist. */
  .crow .ck{flex:0 0 140px}
  .crow .cv{flex:0 0 auto;color:var(--ink-3);font-size:15px;line-height:1;align-self:center}
  .ctype{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
         padding:3px 8px;border-radius:5px;white-space:nowrap}
  .ctype.gov{background:var(--blue-tint);color:var(--blue)}
  .ctype.dev{background:var(--green-tint);color:var(--green-deep)}
  .ctype.news{background:var(--amber-tint);color:var(--amber)}
  .crow .cmain{flex:1 1 auto;min-width:0}
  .crow .ct{font-size:13.8px;font-weight:600;line-height:1.4}
  .crow .cmeta{font-size:11.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .crow .cgo{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--green);text-decoration:none;
             white-space:nowrap;display:inline-block;padding:4px 0;margin:-4px 0}
  .crow .cgo:hover{text-decoration:underline}
  .crow .cgo:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
  /* Official dates — date block + detail. */
  .drow{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line-2)}
  .drow:last-child{border-bottom:none}
  .dblock{flex:0 0 46px;text-align:center;border:1px solid var(--line);border-radius:9px;padding:6px 0;background:#fff}
  .dblock .m{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
  .dblock .d{font-size:17px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
  .drow .dmain{flex:1 1 auto;min-width:0}
  .drow .dt{font-size:13.8px;font-weight:600;line-height:1.4}
  .drow .dmeta{font-size:11.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap}
  .dwin{color:var(--amber);font-weight:600}
  .placerow{display:flex;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line-2);
            text-decoration:none;color:inherit}
  .placerow:last-of-type{border-bottom:none}
  .placerow:hover{background:#f7f9f7}
  .placerow:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px}
  .placerow .pmain{flex:1 1 auto;min-width:0}
  .placerow .pl{font-size:13.3px;font-weight:600;line-height:1.35}
  .placerow .ps{font-size:11.5px;color:var(--ink-3);margin-top:1px}
  .placerow .pc{flex:0 0 auto;color:var(--ink-3);font-size:14px}
  .ptag-kind{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
  /* The shared .bt-row link renders 19px tall. app.css stays untouched (Fix 8 §1), so the
     target is lifted here, on this page only, without moving the text. */
  .dashpage .bt-row a{display:inline-block;padding:3px 0;margin:-3px 0}
  .dnote{font-size:12.5px;color:var(--ink-3);margin:0}
  .dwarn{font-size:12.5px;color:var(--amber);margin:0}
</style>
</head>

<template id="hs-content">
  <div class="page dashpage">
    <div class="ph">
      <div class="dashhead">
        <div class="dhl">
          <h1 style="margin-bottom:6px">Dashboard</h1>
          <p id="dashSub" style="margin:0"></p>
        </div>
        <div class="dashcount" id="dashCount" hidden>
          <div>
            <div class="n" id="dashCountN">—</div>
            <div class="lbl" id="dashCountLbl">Monitored places</div>
          </div>
          <div class="note">Tracking development, government notices, meetings, and local news that may affect your community.</div>
        </div>
      </div>
    </div>

    <div class="cols">
      <div>
        <div class="block">
          <div class="bt-row"><h2>What&rsquo;s Changing?</h2></div>
          <p class="dnote" id="dashChangingSub" style="margin:-8px 0 12px">Relevant updates across all your monitored places.</p>
          <div id="dashChanging"><p class="dnote">Loading updates&hellip;</p></div>
        </div>

        <!-- QUALITY-OF-LIFE IMPACT · PREMIUM
             Phase 1 proved there is no authoritative Quality-of-Life impact plane, so no
             label, score, explanation or direction renders anywhere on this page. This card
             is a ROADMAP STATEMENT and is CONSTANT — it is identical whether every source
             succeeded or every source failed, because it reports on nothing. A data failure
             renders as a data failure, never as this card (§7 "Premium is not a data-quality
             fallback"). Markup reuses app.css .p2/.p2h/.p2t/.p2sub/.inlinebtn — the same
             component the Community and Property Premium cards already use. -->
        <div class="block" style="padding:0;border:none;box-shadow:none;background:none">
          <div class="p2" id="dashQolPremium">
            <div class="p2h" id="dashQolLabel">Quality-of-Life Impact · Premium</div>
            <div class="p2sub" id="dashQolAvail">Coming soon</div>
            <div class="p2t" id="dashQolTitle">Get deeper local insights</div>
            <div class="p2sub" id="dashQolBody" style="margin-bottom:0">See added context around major development, infrastructure, and civic activity across the places you monitor.</div>
            <button type="button" class="inlinebtn" id="dashQolCta" style="margin-top:12px">Get Premium access &rarr;</button>
          </div>
        </div>

        <div class="block">
          <div class="bt-row"><h2>Official Dates to Know</h2></div>
          <div id="dashDates"><p class="dnote">Loading official dates&hellip;</p></div>
        </div>
      </div>

      <div>
        <div class="block">
          <div class="bt-row"><h2>Your Places</h2><a href="properties.html" id="dashManagePlaces">Manage &rarr;</a></div>
          <div id="dashPlaces"></div>
        </div>
        <!-- FOLLOWING (Fix 8J)
             The projects the resident explicitly chose to monitor. A followed project is NOT
             a Place: it is absent from canonicalPlaces, from the monitored-place count, and
             from every content read. This section only confirms the choice and routes to the
             existing Development and My Places surfaces.

             It ships HIDDEN and is REMOVED outright unless a real signed-in session is
             present. shell.js seeds state.follows from localStorage at module scope
             regardless of session, and clearAccountLocalState() (which strips the project:
             keys) runs only on an explicit sign-out or an account-id change — never on a
             session that merely expired. app_projects carries a public anon select policy, so
             on a shared or expired browser those titles are resolvable without a session.
             Removing the node rather than hiding it is deliberate: a hidden h2 still answers
             querySelectorAll, so "hidden" would leave an empty heading in the rail's shape. -->
        <div class="block" id="dashFollowing" hidden>
          <div class="bt-row"><h2>Following</h2><a href="properties.html?view=projects" id="dashManageFollowing">Manage &rarr;</a></div>
          <p class="dnote" style="margin:0 0 12px">Projects you chose to monitor.</p>
          <div id="dashFollowingBody"></div>
        </div>
        <div class="block">
          <div class="bt-row"><h2>Stay Informed</h2></div>
          <p class="dnote" style="margin:0 0 12px">Choose the places and topics you want HomeSignal alerts about.</p>
          <a class="inlinebtn" href="alerts.html" id="dashManageAlerts" style="text-decoration:none">Manage your alerts &rarr;</a>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="config.js"></script>
<script src="seed/delvalle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lib/data.js"></script>
<script src="lib/topic-prefs.js"></script>
<script src="lib/templates.js?v=848593cf"></script>
<script src="lib/dashboard-aggregate.js?v=ee9349c1"></script>
<script src="lib/premium-waitlist.js?v=02c305ee"></script>
<script src="lib/community-request.js?v=e1d9c7d7"></script>
<script src="shell.js?v=01319a72"></script>
<script>
// ============================================================================
// DASHBOARD — ALL MY PLACES INTELLIGENCE BRIEFING (Fix 8)
//
// The scope of this page is the resident's CANONICAL MY PLACES membership and nothing
// else. It never calls HS.ensureViewedZip(), never reads HS.state.zip / myZip /
// sessionStorage viewZip / the active address / a URL ZIP, and never writes any of them.
// Every decision that could go silently wrong lives in lib/dashboard-aggregate.js, which
// test/dashboard-all-places.test.mjs drives directly in Node.
// ============================================================================
HS.onReady(async function () {
  var A = HS.dashAgg;
  var S = HS.state;

  // ---- Following: the session gate, run before anything that can fail ----------------
  // Fix 8J. A followed project is private account data, and this page has no auth gate.
  // state.follows is seeded from localStorage at module scope whatever the session state, and
  // clearAccountLocalState() only fires on an explicit sign-out or an account-id change — so
  // an EXPIRED session still holds the previous resident's project: keys, and app_projects is
  // anon-readable. The node is REMOVED, not hidden: a hidden h2 still answers
  // querySelectorAll, which would leave an empty heading in the rail's shape.
  var followingEl = document.getElementById('dashFollowing');
  if (followingEl && !(S.session && !S.session.demo)) { followingEl.remove(); followingEl = null; }

  // ---- LEGACY ?zip= — strip it FIRST, before any CTA can be clicked -----------------
  // Fix 8 D1 removed dashboard.html from ZIP_NAV_PAGES, so sidebar navigation no longer
  // stamps a ZIP here. One can still ARRIVE: an old bookmark, an external link, or
  // today.html's redirect (which forwards its query string verbatim).
  //
  // It matters for exactly one reason: HS.submitWaitlist falls back to
  // HSPremiumWaitlist.zipFromLocation(location) when the CTA states no ZIP, and that reads
  // location.search. Removing the parameter is what makes the fallback find nothing, so a
  // FEATURE-level Premium lead can never inherit one place's ZIP.
  //
  // replaceState, not pushState: the cleaned URL replaces this entry rather than adding
  // one, so Back still returns wherever the resident came from. Dashboard membership never
  // read the parameter in the first place — this is about lead attribution.
  //
  // ⚠️ DISCLOSED LIMITATION, not silently absorbed: shell.js captures ?zip= into
  // sessionStorage 'viewZip' and HS.state.zip at MODULE SCOPE (shell.js:176-184), before
  // boot() and before any page script exists. No Dashboard-side code can prevent that; only
  // a shared-shell change could, and this authorization excludes one. What is fully
  // prevented here is what the rule is for: Dashboard membership and Premium attribution.
  try {
    var cleaned = A.searchWithoutZip(location.search);
    if (cleaned !== null && window.history && history.replaceState) {
      history.replaceState(history.state, '', location.pathname + cleaned + (location.hash || ''));
    }
  } catch (e) { /* a blocked history write must never break the briefing */ }

  // ---- Dashboard-local scope label -------------------------------------------------
  // PAGE-LOCAL ONLY. HS.setViewLabel writes state.viewLabel, which is never persisted and
  // is rebuilt by the shell on every full-page navigation — so it cannot leak to another
  // page. viewZip, myZip, HS.state.zip and the active address are untouched.
  HS.setViewLabel('ALL MY PLACES', { precise: true });

  // ---- Canonical My Places membership ----------------------------------------------
  // The two stores My Places itself manages. HS.onReady resolves after boot() has awaited
  // hydrateAccountLocation(), so both are already reconciled with the account.
  var places = A.canonicalPlaces({
    properties: S.properties,
    followedZips: HS.followedCommunities ? HS.followedCommunities() : []
  });
  var placeCount = places.length;

  // Header. The count is rendered only once membership is known — never a placeholder 0,
  // which would read as "you monitor nothing" during a load.
  var countBox = document.getElementById('dashCount');
  document.getElementById('dashCountN').textContent = String(placeCount);
  document.getElementById('dashCountLbl').textContent = placeCount === 1 ? 'Monitored place' : 'Monitored places';
  countBox.hidden = false;
  document.getElementById('dashSub').textContent = placeCount
    ? ('What’s changing across your ' + placeCount + ' monitored place' + (placeCount === 1 ? '' : 's') + '?')
    : 'What’s changing across the places you monitor?';

  // ---- Premium CTA — the existing shared modal, feature-level context ----------------
  // premiumLeadContext() carries a SOURCE and no other key, so there is no field for a ZIP
  // or address to arrive in. HS.openPremiumModal clears any previous context before it
  // binds (shell.js:1879), and the modal, submit handler, validation, idempotency and
  // Acquisition Dashboard path are all the existing ones — unchanged.
  document.getElementById('dashQolCta').addEventListener('click', function () {
    HS.openPremiumModal(A.premiumLeadContext());
  });

  // ---- Your Places ------------------------------------------------------------------
  // §9: no priority counts, no activity counts, no zeros. A row is a label and a
  // drill-down to that place's own existing destination. Clicking is navigation only — it
  // never changes Dashboard membership.
  function placeHref(p) {
    return p.kind === 'address'
      ? ('property.html?id=' + encodeURIComponent(p.placeId))
      : HS.pageHref('community.html', { zip: p.zip });
  }
  var placesEl = document.getElementById('dashPlaces');
  placesEl.innerHTML = places.length
    ? places.map(function (p) {
        return '<a class="placerow" href="' + HS.esc(placeHref(p)) + '">'
          + '<div class="pmain"><div class="pl">' + HS.esc(p.label) + '</div>'
          + '<div class="ps"><span class="ptag-kind">' + (p.kind === 'address' ? 'Address' : 'ZIP Code') + '</span>'
          + (p.sub ? ' &middot; ' + HS.esc(p.sub) : '') + '</div></div>'
          + '<div class="pc" aria-hidden="true">&rsaquo;</div></a>';
      }).join('')
    : '<p class="dnote" style="margin-bottom:12px">Add a place to see changes and official dates across the locations you monitor.</p>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
      + '<button class="inlinebtn" type="button" id="dashAddAddress">Add an address</button>'
      + '<button class="inlinebtn" type="button" id="dashAddZip">Add a ZIP code</button></div>';
  if (!places.length) {
    document.getElementById('dashAddAddress').addEventListener('click', function () { HS.addHome(); });
    document.getElementById('dashAddZip').addEventListener('click', function () { HS.openLoc(); });
  }

  // ---- Following --------------------------------------------------------------------
  // Deliberately BEFORE the zero-places return: a resident can follow a project while
  // monitoring no Places at all, and this section reports follows, not membership.
  //
  // A FAILED READ CANNOT RENDER AS "YOU FOLLOW NOTHING". HS.data.projectsByIds swallows a
  // PostgREST rejection into an empty array, so a failure and a fully-unresolved set are
  // indistinguishable here. That is survivable only because the card list is built from the
  // FOLLOW IDS and not from the returned rows: every id the resident followed gets a card
  // either way, and one that did not resolve says so instead of vanishing. The count stays
  // true in both cases.
  if (followingEl) {
    var followIds = HS.followedProjectIds ? HS.followedProjectIds() : [];
    var followRows = [];
    var followQuery = A.followingQueryIds(followIds);
    if (followQuery.length) {
      try {
        followRows = HS.data.projectsByIds ? await HS.data.projectsByIds(followQuery) : [];
      } catch (e) {
        followRows = [];
        console.warn('[dashboard] following read failed', e);
      }
    }
    var following = A.followingCards({ ids: followIds, rows: followRows });
    var followBody = document.getElementById('dashFollowingBody');
    if (!following.total) {
      followBody.innerHTML = '<p class="dnote">Open a project and tap Add to My Places to follow it. '
        + 'Followed projects appear here so you can reopen them. This does not turn on email alerts.</p>';
    } else {
      followBody.innerHTML = following.cards.map(function (c) {
        // The sub-line is the record's own status (or type) and its ZIP — nothing else is
        // available without asserting currency the data cannot support. See the FOLLOWING
        // notes in lib/dashboard-aggregate.js for what is refused and why.
        var sub = c.unresolved
          ? 'We could not load this project’s details.'
          : [c.context, c.place].filter(Boolean).join(' · ');
        var href = HS.pageHref('development.html', { id: c.id, zip: c.zip });
        return '<a class="placerow" href="' + HS.esc(href) + '">'
          + '<div class="pmain"><div class="pl">' + HS.esc(c.title) + '</div>'
          + (sub ? '<div class="ps">' + HS.esc(sub) + '</div>' : '')
          + '</div><div class="pc" aria-hidden="true">›</div></a>';
      }).join('')
        + (following.overflow
            ? '<p class="dnote" style="margin-top:10px">' + following.overflow
              + ' more followed project' + (following.overflow === 1 ? '' : 's') + ' in My Places.</p>'
            : '');
    }
    followingEl.hidden = false;
  }

  // ---- Zero places: nothing to brief on, and that is a true statement ---------------
  if (!places.length) {
    document.getElementById('dashChanging').innerHTML =
      '<p class="dnote">Add an address or a ZIP code and this briefing fills in with what is changing there.</p>';
    document.getElementById('dashDates').innerHTML =
      '<p class="dnote">Official meeting dates and comment deadlines appear here once you are monitoring a place.</p>';
    return;
  }

  // ---- Bounded reads ----------------------------------------------------------------
  // Query shapes and the reason each is what it is: lib/data.js, "ALL MY PLACES readers".
  // Every source is caught INDEPENDENTLY: a failed read is recorded as failed and is never
  // allowed to render as "nothing is happening" — the whole point of sourceAvailability.
  var zips = A.queryZips(places, A.MAX_QUERY_ZIPS);
  var capped = A.queryZips(places).length > zips.length;

  function pool(items, size, fn) {          // bounded concurrency — never Promise.all(N)
    var i = 0, out = new Array(items.length);
    function next() {
      if (i >= items.length) return Promise.resolve();
      var k = i++;
      return Promise.resolve(fn(items[k])).then(function (v) { out[k] = v; return next(); });
    }
    var runners = [];
    for (var r = 0; r < Math.min(size, items.length); r++) runners.push(next());
    return Promise.all(runners).then(function () { return out; });
  }

  var ok = {};
  function attempt(key, p) {
    return Promise.resolve(p).then(function (v) { ok[key] = true; return v; },
      function (e) { ok[key] = false; console.warn('[dashboard] ' + key + ' read failed', e); return null; });
  }

  var results = await Promise.all([
    attempt('changes', HS.data.changesForZips(zips)),
    attempt('meetings', HS.data.meetingsForZips(zips)),
    attempt('places', HS.data.communityMetaForZips(zips)),
    attempt('development', pool(zips, A.QUERY_CONCURRENCY, function (z) {
      return HS.data.developmentForZip(z, 8);
    }).then(function (lists) {
      return lists.reduce(function (acc, l) { return acc.concat(l || []); }, []);
    }))
  ]);
  var rawChanges = results[0], rawMeetings = results[1], meta = results[2] || {}, rawDev = results[3];
  var avail = A.sourceAvailability(ok);

  // ---- Normalize to one item shape, each carrying its OWN place provenance ----------
  function labelForZip(z) {
    var m = meta[z];
    return (m && m.name) ? m.name : ('ZIP ' + z);
  }
  function placeCtx(item) {
    if (item.placeCount > 1) return 'Affects ' + item.placeCount + ' of your places';
    var p = item.places && item.places[0];
    return p ? p.label : (item.zip ? labelForZip(item.zip) : '');
  }

  var items = [];
  (rawChanges || []).forEach(function (c) {
    var label = A.typeLabelForChange(c.category);
    if (!label) return;                     // no authoritative category -> no row
    items.push({
      id: c.id, zip: c.zip, title: c.title, category: c.category,
      source_ref: c.source_ref, occurred_at: c.occurred_at,
      window_closes_at: c.window_closes_at,
      typeLabel: label, kind: label === 'Local News' ? 'news' : 'gov',
      places: A.placesForZip(places, c.zip)
    });
  });
  (rawDev || []).forEach(function (p) {
    items.push({
      id: p.id, zip: p.zip, title: p.name, category: 'Development',
      source_ref: p.source_ref, occurred_at: p.submitted_at,
      window_closes_at: null, typeLabel: 'Development', kind: 'dev',
      places: A.placesForZip(places, p.zip)
    });
  });

  var deduped = A.dedupeChanges(items);

  // ---- What's Changing ---------------------------------------------------------------
  // The CTA's zip is ALWAYS the record's own zip, carried with its id from the same source
  // row — never HS.state.zip, which this page does not read at all.
  function changeHref(it) {
    if (it.kind === 'dev') return HS.pageHref('development.html', { zip: it.zip, id: it.id });
    if (it.kind === 'news') return it.source_ref || null;   // the publisher's own article
    return HS.pageHref('alerts.html', { zip: it.zip, id: it.id });
  }
  var CTA = { dev: 'Review development →', gov: 'View notice →', news: 'Read article →' };

  var changingEl = document.getElementById('dashChanging');
  if (avail.changes === 'failed' && avail.development === 'failed') {
    changingEl.innerHTML = '<p class="dwarn">We could not read updates for your places just now. '
      + 'This is a loading problem, not an absence of activity — try again shortly.</p>';
  } else if (!deduped.length) {
    changingEl.innerHTML = avail.anyFailed
      ? '<p class="dwarn">Part of this briefing could not be read just now, so this list is incomplete. Try again shortly.</p>'
      : '<p class="dnote">No new government notices, planning records or local news have been filed for your places recently.</p>';
  } else {
    changingEl.innerHTML = deduped.slice(0, 12).map(function (it) {
      var href = changeHref(it);
      var ext = it.kind === 'news';
      var when = A.fmtCalendarDate(it.occurred_at);
      return '<div class="crow">'
        + '<div class="ck"><span class="ctype ' + it.kind + '">' + HS.esc(it.typeLabel) + '</span></div>'
        + '<div class="cmain"><div class="ct">' + HS.esc(it.title || 'Untitled record') + '</div>'
        + '<div class="cmeta"><span>' + HS.esc(placeCtx(it)) + '</span>'
        + (when ? '<span>' + HS.esc(when) + '</span>' : '') + '</div></div>'
        + (href ? '<a class="cgo" href="' + HS.esc(href) + '"'
            + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + CTA[it.kind] + '</a>' : '')
        + '<div class="cv" aria-hidden="true">\u203a</div>'
        + '</div>';
    }).join('')
      + (avail.anyFailed ? '<p class="dwarn" style="margin-top:10px">Part of this briefing could not be read just now, so this list may be incomplete.</p>' : '')
      + (capped ? '<p class="dnote" style="margin-top:10px">Showing updates across your first ' + zips.length + ' places.</p>' : '');
  }

  // ---- Official Dates to Know ---------------------------------------------------------
  // Meetings carry a TIME only when the source stated one (meetings.meeting_time). The
  // clock component of meeting_date is a midnight-in-local-zone artifact on 96.3% of
  // upcoming rows and is never rendered — see lib/dashboard-aggregate.js. No relative
  // urgency label, no timezone, no participation instruction.
  var todayYmd = new Date().toISOString().slice(0, 10);
  var mtgItems = (rawMeetings || []).reduce(function (acc, m) {
    (m.zips || []).forEach(function (z) {
      acc.push(Object.assign({}, m, { zip: z, places: A.placesForZip(places, z) }));
    });
    return acc;
  }, []);
  var dated = A.officialDateItems({
    meetings: mtgItems,
    changes: deduped,
    todayYmd: todayYmd
  });
  // A meeting reaching several of the resident's ZIPs is ONE official date, not three.
  var seenDate = {};
  dated = dated.filter(function (d) {
    var k = d.kind + '\u001f' + String(d.id);
    if (seenDate[k]) { seenDate[k].places = seenDate[k].places.concat(d.places); return false; }
    seenDate[k] = d; return true;
  });

  var MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function dateBlock(ymd) {
    var p = String(ymd).split('-');
    return '<div class="dblock"><div class="m">' + MON[Number(p[1]) - 1] + '</div>'
      + '<div class="d">' + String(Number(p[2])) + '</div></div>';
  }
  function datePlaceCtx(d) {
    var uniq = {}, labels = [];
    (d.places || []).forEach(function (p) { if (p && !uniq[p.id]) { uniq[p.id] = 1; labels.push(p.label); } });
    if (labels.length > 1) return 'Affects ' + labels.length + ' of your places';
    return labels[0] || (d.zip ? labelForZip(d.zip) : '');
  }

  var datesEl = document.getElementById('dashDates');
  if (avail.meetings === 'failed' && avail.changes === 'failed') {
    datesEl.innerHTML = '<p class="dwarn">We could not read official dates for your places just now. Try again shortly.</p>';
  } else if (!dated.length) {
    datesEl.innerHTML = avail.anyFailed
      ? '<p class="dwarn">Part of this section could not be read just now, so it is incomplete. Try again shortly.</p>'
      : '<p class="dnote">No upcoming official dates are available right now.</p>';
  } else {
    datesEl.innerHTML = dated.slice(0, 8).map(function (d) {
      var meta2 = [];
      var ctx = datePlaceCtx(d);
      if (ctx) meta2.push('<span>' + HS.esc(ctx) + '</span>');
      if (d.kind === 'meeting') {
        if (d.time) meta2.push('<span>' + HS.esc(d.time) + '</span>');
        if (d.location) meta2.push('<span>' + HS.esc(d.location) + '</span>');
      } else {
        meta2.push('<span class="dwin">Official comment window open</span>');
        meta2.push('<span>Deadline: ' + HS.esc(A.fmtCalendarDate(d.dateYmd)) + '</span>');
      }
      var href = d.kind === 'meeting'
        ? d.href
        : HS.pageHref('alerts.html', { zip: d.zip, id: d.id, band: 'open' });
      var cta = d.kind === 'meeting' ? 'View meeting →' : 'Review official notice →';
      var ext = d.kind === 'meeting';
      return '<div class="drow">' + dateBlock(d.dateYmd)
        + '<div class="dmain"><div class="dt">' + HS.esc(d.title) + '</div>'
        + '<div class="dmeta">' + meta2.join('') + '</div></div>'
        + (href ? '<a class="cgo" href="' + HS.esc(href) + '"'
            + (ext ? ' target="_blank" rel="noopener"' : '') + '>' + cta + '</a>' : '')
        + '<div class="cv" aria-hidden="true">\u203a</div>'
        + '</div>';
    }).join('')
      + (avail.anyFailed ? '<p class="dwarn" style="margin-top:10px">Part of this section could not be read just now, so it may be incomplete.</p>' : '');
  }
});
</script>
</body>
</html>

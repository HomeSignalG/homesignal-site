<title>HomeSignal — Today's Priorities has moved</title>
<script>
// RETIRED 2026-09-10 (A-020). This page was the one-pager that answered "what needs me
// today". Every one of its four areas now has a live destination, proven before this
// redirect was written:
//   Needs you this week  (#tdPriorities) -> Dashboard "Needs Your Attention"  (A-004)
//   Your briefing        (#tdBrief)      -> Dashboard "Your Briefing"          (A-005)
//   Your vitals          (#tdRing/#tdBars/#tdVitals)
//                                        -> AUTHENTICATED /community/<zip>/ ZIP health (A-022)
//   Action windows       (#tdWindows)    -> Dashboard "Coming Up"              (A-003)
// Its "Map -" link was already Dashboard's "Open full map -"; no new map path was added.
//
// Two things deliberately did NOT move. Today ranked its priorities by impacts.length,
// which is vacuous in production (app_changes.impacts is NULL on every row), so that
// ordering was not ported. And the vitals panel went to A-022 on the public ZIP route,
// NOT onto the Dashboard strip - A-001 is four portfolio metrics, not a vitals panel.
//
// The file stays as a REDIRECT rather than being deleted because this URL is reachable
// from bookmarks and from navigation people have used. The query string is carried across
// so ?zip=<zip> lands on the same ZIP. location.replace, so the retired page does not sit
// in the back-button history. Same convention as maps.html.
(function () {
  var q = window.location.search || '';
  window.location.replace('/dashboard.html' + q);
})();
</script>

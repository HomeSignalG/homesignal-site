      <h2 class="bt">1. Agreement to Terms</h2>
      <p>These Terms of Service ("Terms") are an agreement between you and HomeSignal ("HomeSignal", "we", "us") for the website at homesignal.net and its services, including HomeSignal Development Activity. By creating an account, subscribing, or using the service, you agree to these Terms and to our <a href="privacy.html">Privacy Notice</a>. If you use HomeSignal for a brokerage or other business, you confirm you may accept these Terms for it. If you do not agree, do not use the service.</p>

      <h2 class="bt">2. The HomeSignal service</h2>
      <p>HomeSignal provides reports, monitoring and alerts about proposed, approved and active development projects, drawn from public-source information. HomeSignal is an information service. It is not a real-estate broker, does not facilitate real-estate transactions, does not provide mortgages, and does not provide investment, legal, financial or real-estate advice.</p>

      <h2 class="bt">3. Eligibility and accounts</h2>
      <p>You must provide accurate account information and keep your sign-in secure. You are responsible for activity under your account. Paid brokerage accounts are set up by HomeSignal and managed by the brokerage owner, who is responsible for the people the brokerage invites.</p>

      <h2 class="bt">4. Development Activity subscription</h2>
      <p>The paid <b>Professional</b> plan of HomeSignal Development Activity is a recurring monthly subscription. It includes 100 new Development Activity reports each month, shared by everyone on the brokerage's plan, and the ability to reopen, share, download or print existing reports without using another report. A report with no development data for its area does not use one. Free evaluation reports, where offered, are separate from the paid plan. Arrangements beyond the standard plan are available by contacting HomeSignal.</p>

      <h2 class="bt">5. Fees and billing</h2>
      <p>The Professional plan costs <b>$79 per month</b>, shown before checkout. You authorize recurring charges of that amount, plus any applicable taxes, to the payment method you provide, until you cancel.</p>

      <h2 class="bt">6. Automatic monthly renewal</h2>
      <p>The subscription renews automatically each month at the then-current price unless you cancel before the renewal.</p>

      <h2 class="bt">7. Cancellation</h2>
      <p>You can cancel at any time. Cancelling stops future renewal charges. Reports you have already saved stay available. Cancelling is separate from asking for a refund.</p>

      <h2 class="bt">8. Refunds</h2>

      <h2 class="bt">10. Permitted commercial use</h2>
      <p>Real-estate professionals and brokerages may use HomeSignal in the ordinary course of their professional work, including to research properties and to inform their clients.</p>

      <h2 class="bt">11. Client sharing and report use</h2>

      <h2 class="bt">12. Prohibited use</h2>
      <p>You may not: scrape, crawl or bulk-download HomeSignal data; resell, redistribute or sublicense HomeSignal's database or raw datasets; offer HomeSignal or its reports as a competing data product or white-label service; misrepresent HomeSignal information; interfere with or attempt to break the security or operation of the service; share account access outside your brokerage; or use HomeSignal to harass others or break the law.</p>

      <h2 class="bt">13. Public-source information and accuracy</h2>
      <p>HomeSignal summarizes selected official public records from covered sources. Public records can be incomplete, delayed, or amended, and coverage varies by place. A report may not include every project or change. Each project links to its official source so you can verify it.</p>

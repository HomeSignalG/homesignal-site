      <h2 class="bt">1. Agreement to Terms</h2>
      <p>These Terms of Service ("Terms") are an agreement between you and HomeSignal ("HomeSignal", "we", "us"), a sole proprietorship, for the website at homesignal.net and its services, including HomeSignal Development Activity. By creating an account or using the service, you agree to these Terms and to our <a href="privacy.html">Privacy Notice</a>. If you use HomeSignal for a brokerage or other business, you confirm you may accept these Terms for it. If you do not agree, do not use the service.</p>

      <h2 class="bt">2. The HomeSignal service</h2>
      <p>HomeSignal provides reports, monitoring and alerts about proposed, approved and active development projects, drawn from public-source information. HomeSignal is an information service. It is not a real-estate broker, does not facilitate real-estate transactions, does not provide mortgages, and does not provide investment, legal, financial or real-estate advice.</p>

      <h2 class="bt">3. Eligibility and accounts</h2>
      <p>You must provide accurate account information and keep your sign-in secure. You are responsible for activity under your account. An individual agent can register for their own single-person account, and is responsible for that account. A brokerage account is managed by the brokerage owner, who is responsible for the people the brokerage invites.</p>

      <h2 class="bt">4. Development Activity (free)</h2>
      <p>HomeSignal Development Activity is currently offered as a free evaluation. Nothing is sold, and no payment is requested or accepted.</p>
      <p>Existing reports may be reopened, shared with clients, downloaded, or printed without using another report. A report containing no development data for its requested area does not use one report.</p>
      <p>Eligible new accounts may receive 100 free evaluation reports. No purchase is required.</p>

      <h2 class="bt">5. Fees</h2>

      <h2 class="bt">10. Public-source information and accuracy</h2>
      <p>HomeSignal summarizes selected official public records from covered sources. Public records can be incomplete, delayed, or amended, and coverage varies by place. A report may not include every project or change. Each project links to its official source so you can verify it.</p>

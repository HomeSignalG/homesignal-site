<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>HomeSignal — My Places</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://qwnnmljucajnexpxdgxr.supabase.co wss://qwnnmljucajnexpxdgxr.supabase.co; form-action 'self'">
<link rel="stylesheet" href="app.css?v=20814d85">
</head>
<body data-nav="props">
<template id="hs-content">
  <div class="page">
    <div class="ph">
      <div class="eyebrow">My Places</div>
      <h1>My Places</h1>
      <p>Everything HomeSignal watches for you. An <b>Address</b> is one location; a <b>ZIP&nbsp;Code</b> is a whole community. Followed <b>Developments</b> are listed here so you can find them again — they are not Addresses or ZIP Codes, and following a Development does not turn on email alerts.</p>
    </div>
    <div class="strip" id="propStrip"></div>
    <div class="toolbar toolbar--lead">
      <div class="seg" id="plViews">
        <button class="on" type="button" data-view="all">All</button>
        <button type="button" data-view="addresses">Addresses</button>
        <button type="button" data-view="zips">ZIP Codes</button>
        <button type="button" data-view="projects">Developments</button>
      </div>
      <div class="sp"></div>
      <button class="addbtn" type="button" id="plAddAddress">+ Add Address</button>
      <button class="addbtn" type="button" id="plAddZip">+ Add ZIP Code</button>
    </div>
    <div class="propgrid" id="propGrid"></div>
  </div>
</template>

<script src="config.js"></script>
<script src="seed/delvalle.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lib/data.js"></script>
<script src="lib/topic-prefs.js"></script>
<script src="lib/templates.js?v=848593cf"></script>
<script src="lib/premium-waitlist.js?v=02c305ee"></script>
<script src="lib/community-request.js?v=e1d9c7d7"></script>
<script src="shell.js?v=22937269"></script>
<script>
HS.onReady(async function () {
  var S = HS.state;
  // Never hang silently: a failed read renders an honest retry state.
  var changes, projects, followedProjects;
  try {
    changes = await HS.data.changes(S.zip, null);
    projects = await HS.data.projects(S.zip, null);
    followedProjects = await loadFollowedProjects();
  } catch (e) {
    console.warn('[my places] data load failed', e);
    document.querySelector('.page').innerHTML = '<div class="ph"><h1>We couldn\'t load My Places</h1>'
      + '<p>Your connection may have dropped, or our data service is briefly unavailable.</p></div>'
      + '<button class="btn primary" onclick="location.reload()">Try again</button>';
    return;
  }

  // A-002 / A-010 — TWO PLACE TYPES, TWO EXISTING STORES, KEPT DISTINCT.
  // Address  -> app_properties, via HS.state.properties (the Census-confirmed home writer)
  // ZIP Code -> app_follows / myCommunities, via HS.followedCommunities()
  // They are NOT merged into one collection and a ZIP Code is never written into
  // app_properties. My Places is the one management CONTAINER; the underlying types,
  // workflows and destinations stay exactly as they already were.
  // Followed projects are listed here too (app_follows target_type=project) so
  // "Add to My Places to follow" is truthful. They are not a Place type: they do
  // not count in Places Monitored and have no "+ Add Project" writer.
  function addresses() { return S.properties || []; }
  function zips() { return HS.followedCommunities ? HS.followedCommunities() : []; }
  async function loadFollowedProjects() {
    var ids = HS.followedProjectIds ? HS.followedProjectIds() : [];
    if (!ids.length) return [];
    var rows = [];
    try {
      rows = HS.data.projectsByIds ? await HS.data.projectsByIds(ids) : [];
    } catch (e) { rows = []; }
    var byId = {};
    (rows || []).forEach(function (p) { if (p && p.id != null) byId[String(p.id)] = p; });
    return ids.map(function (id) {
      return byId[String(id)] || { id: id, name: 'Followed development', _unresolved: true };
    });
  }

  // A-010 / Fix 8J: the view is deep-linkable so another surface can land on the type it
  // manages (the Dashboard's Following section routes here with ?view=projects). Whitelisted
  // against the four views this page already declares as data-view buttons — an unknown or
  // absent value falls back to 'all', which is also what every existing link resolves to, so
  // no current entry point changes. Nothing else about the page reads the query string.
  var VIEWS = ['all', 'addresses', 'zips', 'projects'];
  var view = (function () {
    var q = new URLSearchParams(location.search).get('view');
    return VIEWS.indexOf(q) !== -1 ? q : 'all';
  })();

  // AN OPEN COMMENT WINDOW IS A DATE THAT EXISTS AND HAS NOT PASSED — never a missing one.
  // `HS.daysUntil` returns NULL when there is no window_closes_at, and in JavaScript
  // `null >= 0` is TRUE (null coerces to 0 in a relational comparison), so the bare
  // `daysUntil(x) >= 0` this page used counted every record that has NO comment window at
  // all as one that needs you. Measured on live data before the fix: ZIP 78617 holds 17
  // non-news changes, ALL 17 with window_closes_at NULL and 0 open — and the strip read
  // "17 Need you" while every Address card below it read "Nothing needs you".
  //
  // The `d != null &&` form is not new here: shell.js:2034, alerts.html:272 and
  // lib/templates.js (three sites) already guard exactly this way. This page and
  // property.html were the two that did not.
  function openWindowCount(list) {
    return (list || []).filter(function (x) {
      var d = HS.daysUntil(x.window_closes_at);
      return d != null && d >= 0;
    }).length;
  }

  // A CAPPED RESULT CANNOT PROVE A TOTAL. app_projects_for_zip -> app_authoritative_projects_for_zip
  // returns at most 500 development records, and lib/data.js::rpcAllRows reports
  // `complete: true` for ANY array it gets back — so a full page and a truncated one are
  // indistinguishable from here. Measured on production: ZIP 78617 holds 512 development
  // rows and the RPC returned 500, so the previous tile rendered 500 as though it were the
  // ZIP's whole set.
  //
  // This constant is NOT a duplicate of an existing client-side limit — there is none; the
  // cap lives only in the RPC, and nothing in lib/data.js or config.js exposes it. It is
  // declared here solely to DETECT the capped state, never to request rows: no query, no
  // limit and no RPC changes with it.
  //
  // The rendered "+" is derived from the RETURNED count, not from this constant, so if the
  // server cap ever moves the tile still states what it actually received rather than a
  // stale 500.
  var DEV_QUERY_CAP = 500;

  function devCapped(list) { return (list || []).length >= DEV_QUERY_CAP; }

  // At the cap: "500+" — at least this many were found, exact total unprovable from this
  // response. Below it: the exact number, which IS provable because nothing was truncated.
  function devCountValue(list) {
    var n = (list || []).length;
    return devCapped(list) ? n + '+' : n;
  }

  // Resident-facing noun is "Development" — "Project" is an internal name (app_projects,
  // ?view=projects) and stays out of copy. Singular only at exactly one, which needs no
  // pluralization machinery because the count never appears inside the label.
  function devCountLabel(list) {
    var n = (list || []).length;
    return (n === 1 ? 'Development' : 'Developments') + ' found'
      + (S.zip ? ' · ZIP ' + S.zip : '');
  }

  function strip() {
    var a = addresses(), z = zips();
    // A SCORE THAT WAS NEVER MEASURED IS NOT A ZERO. `p.score || 0` summed absent scores as
    // real zeros and rendered "0 Avg Address score" as if it had been computed; measured,
    // app_properties.score is NULL on every stored row, so the tile was reporting a
    // fabricated measurement. Average only the addresses that actually carry a number, and
    // omit the tile entirely when none does — the same rule the Address card already
    // follows with `p.score || ''`.
    var scored = a.filter(function (p) { return typeof p.score === 'number' && isFinite(p.score); });
    var avg = scored.length
      ? Math.round(scored.reduce(function (s, p) { return s + p.score; }, 0) / scored.length)
      : null;
    // SCOPE: `changes` and `projects` are read for the VIEWED ZIP alone (HS.data.changes(S.zip)
    // / HS.data.projects(S.zip)), so two tiles claimed a span they never measured — "across
    // all Places" over one ZIP's rows, and a "total" that is neither distance-filtered nor
    // complete. The counts are honest; only the labels were not. Naming the ZIP is the
    // smallest true statement and adds no query. Measuring all five places instead would
    // mean per-ZIP fan-out on this page (the Dashboard's queryZips/MAX_QUERY_ZIPS pattern),
    // which is a product decision about query cost, not a label fix.
    var inZip = S.zip ? ' · ZIP ' + S.zip : '';
    document.getElementById('propStrip').innerHTML =
      HS.tpl.statTile(a.length + z.length, 'Places', '')
      + HS.tpl.statTile(openWindowCount(changes), 'Need you' + inZip, 'accent')
      + HS.tpl.statTile(devCountValue(projects), devCountLabel(projects), '')
      + (avg != null ? HS.tpl.statTile(avg, 'Avg Address score', 'g') : '');
  }

  var tone = { 'Your home': 'var(--green)', 'Rental': 'var(--amber)', 'Family': 'var(--blue)' };

  // Every card states its TYPE. "All" is not a blended card type — an Address and a ZIP
  // Code are visibly different things that happen to share one container.
  function typeChip(label) {
    return '<span class="ptype" style="font-size:10px;font-weight:700;letter-spacing:.04em;'
      + 'text-transform:uppercase;color:var(--ink-2)">' + HS.esc(label) + '</span>';
  }

  function addressCard(p) {
    // per-Address computed: nearest projects, open windows
    var near = HS.withDistance(projects, p).filter(function (x) { return (x.distance_mi || 9e9) <= 5; });
    // Same null-window guard as the strip (see openWindowCount). The distance gate is
    // deliberately LEFT AS IS and is reported separately: measured table-wide, 0 of 182,834
    // app_changes rows carry coordinates, so `(x.distance_mi || 9e9) <= 5` can only ever
    // exclude — which is why this card read "Nothing needs you" even while the strip was
    // over-counting. Removing it would change what every Address card reports nationally
    // (1,158 comment windows are open right now), so it is a product decision, not a
    // correctness fix, and is not bundled in here.
    var needs = HS.withDistance(changes, p).filter(function (x) {
      var d = HS.daysUntil(x.window_closes_at);
      return d != null && d >= 0 && (x.distance_mi || 9e9) <= 5;
    }).length;
    return '<div class="propcard" data-kind="address" data-id="' + HS.esc(p.id) + '">'
      + '<div class="miniscore">' + (p.score || '') + '</div>'
      + '<div class="pinfo">'
      + '<div class="ptag" style="color:' + (tone[p.tag] || 'var(--green)') + '">' + typeChip('Address') + ' · ' + HS.esc(HS.placeDisplayTag(p, 'Address')) + '</div>'
      + '<h3>' + HS.esc(p.address) + '</h3><div class="paddr">' + HS.esc(p.city) + ', ' + HS.esc(p.state) + ' ' + HS.esc(p.zip) + '</div>'
      + '<div class="pmeta">' + (needs ? '<span class="needs">◔ ' + needs + ' need' + (needs === 1 ? 's' : '') + ' you</span>' : '<span style="color:var(--ink-3)">Nothing needs you</span>')
      + '<span>' + near.length + ' nearby projects</span>'
      + (p.value_outlook != null ? '<span style="color:var(--green);font-weight:600">+' + HS.esc(p.value_outlook) + '%</span>' : '')
      + '</div>'
      + '<div class="pacts" style="margin-top:8px">'
      + '<button class="btn" type="button" data-act="remove-address" data-id="' + HS.esc(p.id) + '">Remove Address</button>'
      + '</div></div></div>';
  }

  function zipCard(z) {
    // The ZIP Code's destination is UNCHANGED — the same page the follow flow has always
    // opened. My Places lists it; it does not re-route it.
    var href = HS.pageHref ? HS.pageHref('community.html', { zip: z.zip }) : ('community.html?zip=' + encodeURIComponent(z.zip));
    return '<div class="propcard" data-kind="zip" data-zip="' + HS.esc(z.zip) + '" data-href="' + HS.esc(href) + '">'
      + '<div class="miniscore">◍</div>'
      + '<div class="pinfo">'
      + '<div class="ptag" style="color:var(--blue)">' + typeChip('ZIP Code') + '</div>'
      + '<h3>' + HS.esc(z.name || ('ZIP ' + z.zip)) + '</h3>'
      + '<div class="paddr">' + HS.esc(z.zip) + (z.state ? ', ' + HS.esc(z.state) : '') + '</div>'
      + '<div class="pmeta"><span style="color:var(--ink-3)">Whole-community coverage</span></div>'
      + '<div class="pacts" style="margin-top:8px">'
      + '<button class="btn" type="button" data-act="unfollow-zip" data-zip="' + HS.esc(z.zip) + '">Unfollow</button>'
      + '</div></div></div>';
  }

  function projectLocationLine(p) {
    if (!p || p._unresolved) return 'Location not listed on this development record';
    var bits = [];
    if (p.address) bits.push(String(p.address));
    if (p.zip) bits.push('ZIP ' + String(p.zip));
    if (bits.length) return bits.join(' · ');
    return 'Location not listed on this development record';
  }

  function projectCard(p) {
    var loc = projectLocationLine(p);
    var sub = p.status || p.type || 'Followed development';
    var hrefOpts = { id: p.id };
    if (p.zip && /^\d{5}$/.test(String(p.zip))) hrefOpts.zip = String(p.zip);
    var href = HS.pageHref ? HS.pageHref('development.html', hrefOpts)
      : ('development.html?id=' + encodeURIComponent(p.id) + (hrefOpts.zip ? '&zip=' + encodeURIComponent(hrefOpts.zip) : ''));
    return '<div class="propcard" data-kind="project" data-id="' + HS.esc(p.id) + '" data-href="' + HS.esc(href) + '">'
      + '<div class="miniscore">◎</div>'
      + '<div class="pinfo">'
      + '<div class="ptag" style="color:var(--ink-2)">' + typeChip('Development') + (sub ? ' · ' + HS.esc(sub) : '') + '</div>'
      + '<h3>' + HS.esc(p.name || 'Followed development') + '</h3>'
      + '<div class="paddr">' + HS.esc(loc) + '</div>'
      + '<div class="pmeta"><span style="color:var(--ink-3)">Followed in My Places. Does not turn on email alerts.</span></div>'
      + '<div class="pacts" style="margin-top:8px">'
      + '<button class="btn" type="button" data-act="unfollow-project" data-id="' + HS.esc(p.id) + '">Unfollow</button>'
      + '</div></div></div>';
  }

  // Empty states are PER VIEW. An empty ZIP Codes view while Addresses exist is a true
  // statement about that type, not a defect — so each view says what is actually missing.
  function emptyCard(kind) {
    if (kind === 'projects') {
      return '<div class="propcard" style="border-style:dashed;justify-content:center">'
        + '<div style="text-align:center"><div style="font-weight:600;color:var(--ink-2);font-size:13.5px">No Developments followed yet</div>'
        + '<div style="font-size:11.5px;color:var(--ink-3);margin:2px 0 8px">Open a development and tap Add to My Places to follow. Followed Developments appear here so you can reopen them. This does not turn on email alerts.</div>'
        + '</div></div>';
    }
    var copy = kind === 'zips'
      ? { t: 'No ZIP Codes yet', d: 'Follow a ZIP Code to watch a whole community.', btn: '+ Add ZIP Code', act: 'add-zip' }
      : { t: 'No Addresses yet', d: 'Add a home and we\'ll watch official records around it.', btn: '+ Add Address', act: 'add-address' };
    return '<div class="propcard" style="border-style:dashed;justify-content:center">'
      + '<div style="text-align:center"><div style="font-weight:600;color:var(--ink-2);font-size:13.5px">' + copy.t + '</div>'
      + '<div style="font-size:11.5px;color:var(--ink-3);margin:2px 0 8px">' + copy.d + '</div>'
      + '<button class="btn primary" type="button" data-act="' + copy.act + '">' + copy.btn + '</button></div></div>';
  }

  function render() {
    strip();
    var a = addresses(), z = zips(), p = followedProjects || [];
    var html = '';
    var vb = document.getElementById('plViews');
    if (vb) [].forEach.call(vb.querySelectorAll('button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-view') === view);
      var k = b.getAttribute('data-view');
      var n = k === 'addresses' ? a.length
        : k === 'zips' ? z.length
        : k === 'projects' ? p.length
        : null;
      var label = k === 'all' ? 'All' : k === 'addresses' ? 'Addresses' : k === 'zips' ? 'ZIP Codes' : 'Developments';
      // "All" CARRIES NO COUNT. It used to print a.length + z.length + p.length while the
      // stat tile above prints a.length + z.length — two different totals on one screen,
      // and the larger one quietly redefined Developments as geographic places. The three
      // TYPED counts are the truthful ones and stay; the combined figure is REMOVED rather
      // than replaced, because no combined total is approved on any surface. "All" is a
      // filter, and a filter does not need to assert a total to name itself.
      b.textContent = n == null ? label : label + ' (' + n + ')';
    });
    if (view === 'all' || view === 'addresses') {
      html += a.length ? a.map(addressCard).join('') : emptyCard('addresses');
    }
    if (view === 'all' || view === 'zips') {
      html += z.length ? z.map(zipCard).join('') : emptyCard('zips');
    }
    if (view === 'projects') {
      html += p.length ? p.map(projectCard).join('') : emptyCard('projects');
    } else if (view === 'all' && p.length) {
      html += p.map(projectCard).join('');
    }
    document.getElementById('propGrid').innerHTML = html;
  }

  document.getElementById('plViews').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-view]'); if (!b) return;
    view = b.getAttribute('data-view'); render();
  });
  // A-010: two DISTINCT primary actions on the two EXISTING workflows. No generic
  // "+ Add a Place", and no second writer for either type.
  document.getElementById('plAddAddress').addEventListener('click', function () { HS.addHome(); });
  document.getElementById('plAddZip').addEventListener('click', function () { HS.openLoc(); });

  document.getElementById('propGrid').addEventListener('click', async function (e) {
    var btn = e.target.closest('button[data-act]');
    if (btn) {
      e.stopPropagation();
      var act = btn.getAttribute('data-act');
      if (act === 'add-address') { HS.addHome(); return; }
      if (act === 'add-zip') { HS.openLoc(); return; }
      if (act === 'remove-address') {
        var id = btn.getAttribute('data-id');
        var card = btn.closest('[data-kind="address"]');
        var label = card ? (card.querySelector('h3') || {}).textContent : 'this Address';
        // A-012 requires a confirmation. It names what is removed AND what is not, because
        // the honest worry is that "remove" silently takes the alerts or the ZIP with it.
        if (!window.confirm('Remove ' + label + ' from My Places?\n\nThis removes only this saved Address. Your ZIP Code follows and alert history are not affected.')) return;
        btn.disabled = true; btn.textContent = 'Removing…';
        var okDel = await HS.removeAddress(id);
        if (!okDel) { btn.disabled = false; btn.textContent = 'Remove Address';
          window.alert("Couldn't remove that Address — please try again."); return; }
        render(); return;
      }
      if (act === 'unfollow-zip') {
        var zip = btn.getAttribute('data-zip');
        if (!window.confirm('Unfollow ZIP Code ' + zip + '?\n\nThis removes only this ZIP Code follow. Your Addresses are not affected.')) return;
        HS.unfollowCommunity(zip);
        render(); return;
      }
      if (act === 'unfollow-project') {
        var pid = btn.getAttribute('data-id');
        if (!pid) return;
        if (!window.confirm('Stop following this Development?\n\nIt will leave My Places. This does not change email alerts. Your Addresses and ZIP Codes are not affected.')) return;
        if (HS.unfollowProject) await HS.unfollowProject(pid);
        followedProjects = (followedProjects || []).filter(function (row) { return String(row.id) !== String(pid); });
        render(); return;
      }
      return;
    }
    // Card body click -> the type's EXISTING destination, unchanged.
    var acard = e.target.closest('[data-kind="address"]');
    if (acard) { HS.selectProperty(acard.getAttribute('data-id'));
      location.href = 'property.html?id=' + encodeURIComponent(acard.getAttribute('data-id')); return; }
    var zcard = e.target.closest('[data-kind="zip"]');
    if (zcard) { location.href = zcard.getAttribute('data-href'); return; }
    var pcard = e.target.closest('[data-kind="project"]');
    if (pcard) { location.href = pcard.getAttribute('data-href'); }
  });

  render();
});
</script>
</body>
</html>

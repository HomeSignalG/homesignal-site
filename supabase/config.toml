# Per-function deploy config (read by `supabase functions deploy`).
# WHY THIS FILE EXISTS: the deploy CLI PRESERVES a function's stored verify_jwt setting
# when the flag is omitted — edge-probe's first deploy (pre-#777 workflow) stored
# verify_jwt=false, and the flag-less redeploy kept it. This pins the approved posture
# explicitly so no deploy-order accident can reopen it. get-address-report keeps its
# live no-JWT config via the workflow's explicit --no-verify-jwt (flag overrides file).
project_id = "qwnnmljucajnexpxdgxr"

[functions.edge-probe]
verify_jwt = true

# Allowlist JSON API. Not get-address-report. JWT stays on; this is not in the
# workflow's --no-verify-jwt exception.
[functions.get-future-surroundings-report]
verify_jwt = true

# The national Development Activity report (Order G). JWT stays ON, and the handler additionally requires a
# signed-in, allow-listed user: the public anon key is a validly signed JWT and would otherwise pass the gateway.
# Not in the deploy workflow's --no-verify-jwt exception.
[functions.get-development-activity-report]
verify_jwt = true

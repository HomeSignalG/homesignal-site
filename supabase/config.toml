# Per-function deploy config (read by `supabase functions deploy`).
# WHY THIS FILE EXISTS: the deploy CLI PRESERVES a function's stored verify_jwt setting
# when the flag is omitted — edge-probe's first deploy (pre-#777 workflow) stored
# verify_jwt=false, and the flag-less redeploy kept it. This pins the approved posture
# explicitly so no deploy-order accident can reopen it. get-address-report keeps its
# live no-JWT config via the workflow's explicit --no-verify-jwt (flag overrides file).
project_id = "qwnnmljucajnexpxdgxr"

[functions.edge-probe]
verify_jwt = true

# Allowlist JSON API. Not get-address-report. JWT stays on; this is not in the
# workflow's --no-verify-jwt exception.
[functions.get-future-surroundings-report]
verify_jwt = true

# The national Development Activity report (Order G). JWT stays ON, and the handler additionally requires a
# signed-in, allow-listed user: the public anon key is a validly signed JWT and would otherwise pass the gateway.
# Not in the deploy workflow's --no-verify-jwt exception.
[functions.get-development-activity-report]
verify_jwt = true

# Changes Since Report and Follow for a stored Development Activity report. JWT stays ON, and the handler additionally requires a
# signed-in, allow-listed user (the same shared gate as the national report). Not in the deploy workflow's --no-verify-jwt exception.
[functions.follow-development-report]
verify_jwt = true

# Joining a brokerage's Development Activity trial, and reading one's own trial (build step 5c). JWT stays ON, and the handler
# additionally requires a real signed-in user (the anon key passes the gateway). Not in the deploy workflow's --no-verify-jwt exception.
[functions.development-activity-trial]
verify_jwt = true

# A brokerage's agent makes, lists and withdraws the private client links to its own stored reports (build step 8). JWT stays ON, and the
# handler additionally requires a real signed-in user (the anon key passes the gateway). Not in the deploy workflow's --no-verify-jwt exception.
[functions.manage-shared-report]
verify_jwt = true

# What a CLIENT who holds a share link may read (build step 8). The ONE Development Activity function with JWT verification OFF: the client has
# no account, and the link's secret token is the only credential. The deploy workflow's second --no-verify-jwt exception (the first is
# get-address-report). It answers only a token the database says is usable, reads one stored report and writes nothing.
[functions.view-shared-report]
verify_jwt = false

# A brokerage's agent starts, lists and stops watching the property of one of its own stored reports (build step 9). JWT stays ON, and the
# handler additionally requires a real signed-in user (the anon key passes the gateway). Not in the deploy workflow's --no-verify-jwt exception.
[functions.manage-property-watch]
verify_jwt = true

# The daily check of every watched property (build step 9). Called only by the database's scheduler (pg_cron through pg_net), never by a person
# or a page. JWT stays ON (the scheduler sends the project's public key, which the gateway accepts) and the handler then requires the project's
# private SIGNUP_HOOK_SECRET in x-signup-secret, refusing every request when none is configured: the gateway alone is not the gate. Not in the
# deploy workflow's --no-verify-jwt exception.
[functions.run-property-watch]
verify_jwt = true

<body data-nav="explore">
<template id="hs-content">
  <div class="page">
    <div class="hero">
      <h1>See what's changing around your home — from public records you can verify.</h1>
      <p class="sub">HomeSignal maps development, hearings, and regulated facilities near your ZIP — each item linked to its official source. Coverage depth varies by area; we show what the record says and what it doesn't.</p>
      <div class="ziprow">
        <div class="zwrap"><span class="zpin">◉</span><input id="homeZip" type="text" autocomplete="street-address" enterkeyhint="search" aria-label="Zip code or address" placeholder="Enter a zip code or address" onkeydown="if(event.key==='Enter')homeFind()"></div>
        <button class="find" onclick="homeFind()">Find my community</button>
      </div>
      <div class="ziperr" id="homeZipErr" role="alert" hidden style="font-size:13.5px;color:#c23b34;margin-top:10px"></div>
      <div class="freeline">Free — already following an area? <a href="properties.html">Go to My Places →</a></div>
    </div>

    <div class="homesec">
      <div class="trio">
        <div class="twin"><div class="ic">◉</div><div class="k">See it</div><h3>What's changing</h3><p>Every project, permit, and hearing near your home — mapped, with official record links on every item.</p><div class="tchips"><span class="tc">Development</span><span class="tc">Hearings</span><span class="tc">Water quality</span><span class="tc">Zoning</span></div></div>
        <div class="twin"><div class="ic">◈</div><div class="k">Understand it</div><h3>What it means</h3><p>Each change put in plain language from the public record — what is known, what isn't published yet, and where you can still weigh in.</p><div class="tchips"><span class="tc">Traffic</span><span class="tc">Water</span><span class="tc">Home value</span><span class="tc">Safety</span></div></div>
        <div class="twin"><div class="ic">◔</div><div class="k">Act on it</div><h3>What you can do</h3><p>A clear next step on every item, and a heads-up before comment windows and votes close — while you can still weigh in.</p><div class="tchips"><span class="tc">Comment</span><span class="tc">Attend</span><span class="tc">Follow</span><span class="tc">Noted</span></div></div>
      </div>
    </div>

    <div class="homesec">
      <h2>This is what you'll see.</h2>
      <p class="s2">Every change traced to a public record — and what you can do about it while the window is open.</p>
      <div class="previewwrap">
        <div id="homePreview"><!-- a real Del Valle card, rendered from data --></div>
        <div class="previewcap" id="homePreviewCap">A real card from the Del Valle, TX community. Enter your ZIP to see your own.</div>
      </div>
    </div>

    <div class="trustpanel">
      <div class="badge">Neutral · Sourced · Non-partisan</div>
      <h2>Built on public records. Free to follow your community.</h2>
      <p>Every alert links back to the permit, agenda, or filing it came from. We don't take positions and we don't sell your personal information — we help you see what's changing and decide for yourself.</p>
    </div>

    <div class="homecta">
      <h2>Know what's changing around your home.</h2>
      <p>Enter your ZIP to open the map — no account needed to start. Record depth varies by county.</p>
      <button class="big" onclick="HS.openLoc()">Find my community</button>
    </div>
  </div>

<script src="config.js"></script>

<script src="lib/premium-waitlist.js?v=02c305ee"></script>
<script src="lib/community-request.js?v=e1d9c7d7"></script>
<script src="shell.js?v=f7ec5a9a"></script>
<script>
  // The box takes a zip code or an address (founder, 2026-10-01). A ZIP goes straight to its
  // community, as before. An address is confirmed against U.S. Census records by the same
  // geocode-address service that "Add an address" and Map 1 use, and its confirmed ZIP then
  // takes the ZIP path. The address only finds the ZIP: it is not saved, not put in the URL,
  // and not recorded (the lookup event carries the ZIP alone, as Map 1's does).
  var homeBusy = false, homeLogged = null;
  function homeMsg(text, isError) {
    var box = document.getElementById('homeZipErr');
    box.textContent = text || '';
    box.style.color = isError ? '#c23b34' : '';
    box.hidden = !text;
  }
  async function goZip(z) {
    if (await HS.data.isCovered(z)) location.href = 'community.html?zip=' + z;
    else { HS.openLoc(); document.getElementById('locZip').value = z; HS.findCommunity(); }
  }
  async function homeFind() {
    var el = document.getElementById('homeZip'), q = el.value.trim();
    if (homeBusy) return;
    homeMsg('');
    var zip = q.match(/^(\d{5})(?:-\d{4})?$/);
    if (zip) { el.style.borderColor = ''; return goZip(zip[1]); }
    // The same minimum the Add-an-address box asks for before it calls the geocoder.
    if (q.length < 8 || q.indexOf(' ') < 0) {
      el.style.borderColor = '#c23b34'; el.focus();
      homeMsg('Enter a 5-digit zip code, or a street address with its city or ZIP.', true);
      return;
    }
    el.style.borderColor = '';
    if (HS_CONFIG.DATA_SOURCE !== 'supabase') { homeMsg('Searching by address needs the live site.', true); return; }
    var btn = document.querySelector('.ziprow .find');
    homeBusy = true;
    if (btn) { btn.disabled = true; btn.setAttribute('aria-busy', 'true'); }
    homeMsg('Looking up the official address…');
    var m = null, unavailable = false;
    try {
      var r = await HS.sb().functions.invoke('geocode-address', { body: { address: q } });
      if (r.error) unavailable = true;
      else m = (r.data && r.data.match) || null;
    } catch (e) { unavailable = true; }
    homeBusy = false;
    if (btn) { btn.disabled = false; btn.removeAttribute('aria-busy'); }
    if (unavailable) {
      homeMsg("The address service couldn't be reached — please try again in a minute.", true);
      return;
    }
    var mz = m ? String(m.zip == null ? '' : m.zip) : '';
    if (!/^\d{5}$/.test(mz)) {
      el.style.borderColor = '#c23b34';
      homeMsg("We couldn't confirm that address against U.S. Census records — try a different spelling, or add the city or ZIP.", true);
      return;
    }
    homeMsg('');
    try {
      if (HS.logEvent && homeLogged !== q) { homeLogged = q; HS.logEvent('property_lookup', { zip_code: mz }); }
    } catch (e) {}
    return goZip(mz);
  }
  HS.onReady(async function () {
    // index.html is Explore for everyone (founder navigation plan v3): lib/landing.js now
    // keeps every visitor here. The call stays so the decision keeps its one home.
    var dest = HS.landingFor(HS.state.session, HS.state.activeProperty);
    if (dest) { location.replace(dest); return; }
    // The preview is the SAMPLE card its caption names (Del Valle, TX). It used to be built
    // from the visitor's own ZIP and saved Address, so anyone outside 78617 read a card
    // from their own area captioned as Del Valle. That stayed rare while signed-in residents
    // were bounced to the dashboard; with the bounce gone it would reach every one of them.
    var changes = await HS.data.changes(HS_CONFIG.DEFAULT_ZIP, null);
    var flagship = changes.find(function (c) { return c.related_project_id; }) || changes[0];
    if (flagship) {
      // render a real story card as the homepage preview
      document.getElementById('homePreview').innerHTML = HS.tpl.storyCard(flagship);
    }
  });
</script>

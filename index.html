<!-- THE HOMEPAGE (founder, Revised Index Design — Final Claude-Ready, 2026-09-30). index.html is
     Explore for everyone: nothing here redirects, follows, saves or subscribes. The two visuals:
       1. the Development Activity report preview, the approved static asset
          assets/home-development-activity-report-preview.webp (merged in #1494), and
       2. the development map, which is NOT an image: it is Map 1 itself, iframed in its embed

          (&preview=1) so STATUS / PROJECT TYPE / REGULATORY RECORDS and the map key all show

     There is no second map, no copied filter or classifier, and no map image on this page. -->
<template id="hs-content">
  <div class="home-index">
    <section class="home-index__hero">
      <div class="home-index__hero-text">
        <h1 class="home-index__title">See what’s changing around a property.</h1>
        <p class="home-index__subhead">Track changes that impact your quality of life. Receive alerts on changes impacting traffic and water, air, noise and soil pollution.</p>
        <p class="home-index__subhead">HomeSignal connects these impacts to proposed developments, construction, infrastructure projects, and local government decisions. HomeSignal helps you understand what’s coming and how it could affect where you live.</p>
        <form class="home-index__search" id="homeSearch" role="search" novalidate>
          <label class="home-index__sr" for="homeQuery">Address or ZIP code</label>
          <input class="home-index__search-input" id="homeQuery" type="text" autocomplete="street-address" enterkeyhint="search" placeholder="Enter an address or ZIP code" aria-describedby="homeSearchErr">
          <button class="home-index__search-btn" id="homeSearchBtn" type="submit">Search</button>
        </form>
        <p class="home-index__search-error" id="homeSearchErr" role="alert" hidden></p>
        <p class="home-index__search-hint" id="homeNearHint" hidden></p>
        <p class="home-index__helper">No account required.</p>
      </div>
    </section>

    <!-- THE ONE ENTERPRISE MESSAGE on this page (there is no bottom banner). The launch gate
         was cleared by separate merged orders: Navigation v3 (#1517) linked
         development-activity.html from the shared header, and #1555 (founder, 2026-10-02,
         "list it sooner, without checkout") made it index, follow and put it in the
         sitemap, with its commerce buttons hidden. So this section links it (moved out of the hero into its own full-width section, 2026-10-10). This page changes
         no pricing, entitlement, robots, sitemap or checkout. -->
    <section class="home-index__report" aria-labelledby="homeEnterpriseHeading">
      <div class="home-index__enterprise-text">
        <p class="home-index__eyebrow">For real estate professionals</p>
        <h2 class="home-index__enterprise-heading" id="homeEnterpriseHeading">Development Activity reports for agents &amp; brokerages.</h2>
        <p class="home-index__enterprise-body">Know what’s changing around a property before your client does.</p>
        <a class="home-index__enterprise-cta" id="homeEnterpriseCta" href="development-activity.html">Explore Enterprise →</a>
      </div>
      <img src="assets/home-development-activity-report-preview.webp"
           class="home-index__report-preview"
           alt="Sample HomeSignal Development Activity report pages"
           width="1448" height="1086" decoding="async">
    </section>

    <section class="home-index__results" id="homeExploreResults" aria-labelledby="homeResultsHeading">
      <div class="home-index__results-head">
        <div>
          <h2 class="home-index__results-heading" id="homeResultsHeading" tabindex="-1">See an example: 78657 · Horseshoe Bay, Texas</h2>
          <p class="home-index__results-sub" id="homeResultsSub" hidden></p>
        </div>
        <a class="home-index__results-cta" id="homeMapCta" href="homesignalmap.html?zip=78657">Explore this ZIP →</a>
      </div>
      <div class="home-index__results-grid" id="homeResultsGrid">
        <div class="home-index__map-preview is-sample" id="homeMapWrap">
          <iframe class="home-index__map-frame" id="homeMapFrame"
                  src="homesignalmap.html?embed=1&amp;preview=1&amp;zip=78657"
                  title="Sample HomeSignal development map"
                  loading="lazy"
                  tabindex="-1"></iframe>
        </div>
        <div class="home-index__records" id="homeRecords">
          <h3 class="home-index__records-heading" id="homeRecordsHeading">Recent development records in 78657</h3>
          <div class="home-index__record-list" id="homeRecordList" role="status" aria-live="polite">Loading recent records…</div>
          <a class="home-index__see-all" id="homeSeeAll" href="development.html?zip=78657">See all development →</a>
        </div>
      </div>
    </section>

    <section class="home-index__feature-row" aria-label="What HomeSignal covers">
      <div class="home-index__feature"><h3>Development</h3><p>Proposed, approved and operating projects on the map.</p></div>
      <div class="home-index__feature"><h3>Government</h3><p>Permits, zoning and public notices.</p></div>
      <div class="home-index__feature"><h3>Meetings</h3><p>City council, planning and other upcoming meetings.</p></div>
      <div class="home-index__feature"><h3>Local news</h3><p>Development, local issues and community updates.</p></div>
    </section>

    <section class="home-index__how" aria-labelledby="homeHowHeading">
      <h2 class="home-index__how-heading" id="homeHowHeading">How HomeSignal works</h2>
      <ol class="home-index__steps">
        <li class="home-index__step"><span class="home-index__step-num" aria-hidden="true">1</span><div><h3>Search an address or ZIP</h3><p>Find a property or explore a ZIP.</p></div></li>
        <li class="home-index__step"><span class="home-index__step-num" aria-hidden="true">2</span><div><h3>See what’s changing</h3><p>See development on the map, plus government activity, meetings and local updates.</p></div></li>
        <li class="home-index__step"><span class="home-index__step-num" aria-hidden="true">3</span><div><h3>Follow what matters</h3><p>Save places and get updates over time.</p></div></li>

<script>
(function () {
  // EXPLORE SEARCH. A search hands the visitor to the Development Map (Map 1, homesignalmap.html)
  // (founder, 2026-10-04: "when an address or zip code is entered it should automatically take
  // you to the development map"). This replaces the 2026-09-30 "search stays on the homepage"
  // behaviour. Nothing here follows, saves, subscribes or changes a primary place.
  //   - A 5-digit ZIP goes to homesignalmap.html?zip=<zip>, Map 1's own ZIP route.
  //   - An address has no URL route on the full page (and an address must not be put in a URL),
  //     so it is handed over once through this tab's sessionStorage under HANDOFF_KEY. Map 1
  //     reads it at boot, removes it at once, and runs its own address search.
  //     That search is the one geocoder call, the one `property_lookup` event (ZIP only), and
  //     the one place that explains a failed lookup.
  // The sample map and records below the hero stay a static example.
  var SAMPLE_ZIP = '78657';
  var HANDOFF_KEY = 'hs.homeSearchAddress';   // read and removed by homesignalmap.html
  var homeSearchRunId = 0;
  var sampleObserver = null;
  var $ = function (id) { return document.getElementById(id); };

  // A buyer's shared Development Activity report links here with the property address in the URL FRAGMENT
  // (#address=...), never in the query: a fragment is not sent to any server (founder, 2026-10-09: link to the
  // full address). It is acted on HERE, as this script runs, and not in HS.onReady: that waits for the shell's whole
  // network boot (ZIP coverage, sign-in, saved topics, saved place), and the visitor sat on the homepage for seconds
  // before being moved. The fragment is taken out of the address bar first, the address goes through the SAME rule a
  // typed address does (searchKind, then the sessionStorage hand-off Map 1 reads and removes), and the page is hidden
  // until the browser leaves it so no homepage flashes. location.replace, so Back returns to the report and not to a
  // page that would redirect again. Anything that is not a plausible street address is ignored and the page loads as usual.
  var link = /^#address=(.+)$/.exec(location.hash || '');
  if (link) {
    var wanted = '';
    try { wanted = decodeURIComponent(link[1].replace(/\+/g, ' ')).trim(); } catch (err) { wanted = ''; }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (err) {}
    if (wanted.length <= 200 && searchKind(wanted) === 'address') {
      try {
        sessionStorage.setItem(HANDOFF_KEY, wanted);
        location.replace('homesignalmap.html');
      } catch (err) { document.documentElement.style.visibility = ''; /* blocked storage: an ordinary homepage visit */ }
    } else { document.documentElement.style.visibility = ''; }
  }

  // ---- the map ----------------------------------------------------------------------
  // THE SAMPLE IS AUTO-SIZED, NEVER GIVEN A FIXED HEIGHT. Map 1's preview document is as tall
  // as its content; this sets the iframe to that height on load and whenever it changes. The
  // canvas height inside it follows this page's breakpoint (430 / 400 / 340 px), passed as a
  // CSS variable, because the frame's own width cannot tell a desktop column from a tablet one.
  function previewCanvasPx() {
    var w = window.innerWidth || document.documentElement.clientWidth;
    return w >= 1024 ? 430 : (w >= 768 ? 400 : 340);
  }
  function isSample() { var w = $('homeMapWrap'); return !!(w && w.classList.contains('is-sample')); }
  function sampleDoc() {
    var f = $('homeMapFrame');
    try { return f && f.contentDocument && f.contentDocument.documentElement ? f.contentDocument : null; }
    catch (e) { return null; }
  }
  function sizeSample() {
    if (!isSample()) return;
    var f = $('homeMapFrame'), d = sampleDoc();
    if (!d) return;
    d.documentElement.style.setProperty('--hs-preview-map-h', previewCanvasPx() + 'px');
    // The root's scrollHeight is never less than the frame's own height, so it can report
    // growth but never shrinkage. Collapse the frame for the one synchronous measurement,
    // then set it: nothing paints in between.
    f.style.height = '0px';
    f.style.height = Math.ceil(d.documentElement.scrollHeight) + 'px';
  }
  function watchSample() {
    if (!isSample()) return;
    var d = sampleDoc();
    if (!d) return;
    if (sampleObserver) sampleObserver.disconnect();
    if (window.ResizeObserver) {
      var win = d.defaultView || window;
      var RO = win.ResizeObserver || window.ResizeObserver;
      sampleObserver = new RO(function () { sizeSample(); });
      sampleObserver.observe(d.documentElement);
    }
    sizeSample();
  }
  // ---- the local records column --------------------------------------------------------
  // The list beside the map is HS.data.projects(zip): local permit and planning records, in
  // the order the read returns them, the first three only when the read is complete. It does
  // not claim to be every Map 1 marker (the map also draws other planes). Type and lifecycle
  // labels come from lib/project-type.js and are never decided here.
  var esc = function (s) { return HS.esc(s == null ? '' : String(s)); };
  function isHttp(u) { return /^https?:\/\//i.test(String(u || '')); }
  function recordCard(p) {
    var t = (typeof HS.canonicalProjectType === 'function') ? HS.canonicalProjectType(p) : null;
    if (!t && p) console.warn('homepage: no canonical Type for development record', p.id);
    var lc = (typeof HS.canonicalLifecycle === 'function') ? HS.canonicalLifecycle(p) : null;
    var badges = (t ? '<span class="home-index__badge" data-type-key="' + esc(t.typeKey) + '">' + esc(t.label) + '</span>' : '')
      + (lc ? '<span class="home-index__badge home-index__badge--stage" data-lifecycle="' + esc(lc.key) + '">' + esc(lc.label) + '</span>' : '');
    var name = esc(p.name || 'Development record');
    var title = p.id
      ? '<a class="home-index__record-name" href="development.html?id=' + encodeURIComponent(p.id) + '">' + name + '</a>'
      : '<span class="home-index__record-name">' + name + '</span>';
    var meta = [];
    if (p.stage) meta.push(esc(p.stage));
    if (isHttp(p.source_ref)) meta.push('<a href="' + esc(p.source_ref) + '" target="_blank" rel="noopener">Official record ↗</a>');
    return '<article class="home-index__record">'
      + (badges ? '<div class="home-index__record-badges">' + badges + '</div>' : '')
      + title
      + (meta.length ? '<div class="home-index__record-meta">' + meta.join(' · ') + '</div>' : '')
      + '</article>';
  }
  function setRecordsMessage(text) { $('homeRecordList').innerHTML = '<p class="home-index__records-note">' + esc(text) + '</p>'; }
  async function loadRecords(zip, runId, emptyText) {
    var projects = null;
    try { projects = await HS.data.projects(zip, null); } catch (e) { projects = null; }
    if (runId !== homeSearchRunId) return;
    if (!projects || projects.complete !== true) { setRecordsMessage('Recent development list unavailable right now.'); return; }
    if (!projects.length) { setRecordsMessage(emptyText); return; }
    $('homeRecordList').innerHTML = projects.slice(0, 3).map(recordCard).join('');
  }

  // ---- search ------------------------------------------------------------------------
  function searchError(text) {
    var box = $('homeSearchErr');
    box.textContent = text || '';
    box.hidden = !text;
  }

  // ONE decision for what a query means, used by the search box AND by a link that arrives with an address:
  // a 5-digit ZIP, a plausible street address (the same minimum the Add-an-address box asks for before it
  // calls the geocoder), or too short to search.
  function searchKind(q) {
    if (/^\d{5}$/.test(q)) return 'zip';
    if (q.length < 8 || q.indexOf(' ') < 0) return 'short';
    return 'address';
  }

  function submit(e) {
    if (e) e.preventDefault();
    var q = String($('homeQuery').value || '').trim();
    searchError('');
    var kind = searchKind(q);
    if (kind === 'zip') { location.assign('homesignalmap.html?zip=' + q); return; }
    if (kind === 'short') {
      searchError('Enter a 5-digit ZIP code, or a street address with its city or ZIP.');
      $('homeQuery').focus();
      return;
    }
    // sessionStorage can be unavailable (private window, blocked site data). Then the address
    // cannot travel, and saying so beats landing on an empty map.
    try { sessionStorage.setItem(HANDOFF_KEY, q); }
    catch (err) { searchError('Your browser blocked the search. Open the Development Map and enter the address there.'); return; }
    location.assign('homesignalmap.html');
  }

  HS.onReady(function () {
    $('homeSearch').addEventListener('submit', submit);
    // A ZIP page with no ZIP-wide map (lib/zip-coverage.json) sends its visitor here with ?near=<zip>:
    // say what to enter and put the cursor in the box. The ZIP is context for the hint only; the
    // search itself still geocodes the address that gets typed and searches around that point.
    var near = new URLSearchParams(location.search).get('near');
    if (/^\d{5}$/.test(near || '')) {
      var hint = $('homeNearHint');
      hint.textContent = 'Enter a street address near ZIP ' + near + ' to see development activity around that address.';
      hint.hidden = false;
      $('homeQuery').focus();
    }
    var f = $('homeMapFrame');
    f.addEventListener('load', function () { watchSample(); });
    // The frame is in the page from the moment the shell injects it, so Map 1 can finish
    // loading before this runs. about:blank also reads "complete", hence the URL check.
    var d = sampleDoc();
    if (d && d.readyState === 'complete' && /homesignalmap\.html/.test(String(d.location && d.location.href))) watchSample();
    window.addEventListener('resize', function () { sizeSample(); });
    // The sample list: one read of the sample ZIP. Search replaces it.
    loadRecords(SAMPLE_ZIP, homeSearchRunId, 'No local permit/planning records to list here.');
  });
})();
</script>

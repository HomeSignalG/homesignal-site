  // (shape,colour) pair the rest layer needs. Deterministic and fully local: the
  // SVG is built by the SAME function the lettered pins and the legend use, so a
  // rest marker cannot drift from a lettered one. No sprite sheet and no external
  // runtime dependency — the CSP on this page allows neither.
  var restIconsAdded = {};
  var lastRestSet = [];        // the rest set most recently handed to a renderer
  // Decoding an SVG data URI is ASYNCHRONOUS, so the icons for a freshly-drawn view are
  // not in the style yet when setData runs. MapLibre would then warn once per missing
  // image and leave those points unplaced until something else forced a re-place. So the
  // caller hands us the source and we re-feed it when the batch lands — one extra
  // setData, only on the first view that needs a new (shape,colour) pair.
  function registerRestIcons(fc, onReady){
    if (!glMap || !HS.restIconSpecs) return;
    var pending = 0, fired = false;
    var settle = function(){ if (--pending === 0 && !fired) { fired = true; if (onReady) onReady(); } };
    HS.restIconSpecs(fc).forEach(function(spec){
      if (restIconsAdded[spec.id]) return;
      restIconsAdded[spec.id] = 1;
      if (glMap.hasImage && glMap.hasImage(spec.id)) return;
      var px = 44;                                     // 2x of the 22px drawn size
      var svg = HS.markerSVG(spec.shape, spec.color, '', px);
      var img = new Image(px, px);
      pending++;
      img.onload = function(){
        try {
          if (!(glMap.hasImage && glMap.hasImage(spec.id))) {
            var cv = document.createElement('canvas');
            cv.width = px; cv.height = px;
            var ctx = cv.getContext('2d');
            ctx.drawImage(img, 0, 0, px, px);
            // data: URIs are same-origin, so getImageData does not taint the canvas.
            glMap.addImage(spec.id, ctx.getImageData(0, 0, px, px), { pixelRatio: 2 });
          }
        } catch (e) { /* a failed icon leaves the point undrawn, never mis-shaped */ }
        settle();
      };
      img.onerror = function(){ restIconsAdded[spec.id] = 0; settle(); };
      // Inline SVG data URI — same-origin, no network fetch.
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });
    if (pending === 0 && onReady) onReady();          // every icon already in the style
  }
  function drawGL(){
    var items = shownItems();
    document.getElementById('mapSch').style.display='none';
    document.getElementById('maplf').style.display='none';
    document.getElementById('mapgl').style.display='block';
    ensureGL();
    if (glFailed || !glMap) return;
    if (!glReady){ setGps(items); renderInfo(items); return; }
    glMap.resize();
    glMap.setLayoutProperty('sat','visibility', opts.mode==='satellite'?'visible':'none');
    glMap.setLayoutProperty('osm','visibility', opts.mode==='street'?'visible':'none');
    glMap.getSource('radius').setData(opts.showRadius ? circle(center.lat,center.lng,opts.radiusMi) : {type:'FeatureCollection',features:[]});
    ['radius-fill','radius-casing','radius-line'].forEach(function(id){
      glMap.setLayoutProperty(id,'visibility', opts.showRadius?'visible':'none');
    });
    var wantZoom = zoomFor(opts.radiusMi);
    if (glLastView !== center.lat + ',' + center.lng + '@' + wantZoom) {
      glLastView = center.lat + ',' + center.lng + '@' + wantZoom;
      glMap.easeTo({ center:[center.lng,center.lat], zoom: wantZoom, duration:300 });
    }
    addMarkers(items);
    // Maps uncap: feed the clustered rest layer everything visible beyond the letters.
    var rest = restItems(items);
    restById = {};
    lastRestSet = rest;                           // verification hook (__HS_REST_VERIFY)
    rest.forEach(function(it){ if (it.id != null) restById[it.id] = it; });
    var restSrc = glMap.getSource('hs-rest');
    var restFC = HS.restFeatureCollection(rest);
    // Icons must be in the style before the symbols are placed; the second setData is
    // the no-op re-place for the pairs that were still decoding on this first draw.
    registerRestIcons(restFC, function(){ if (restSrc) restSrc.setData(restFC); });
    if (restSrc) restSrc.setData(restFC);
    if (window.__HS_MAP) {
      window.__HS_MAP.restCount = rest.length;    // CI hook (verify-maps-uncap)
      // CI hook (verify-maps-rest-shapes): what the REST layer will actually draw.
      window.__HS_MAP.restShapes = restFC.features.map(function (f) {
        return { id: f.properties.id, shape: f.properties.shape, col: f.properties.col };
      });
    }
    setGps(items); renderInfo(items);
    wirePanel(drawGL);
  }

  // ---------- Leaflet raster fallback (real tiles WITHOUT WebGL) ----------
  var lfMap=null, lfSat=null, lfOsm=null, lfBase=null, lfRadius=null, lfMarkers=[],
      lfFailed=false, lfTilesOK=0, lfTileErrs=0, lfWatchdogArmed=false, lfLastView=null;
  var loadLeaflet = HS.loadLeaflet;
  function lfDivIcon(html,size){ return L.divIcon({html:html, className:'', iconSize:[size,size], iconAnchor:[size/2,size/2]}); }
  function clearLfMarkers(){ lfMarkers.forEach(function(m){ try{ lfMap.removeLayer(m); }catch(e){} }); lfMarkers=[]; }
  function addLfMarkers(items){
    clearLfMarkers();
    if (hasRealHome) {
      lfMarkers.push(L.marker([center.lat,center.lng],{zIndexOffset:1000,icon:lfDivIcon(HS.homeMarkerHTML(26),26),
          title:'Your home · '+HS.homeAddressLine(home)})
        .bindPopup(HS.homePopupHTML(home),{maxWidth:260}).addTo(lfMap));
    }
    items.forEach(function(it){
      var mk = HS.resolveMarker(it);
      var m = L.marker([it.lat,it.lng],{icon:lfDivIcon('<div class="hspin" style="line-height:0">'+HS.markerSVG(mk.shape, mk.color, it._letter||'', 26)+'</div>',26),
          title:(mk.typeLabel||it.type||it.category||(it._facility?'Regulated facility':'Record'))+' · '+(it.name||it.title||'')})
        .addTo(lfMap);
      m.on('click', function(){ openItem(it); });
      lfMarkers.push(m);
    });
    if (opts.showFacilities) unletteredFacs(items).forEach(function(f){
      var fmk = HS.resolveMarker(Object.assign({}, f, { _facility: true, record_kind: 'facility' }));
      var fm = L.marker([f.lat,f.lng],{icon:lfDivIcon('<div style="line-height:0">'+HS.markerSVG(fmk.shape, fmk.color, '', 20)+'</div>',20),
          title:'Regulated facility · '+(f.name||'')})
        .addTo(lfMap);
      fm.on('click', function(){ selectFacility(f); });            // same panel, never navigates
      lfMarkers.push(fm);
    });
    // Maps uncap: the rest layer on the fallback map — shape-bearing divIcons, so a
    // record past the lettered head shows its real TYPE here exactly as it does on the
    // GL symbol layer. Same click dispatch as a lettered pin (facility rest points ->
    // facility detail).
    var rest = restItems(items);
    lastRestSet = rest;                                             // verification hook
    if (window.__HS_MAP) window.__HS_MAP.restCount = rest.length;   // CI hook (verify-maps-uncap)
    if (rest.length) {
      rest.forEach(function(it){
        var mk = HS.resolveMarker(it);
        // divIcon carrying the SAME HS.markerSVG a lettered pin uses, so a rest
        // record shows its real SHAPE here too. This replaced canvas circleMarkers,
        // which could only express colour and therefore drew every record past the
        // lettered head as a circle regardless of its type.
        var m = L.marker([it.lat, it.lng], {
          icon: lfDivIcon('<div class="hspin hsrest" data-rid="' + HS.esc(String(it.id == null ? '' : it.id))
            + '" style="line-height:0">' + HS.markerSVG(mk.shape, mk.color, '', 20) + '</div>', 20),
          title:(mk.typeLabel||it.type||it.category||'Record')+' · '+(it.name||it.title||'')
        }).addTo(lfMap);
        m.on('click', function(){ if (it._restFacility) selectFacility(it); else openItem(it); });
        m.bindTooltip((mk.typeLabel||it.type||it.category||'Record')+' · '+(it.name||it.title||''));
        lfMarkers.push(m);
      });
    }
  }
  // ── Rest-layer symbology verification hook (scripts/verify-maps-rest-shapes.mjs) ──
  // The lettered A–P pins are DOM nodes, so __HS_MARKER_DOM_VERIFY can read their SVG
  // geometry directly. The REST layer past the letters is not DOM on the tile maps — it
  // is a MapLibre symbol layer drawn to canvas — so its correctness has to be read out
  // of live GL state instead. That blind spot is exactly how the defect shipped: the
  // rest layer was `type:'circle'` and every record past the 16th drew a circle whatever
  // its type, with no DOM to catch it.
  //
  // Returns live, per-record evidence — never a self-report: the layer's real type, the
  // real `icon-image` expression, whether each icon IMAGE is actually registered in the
  // GL style, the shape each renderer drew, and every circle that is NOT backed by an
  // honest FALLBACK:other classification.
  window.__HS_REST_VERIFY = function () {
    var out = { mode: opts.mode, radiusMi: opts.radiusMi, hasHome: hasRealHome,
                homeAddress: hasRealHome ? home.address : null,
                restTotal: lastRestSet.length, gl: null, focus: null,
                leaflet: null, expected: [], unexplainedCircles: [], shapeCounts: {},
                fallbackCounts: {} };
    lastRestSet.forEach(function (it) {
      var mk = HS.resolveMarker(it);
      out.expected.push({ id: it.id, name: it.name || it.title || '', shape: mk.shape,
        col: mk.color, rule: mk.shapeRule, reason: mk.fallbackReason || '',
        distMi: it.distance_mi == null ? null : +it.distance_mi,
        srcType: it.type || it.use_type || it.layer || it.category || '' });
      out.shapeCounts[mk.shape] = (out.shapeCounts[mk.shape] || 0) + 1;
      if (mk.shape === 'circle') {
        var why = mk.shapeRule === 'FALLBACK:other' && mk.fallbackReason ? 'honest' : 'UNEXPLAINED';
        out.fallbackCounts[why] = (out.fallbackCounts[why] || 0) + 1;
        if (why === 'UNEXPLAINED') out.unexplainedCircles.push({ id: it.id,
          name: it.name || it.title || '', srcType: it.type || it.use_type || '',
          rule: mk.shapeRule || null });
      }
    });
    // --- MapLibre (Street + Satellite share this layer) ---
    if (glMap && glReady && glMap.getLayer && glMap.getLayer('hs-rest-pt')) {
      var lyr = glMap.getLayer('hs-rest-pt');
      var src = glMap.getSource('hs-rest');
      var fc = (src && src._data) || { features: [] };
      out.gl = {
        layerType: lyr.type,
        iconImage: JSON.stringify(glMap.getLayoutProperty('hs-rest-pt', 'icon-image')),
        featureCount: fc.features.length,
        renderedCount: (glMap.querySourceFeatures ? glMap.querySourceFeatures('hs-rest').length : -1),
        features: fc.features.map(function (f) {
          return { id: f.properties.id, shape: f.properties.shape, col: f.properties.col,
            icon: f.properties.icon,
            imageRegistered: !!(glMap.hasImage && glMap.hasImage(f.properties.icon)) };
        })
      };
    }
    // --- Focus (schematic SVG — real DOM geometry, read the same way as a lettered pin) ---
    var schG = document.querySelectorAll('#mapSch .hs-rest-pins g.hspin');
    if (schG.length) {
      out.focus = { count: schG.length, shapes: [].map.call(schG, function (g) { return geomFromNode(g); }) };
    }
    // --- Leaflet raster fallback (only present when WebGL is unavailable) ---
    var lfPins = document.querySelectorAll('#maplf .leaflet-marker-icon .hspin.hsrest');
    if (lfPins.length) {
      out.leaflet = { count: lfPins.length, pins: [].map.call(lfPins, function (d) {
        return { id: d.getAttribute('data-rid'), shape: geomFromNode(d.querySelector('svg')) };
      }) };
    }
    return out;
  };

  function lfFail(){
    if (lfFailed) { schematicFinal(); return; }
    lfFailed = true;
    try { if (lfMap) lfMap.remove(); } catch (e) {}
    lfMap = null;
    schematicFinal();
  }
  function drawLF(){
    var items = shownItems();
    document.getElementById('mapSch').style.display='none';
    document.getElementById('mapgl').style.display='none';
    document.getElementById('maplf').style.display='block';
    if (!lfMap){
      lfMap = L.map('maplf', { zoomSnap: 0.2 });
      if (lfMap.attributionControl) lfMap.attributionControl.setPrefix(
        '<a href="https://leafletjs.com" title="A JavaScript library for interactive maps">Leaflet</a>');
      lfSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {attribution:'© Esri, Maxar', maxZoom:19});
      lfOsm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OpenStreetMap', maxZoom:19, subdomains:'abc'});
      [lfSat,lfOsm].forEach(function(t){
        t.on('tileload',  function(){ lfTilesOK++; });
        t.on('tileerror', function(){ if (++lfTileErrs >= 4 && lfTilesOK === 0) lfFail(); });
      });
    }
    if (!lfWatchdogArmed){
      lfWatchdogArmed = true;
      setTimeout(function(){
        if (!lfFailed && lfMap && lfTilesOK === 0 && opts.mode !== 'impact') {
          console.warn('[maps] no raster tiles painted on the fallback map — showing the impact diagram.');
          lfFail();
        }
      }, 8000);
    }
    var want = (opts.mode === 'street') ? lfOsm : lfSat;
    if (lfBase !== want){ if (lfBase) lfMap.removeLayer(lfBase); want.addTo(lfMap); lfBase = want; }
    var lfWantView = center.lat + ',' + center.lng + '@' + zoomFor(opts.radiusMi);
    if (lfLastView !== lfWantView) { lfLastView = lfWantView; lfMap.setView([center.lat, center.lng], zoomFor(opts.radiusMi)); }
    if (lfRadius){ lfMap.removeLayer(lfRadius); lfRadius = null; }
    if (opts.showRadius) {
      var rM = opts.radiusMi*1609.34, clat=+center.lat, clng=+center.lng;   // coerce: DB home coords may be strings
      // White casing under the green dashed ring — same reason as the GL map: a bare
      // thin green line disappears into satellite imagery / street tiles.
      lfRadius = L.layerGroup([
        L.circle([clat,clng], { radius: rM, color:'#ffffff', weight:5, opacity:0.85, fill:false }),
        L.circle([clat,clng], { radius: rM, color:'#157a49', weight:2.5, opacity:1, dashArray:'4 4', fillColor:'#157a49', fillOpacity:0.10 })
      ]).addTo(lfMap);
    }
    addLfMarkers(items);
    setGps(items); renderInfo(items);
    wirePanel(drawLF);
  }
  function drawTiles(){
    if (!center) { setActiveMode('impact'); showSchematic(); return; }
    if (!glFailed && window.maplibregl) { drawGL(); return; }
    if (lfFailed) { schematicFinal(); return; }
    loadLeaflet(function(ok){
      if (opts.mode === 'impact') return;
      if (ok && !lfFailed) drawLF(); else lfFail();
    });
  }

  function showSchematic(){
    document.getElementById('mapgl').style.display='none';
    document.getElementById('maplf').style.display='none';
    document.getElementById('mapSch').style.display='block';
    drawSchematic();
  }
  function setActiveMode(mode){
    opts.mode = mode;
    var seg = document.getElementById('mapMode');
    [].forEach.call(seg.querySelectorAll('button'), function(b){ b.classList.toggle('on', b.dataset.mode === mode); });
  }
  function degradeToSchematic(){
    if (glFailed) return;
    glFailed = true;
    try { if (glMap) glMap.remove(); } catch (e) {}
    glMap = null; glReady = false;
    if (opts.mode === 'impact') { showSchematic(); return; }
    drawTiles();
  }
  var tilesDead = false;
  function schematicFinal(){
    if (!tilesDead){
      tilesDead = true;
      var seg = document.getElementById('mapMode');
      ['satellite','street'].forEach(function(m){
        var b = seg.querySelector('[data-mode="'+m+'"]'); if (!b) return;
        b.style.opacity = '.45'; b.setAttribute('aria-disabled','true');
        b.title = "Live map imagery isn't available in this browser or network right now";
      });
      if (HS.toast) HS.toast("Live map imagery isn't loading right now — showing a simplified view of the same projects.");
    }
    setActiveMode('impact');
    showSchematic();
  }

  if (all.length || facs.length) {
    setActiveMode('satellite');
    drawTiles();
  } else {
    setActiveMode('impact');
    showSchematic();
  }

  // View toggle: All Projects <-> What's Changed. Switching lands on the new
  // view's LIST (any open detail closes), and the CI-checked default stays 'all'.
  function setView(v) {
    if (opts.view === v) return;
    opts.view = v;
    selected = null;
    var seg = document.getElementById('viewSeg');
    [].forEach.call(seg.querySelectorAll('button'), function (b) {
      var on = b.dataset.view === v;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    redraw();
    // What's Changed opens the Recent Changes slide-over; All Projects returns
    // to the full, unobstructed map (the whole point of map-first).
    if (v === 'changed') openPanel(); else closePanel();
  }
  document.getElementById('viewSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-view]'); if (!btn) return;
    setView(btn.dataset.view);
  });

  document.getElementById('mapMode').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-mode]'); if (!btn) return;
    if (btn.getAttribute('aria-disabled') === 'true') {
      if (HS.toast) HS.toast("Live map imagery isn't available right now — this simplified view shows the same projects.");
      return;
    }
    [].forEach.call(this.querySelectorAll('button'), function(b){ b.classList.remove('on'); });
    btn.classList.add('on');
    opts.mode = btn.dataset.mode;
    if (opts.mode === 'impact') { showSchematic(); return; }
    drawTiles();
  });

  // Map-view radius: a dropdown menu (matches the Quality of Life pill),
  // not a click-to-cycle — the ▾ opens a real list so every radius is one click away.
  var radii = [0.5,1,1.5,2,3,5], ri = 2;
  (function setupRadiusMenu() {
    var pill = document.getElementById('radiusPill');
    var menu = document.getElementById('radiusMenu');
    function renderPill() { pill.innerHTML = '◉ Map view: ' + opts.radiusMi + ' mi ▾'; }
    menu.innerHTML = '<div class="fh">Map view radius</div>'
      + radii.map(function (r, i) {
          return '<label><input type="radio" name="hsradius" data-i="' + i + '"'
            + (i === ri ? ' checked' : '') + '><span>' + r + ' mi</span></label>';
        }).join('');
    wireMenu(pill, menu);
    menu.addEventListener('change', function (e) {
      var cb = e.target.closest('input[data-i]'); if (!cb) return;
      ri = +cb.getAttribute('data-i'); opts.radiusMi = radii[ri];
      renderPill();
      closeAllMenus();
      if (opts.mode === 'impact') showSchematic(); else drawTiles();
    });
  })();
});

// A small .ics generator for the Public Participation "Add hearing to calendar" button.
HS.mapAddToCalendar = window.mapAddToCalendar = async function (projectId) {
  var meetings = await HS.data.meetings(HS.state.zip, HS.state.activeProperty);
  var m = meetings.find(function(x){return x.related_project_id===projectId;}) || meetings[0];
  if (!m) return;
  function z(d){ return new Date(d).toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''); }
  var ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//HomeSignal//EN','BEGIN:VEVENT',
    'UID:' + m.id + '@homesignal','DTSTART:' + z(m.starts_at),'SUMMARY:' + m.title,
    'LOCATION:' + (m.location||''),'DESCRIPTION:' + (m.source_ref||''),'END:VEVENT','END:VCALENDAR'].join('\r\n');
  var a = document.createElement('a');
  a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
  a.download = (m.title||'hearing').replace(/\W+/g,'-') + '.ics'; a.click();
};
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; form-action 'self'">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://homesignal.net/homesignalmap.html">
<title>HomeSignal — Maps has moved</title>
<script>
// RETIRED 2026-09-04. This page was the second map experience. It existed while the one
// primary map could not answer "what is physically near this address"; that map now owns
// both geographic modes - ZIP -> the entire ZIP geography, and street address -> geocoder
// -> HOME -> 0.5/1/2/5 mile radius over canonical N5 project geometry - so two competing
// map experiences no longer serve the resident.
//
// The file stays as a REDIRECT rather than being deleted because this URL is reachable from
// bookmarks and from the in-app navigation people have used. A dead end would lose them; the
// query string is carried across so ?zip=<zip> lands on the same ZIP on the primary map.
// Same convention as 404.html's pretty-route forwarding: location.replace, so the retired
// page does not sit in the back-button history.
(function () {
  var q = window.location.search || '';
  window.location.replace('/homesignalmap.html' + q);
})();
</script>
</head>
<body>
<p>The map has moved. <a href="/homesignalmap.html">Open the HomeSignal map &rarr;</a></p>
</body>

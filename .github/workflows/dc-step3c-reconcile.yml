name: dc-step3c-reconcile

# STEP 3C — the resident data-centre reconciliation, run LIVE against production (read-only).
#
# The ledger view (public.dc_resident_lineage_ledger) holds lineage at publisher-identity grain;
# scripts/dc-step3c-reconcile.mjs runs the SHIPPED classifier (lib/map.js) over it, checks the
# ledger against counts taken straight from the source tables, and fails on any omitted record,
# duplicate identity, unknown grain, missing record class, or UNEXPLAINED outcome.
#
# It WRITES NOTHING. NO schedule: this is a verification a change must pass, not a job that runs
# on its own.
#
# WHEN EACH HALF RUNS (2026-10-22). The offline core runs on every PR that touches the
# reconciliation, its classifier inputs or the ledger DDL. The LIVE reconciliation reads
# production with SUPABASE_ACCESS_TOKEN, which is account-wide, so it no longer runs on PRs: a PR
# run executes the PR's own code and was handed that token. It runs when the same paths reach
# main (push) and on manual dispatch from main, so a change that breaks the reconciliation still
# shows red, minutes after merge instead of before it. Proving PR code live before merge needs a
# read-only production path (as homesignal-ingest's ci-read), which the site does not have yet.
#
# Results print into the job log -- the receipt channel, since the sandbox cannot read artifacts.

on:
  pull_request:
    paths:
      - 'scripts/dc-step3c-reconcile.mjs'
      - 'test/dc-step3c-reconcile.test.mjs'
      - 'docs/dc-step3c-*.sql'
      - 'lib/templates.js'
      - 'lib/project-type.js'
      - 'lib/map.js'
      - 'lib/zip-authoritative.js'
      - 'lib/residential-qualify.js'
      - '.github/workflows/dc-step3c-reconcile.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/dc-step3c-reconcile.mjs'
      - 'test/dc-step3c-reconcile.test.mjs'
      - 'docs/dc-step3c-*.sql'
      - 'lib/templates.js'
      - 'lib/project-type.js'
      - 'lib/map.js'
      - 'lib/zip-authoritative.js'
      - 'lib/residential-qualify.js'
      - '.github/workflows/dc-step3c-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: the reconciliation core can fail (offline)
        run: node test/dc-step3c-reconcile.test.mjs

  reconcile:
    needs: offline
    # Never on a pull request: this job holds SUPABASE_ACCESS_TOKEN (see the header).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The ledger evaluates in ~35 s (a regex scan of app_projects plus national_dc_for_zip over
    # every admitted ZIP). 10 minutes turns a hang into a red check, not a silent bill.
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_REF: qwnnmljucajnexpxdgxr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: reconcile production (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/dc-step3c-reconcile.mjs

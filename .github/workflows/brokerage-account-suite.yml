name: brokerage-account-suite

# TWO PARKED, UNAPPLIED SQL FILES, each proven here against a DISPOSABLE Postgres. This workflow only ever addresses a container.
#
# 1. THE BROKERAGE ACCOUNT SPINE (docs/brokerage-account-spine.sql; Development Activity plan Order K0): the two tables and the one
# resolver that say who a signed-in person is in the commercial sense (a brokerage account, an explicit membership of one Supabase Auth
# user in one brokerage as owner or agent, and brokerage_membership_of(user_id)). Job `spine` runs the SHIPPED SQL:
#   1. the suite — the file seeds nothing; the tables are unreadable by anon, authenticated and service_role (RLS on, no policy, every
#      privilege revoked) and reached only through the resolver; one ACTIVE membership per user; closed vocabularies; the last active
#      owner of an active brokerage cannot be deactivated or demoted; identity and history cannot be rewritten; deleting an auth user is
#      never blocked; the resolver answers for an active member of an active brokerage, by user id only, never by email or domain;
#   2. two sessions removing the two owners of one brokerage at the same moment leave exactly one;
#   3. the file applies twice with an identical definition; a poisoned state (a policy that would make a table readable) stops the
#      apply, and a stray grant is revoked by it;
#   4. every prohibited mutation of that SQL, each of which MUST fail the executable checks (test/brokerage_account_mutants.py).
#
# 2. THE EVALUATION ENTITLEMENT (docs/evaluation-entitlement.sql; Order L1): the database layer of the 20-report brokerage evaluation,
# built DARK on top of the spine, the private-context layer and the snapshot writer, which job `evaluation` applies UNMUTATED first.
#   1. the suite — hashed one-time invites bound to a user id; the redeem function is the writer of the membership and honours every
#      spine rule; the credit ledger is append-only and the 20-report cap is a CONSTRAINT; a retried key returns the stored report and
#      charges nothing; a refusal by the snapshot costs no credit; nothing an agent typed reaches any new table;
#   2. REAL concurrent sessions: two issues serialise, the last credit goes to one caller, one key is one credit, thirty callers win
#      exactly twenty credits, one token and one seat go to one person, a member removed while waiting is refused, a mint during a
#      revocation is refused; and at REPEATABLE READ and SERIALIZABLE a writer that bypasses the functions still cannot add a 21st row;
#   3. the stored token hash equals what an independent tool (sha256sum) computes; the file applies twice with an identical definition;
#      a poisoned state is refused; the ROLLBACK footer removes exactly its own objects;
#   4. every prohibited mutation of that SQL, each of which MUST fail the executable checks (test/evaluation_entitlement_mutants.py).
# The offline halves (test/brokerage-account-structure.test.mjs and test/evaluation-entitlement-structure.test.mjs) run in
# unit-tests.yml with every other offline suite.
#
# This workflow holds NO Supabase credential and refuses to run if one is present: it can only ever address the disposable containers.

on:
  pull_request:
    paths:
      - 'docs/brokerage-account-spine.sql'
      - 'test/brokerage_account_pg/**'
      - 'test/brokerage_account_mutants.py'
      - 'docs/evaluation-entitlement.sql'
      - 'docs/report-snapshot.sql'
      - 'docs/report-private-context.sql'
      - 'test/evaluation_entitlement_pg/**'
      - 'test/evaluation_entitlement_mutants.py'
      - '.github/workflows/brokerage-account-suite.yml'
  push:
    branches: [main]
    paths:
      - 'docs/brokerage-account-spine.sql'
      - 'test/brokerage_account_pg/**'
      - 'test/brokerage_account_mutants.py'
      - 'docs/evaluation-entitlement.sql'
      - 'docs/report-snapshot.sql'
      - 'docs/report-private-context.sql'
      - 'test/evaluation_entitlement_pg/**'
      - 'test/evaluation_entitlement_mutants.py'
      - '.github/workflows/brokerage-account-suite.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brokerage_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run if any Supabase credential is present
        run: |
          if [ -n "${SUPABASE_DB_URL:-}${SUPABASE_ACCESS_TOKEN:-}${SUPABASE_WRITE_KEY:-}" ]; then
            echo "ABORT: this suite must only ever address the disposable container."; exit 1
          fi
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: The spine passes; two owners removed at once leave one; it applies twice; a poisoned state is refused; every prohibited mutation is killed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: brokerage_disposable
        run: |
          set -o pipefail
          bash test/brokerage_account_pg/run.sh 2>&1 | grep -v NOTICE | tee /tmp/ba.log

  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: evaluation_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run if any Supabase credential is present
        run: |
          if [ -n "${SUPABASE_DB_URL:-}${SUPABASE_ACCESS_TOKEN:-}${SUPABASE_WRITE_KEY:-}" ]; then
            echo "ABORT: this suite must only ever address the disposable container."; exit 1
          fi
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: The evaluation passes; real sessions race for the credits; the cap holds at every isolation level; it applies twice; a poisoned state is refused; every prohibited mutation is killed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: evaluation_disposable
        run: |
          set -o pipefail
          bash test/evaluation_entitlement_pg/run.sh 2>&1 | grep -v NOTICE | tee /tmp/ev.log

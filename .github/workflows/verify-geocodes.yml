name: verify-geocodes

# Automated geofence check for every GEOCODED point on the development tracker: each point is
# reverse-looked-up to its containing ZCTA + county and compared to the ZIP/county it's filed
# under. A point outside its stated polygon fails the run — bad geocodes surface with no manual
# coordinate inspection. Runs where egress works (GitHub runner); the build sandbox cannot reach
# the Census API. Zero-touch: reads the live development_reports + property_reports tables, so
# newly-cached points are covered with no code change. No browser needed (pure data + HTTP).

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Optional: cap the number of points checked (e.g. "5" for a smoke run)'
        required: false
        default: ''
  # SCHEDULE DISABLED 2026-08-06 (quota). This job was 10-for-10 NON-SUCCESS in August while
  # consuming 942 runner-min — a third of the 3,000/month quota — so it was paying full price
  # for no green signal. It stays available on demand (workflow_dispatch above) and still runs
  # on pushes to main that touch the geocode path below. Re-enable the cron only after the
  # failures are diagnosed and it can finish green.
  # schedule:
  #   - cron: '47 13 * * *'   # daily 13:47 UTC — just after verify-development
  # PUSH TRIGGER DROPPED 2026-08-06 (quota). Even with the cron off this still cost
  # 717 runner-min/month, and the job has been green ZERO times in 13 attempts — paying
  # anything for a check that has never once attested is the worst value on the board.
  # Dispatch-only until the failures are diagnosed and it can finish green; restore the
  # push block below verbatim at that point.
  # push:
  #   branches: [main]
  #   paths:
  #     - 'supabase/functions/get-address-report/geocode-cache.ts'
  #     - 'supabase/functions/get-address-report/sources/tdlr-tabs.ts'
  #     - 'docs/geocodes-setup.sql'
  #     - 'scripts/verify-geocodes.mjs'
  #     - '.github/workflows/verify-geocodes.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    # BUDGET BACKSTOP (2026-08-02). This job did not complete a run between 23 July and 2 August:
    # 11 consecutive cancellations at GitHub's default 6h cap, ~54h of runner time producing
    # nothing. The script now has its own wall-clock budget (GEOCODE_TIME_BUDGET_MS, default
    # 3.5h) and reports truncation; this is the second line of defence, so a wrong estimate
    # inside the script can never again cost a full 6h.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify geocode geofence
        env:
          SAMPLE: ${{ github.event.inputs.sample }}
        run: node scripts/verify-geocodes.mjs

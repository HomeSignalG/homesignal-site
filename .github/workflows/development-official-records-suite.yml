name: development-official-records-suite

# Official records and the daily proposal job (docs/development-official-records.sql) against a DISPOSABLE
# Postgres: grants, organizations only, append-only history, removals marked not deleted, and
# exactly the expected candidates. Every mutation in test/development_official_records_pg/mutations
# MUST be caught. Never touches production.

on:
  pull_request:
    paths:
      - 'docs/development-dossier.sql'
      - 'docs/development-review.sql'
      - 'docs/development-official-records.sql'
      - 'test/development_dossier_pg/**'
      - 'test/development_official_records_pg/**'
      - '.github/workflows/development-official-records-suite.yml'
  push:
    branches: [main]
    paths:
      - 'docs/development-dossier.sql'
      - 'docs/development-review.sql'
      - 'docs/development-official-records.sql'
      - 'test/development_dossier_pg/**'
      - 'test/development_official_records_pg/**'
      - '.github/workflows/development-official-records-suite.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development-official-records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: development_dossier_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run if any Supabase credential is present
        run: |
          if [ -n "${SUPABASE_DB_URL:-}${SUPABASE_ACCESS_TOKEN:-}${SUPABASE_WRITE_KEY:-}" ]; then
            echo "ABORT: this suite must only ever address the disposable container."; exit 1
          fi
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Shipped SQL passes; every prohibited mutation is caught
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: development_dossier_disposable
        run: |
          set -o pipefail
          bash test/development_official_records_pg/run.sh 2>&1 | grep -v -E 'NOTICE|DETAIL|drop cascades'

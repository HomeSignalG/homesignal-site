name: verify-maps

# Live end-to-end check of the APP MAP page (maps.html) — dedicated to the facility-slot
# reservation. Runs where network egress works (GitHub-hosted runner), the piece the build
# sandbox cannot do. Separate from verify-development (which drives homesignalmap.html).
# Hard check: the reserve floor min(4, #facilities) holds on the real 78617 default view.
# Soft check: DALFEN present (logged, never fails the run).

# RETIRED 2026-09-04 with the second map. This workflow's subject was maps.html, which is
# now a redirect stub to the one primary map, so its automatic triggers were removed: a
# scheduled or push-triggered run could only ever fail, and a permanently-red check teaches
# people to ignore red (the same reasoning unit-tests.yml records for its own trigger scoping).
# workflow_dispatch is KEPT so the job and its script stay available and this is reversible.
# The script itself is not deleted - it is the record of how that page was verified.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Bound added 2026-08-02: an unbounded job inherits GitHub's 6-HOUR default, which is how
    # verify-geocodes burned 11 consecutive 6 h cancellations on an account previously halted
    # at $0. Measured max successful run: 2.0 min -> bound 15.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright (chromium)
        run: npm init -y >/dev/null 2>&1 && npm i -D playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium
      - name: Verify app-map facility-slot floor
        run: node scripts/verify-maps.mjs
      - name: Verify canonical marker registry
        run: |
          python3 -m http.server 8765 &
          sleep 2
          SITE_BASE=http://localhost:8765 node scripts/verify-map-markers.mjs

name: source-monitor

# Nightly automated source monitor — Texas-style depth grows without manual re-checks.
#
# 07:00 UTC (before the 09:00 UTC dev_refresh pg_cron): re-probes every source
# docs/source-registry.md rejected (dead/stale/frozen/blocked), walks official first-party
# catalogs for facility-floor jurisdictions, and:
#   • AUTO-WIRES any candidate the generic connectors (ArcGIS/Socrata) already handle that
#     passes the fail-closed lexicon gate → commits the jurisdiction-registry.json entry +
#     report, then dispatches deploy-edge-functions so the 09:00 refresh ingests it the
#     same night. No human step.
#   • FLAGS (never guesses) new portal shapes into docs/source-monitor-report.md.
#
# Hosted HERE (not homesignal-ingest) because the registry + connectors live here and this
# repo's scheduled workflows run reliably. Reversible: each run that wires something is one
# commit ("source-monitor: auto-wire …"); revert it + redeploy to undo.
#
# PUSH AUTH: the "Protect Main" ruleset blocks direct pushes from the workflow
# GITHUB_TOKEN (github-actions[bot] cannot be a ruleset bypass actor), so the push
# rides the DEPLOY_KEY repo secret — an SSH deploy key covered by the ruleset's
# "Deploy keys" bypass. The guard step fails the run up front (dry-run included) if
# the secret is missing, because checkout would otherwise silently fall back to the
# (blocked) GITHUB_TOKEN and the failure would surface only at push time.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = probe + report to logs only; write/commit nothing'
        required: false
        default: 'false'
      include_wired:
        description: 'true = gate-validation: also rebuild entries for already-wired targets (forces dry-run)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

concurrency:
  group: source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Bound added 2026-08-02: an unbounded job inherits GitHub's 6-HOUR default, which is how
    # verify-geocodes burned 11 consecutive 6 h cancellations on an account previously halted
    # at $0. Measured max successful run: 11.6 min -> bound 45.
    timeout-minutes: 45
    steps:
      - name: Require DEPLOY_KEY (ruleset-bypass push credential)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::DEPLOY_KEY secret is not set. This workflow pushes to main, which the ruleset blocks for GITHUB_TOKEN — add the SSH deploy key as the DEPLOY_KEY Actions secret (Settings → Secrets and variables → Actions) and enable the Deploy keys bypass on the Protect Main ruleset."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Regenerates the ranked work list nightly instead of it being computed by hand.
      # Reads the committed anon key from config.js (public, RLS-gated) so it needs no secret,
      # and runs BEFORE the monitor so the scoreboard lands in the log even if the drift gate
      # later fails the run.
      # NOT continue-on-error. It was, and the step completed in <=1s reporting success — so a
      # failure was indistinguishable from a pass, in the one step whose whole job is to report
      # a number (workbook row 429). The script now asserts its own row count and throws rather
      # than emit a scoreboard of zeroes, and that throw has to be able to fail the job or the
      # assertion is decorative.
      - name: Live scoreboard (ranked work list)
        run: node scripts/live-scoreboard.mjs

      - name: Run source monitor
        id: monitor
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          if [ "${{ github.event.inputs.include_wired }}" = "true" ]; then ARGS="--dry-run --include-wired"; fi
          node scripts/source-monitor.mjs $ARGS | tee monitor-out.txt
          if grep -q '^REGISTRY_CHANGED=1$' monitor-out.txt; then
            echo "registry_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "registry_changed=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -q '^STATUS_DRIFT=1$' monitor-out.txt; then
            echo "status_drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "status_drift=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -q '^TYPE_DRIFT=1$' monitor-out.txt; then
            echo "type_drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "type_drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit report (+ any auto-wired registry entries)
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "source-monitor[bot]"
          git config user.email "source-monitor@users.noreply.github.com"
          git add docs/source-monitor-report.md supabase/functions/get-address-report/jurisdiction-registry.json
          if git diff --cached --quiet; then
            echo "No changes to commit (report unchanged?)"; exit 0
          fi
          if [ "${{ steps.monitor.outputs.registry_changed }}" = "true" ]; then
            git commit -m "source-monitor: auto-wire new source(s) + nightly report"
          else
            git commit -m "source-monitor: nightly report"
          fi
          # The monitor runs ~20 minutes; any merge to main during that window makes a
          # bare push fail "fetch first" and throws the whole nightly report away
          # (observed 2026-08-02, run 30765171160). Rebase onto the moved tip and retry —
          # the commit only ever touches the report + registry, so a rebase is safe.
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto the moved tip"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}" || { git rebase --abort; echo "::error::rebase conflict on the monitor report — resolve manually"; exit 1; }
            sleep $((attempt * 4))
          done
          echo "::error::could not push the nightly report after 4 attempts"; exit 1

      - name: Deploy engine so the 09:00 UTC refresh ingests the new source(s)
        if: github.event.inputs.dry_run != 'true' && steps.monitor.outputs.registry_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-edge-functions.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f function=get-address-report
          echo "deploy-edge-functions dispatched; the nightly dev_refresh (09:00 UTC) + app-content"
          echo "refresh (09:20 UTC) will materialize the new records onto pages tonight."

      # LAST step on purpose. An unmapped status DROPS records, so the run must go red — but
      # every existing side effect (report commit, registry auto-wire push, engine deploy
      # dispatch) has to complete first, or the evidence dies with the failed run and a
      # legitimately auto-wired source silently never deploys. `| tee` masks node's own exit
      # code, hence the grep-able STATUS_DRIFT marker (same idiom as REGISTRY_CHANGED).
      - name: Fail on status-domain drift (unmapped statuses are dropping records)
        if: always() && steps.monitor.outputs.status_drift == 'true'
        run: |
          echo "::error::Unmapped status value(s) found in live data for one or more registry entries — those records are being DROPPED by the connectors. See the 'Status-domain drift' table in docs/source-monitor-report.md (also in this run's job summary) for the exact registry_id, status field, values and record counts, then add each value VERBATIM to that entry's status_to_bucket in jurisdiction-registry.json."
          exit 1

      # Its own step, not folded into the status one: the two failures need DIFFERENT fixes
      # (status_to_bucket vs include_types + type_map), and one shared error message would send
      # whoever reads it to the wrong file. Same `always()` + last-position discipline so every
      # side effect above still completes before the run goes red.
      - name: Fail on type-domain drift (unlisted include_types values are never fetched)
        if: always() && steps.monitor.outputs.type_drift == 'true'
        run: |
          echo "::error::Live type value(s) found that are in NEITHER include_types NOR observed_types_unreviewed for one or more registry entries. Because include_types is pushed down into the query, those records are NEVER FETCHED — no record, no quarantine, no unclassified pin, only a count that fails to grow (Cleveland's 'Install Permits' was dropped this way for five months). See the 'Type-domain drift' Tier 1 table in docs/source-monitor-report.md (also in this run's job summary), then add each value VERBATIM to that entry's include_types WITH a type_map line — or, if it is deliberate noise, to observed_types_unreviewed with that decision recorded."
          exit 1

name: source-monitor

# Nightly automated source monitor — Texas-style depth grows without manual re-checks.
#
# 07:00 UTC (before the 09:00 UTC dev_refresh pg_cron): re-probes every source
# docs/source-registry.md rejected (dead/stale/frozen/blocked), walks official first-party
# catalogs for facility-floor jurisdictions, and:
#   • PROPOSES any candidate the generic connectors (ArcGIS/Socrata) already handle that
#     passes the fail-closed lexicon gate: the jurisdiction-registry.json entry it built goes
#     into the job summary and the run's artifact, and the run FAILS with plain instructions
#     to wire it through a PR (then dispatch deploy-edge-functions). Nothing is wired here.
#   • FLAGS (never guesses) new portal shapes into the run report.
#   • FAILS on status-domain and type-domain drift (records dropped / never fetched).
#
# NO PUSH, NO DEPLOY KEY, NO DISPATCH (2026-10-22, founder "remove deploy key"). Until then this
# job committed the report (and any auto-wired registry entry) straight to main with an SSH
# deploy key that the "Protect Main" ruleset let bypass, then dispatched deploy-edge-functions.
# Now each run's report is in its job summary and in the `source-monitor-<run id>` artifact
# (kept 30 days); docs/source-monitor-report.md is frozen at the last committed run. The job
# needs only `contents: read`. test/no-deploy-key-push.test.mjs keeps every workflow that way.
#
# Hosted HERE (not homesignal-ingest) because the registry + connectors live here and this
# repo's scheduled workflows run reliably.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = label the run report as a dry run (since 2026-10-22 neither mode writes or commits anything)'
        required: false
        default: 'false'
      include_wired:
        description: 'true = gate-validation: also rebuild entries for already-wired targets (forces dry-run; rebuilt entries are never proposed)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: source-monitor
  cancel-in-progress: false

jobs:
  monitor:
    environment: { name: production, deployment: false }
    runs-on: ubuntu-latest
    # Bound added 2026-08-02: an unbounded job inherits GitHub's 6-HOUR default, which is how
    # verify-geocodes burned 11 consecutive 6 h cancellations on an account previously halted
    # at $0. Measured max successful run: 11.6 min -> bound 45.
    timeout-minutes: 45
    steps:
      - name: 'Production boundary: refuse a dispatch the operator did not start'
        id: boundary
        # FIRST step, before any step that holds a secret. The production environment admits only
        # ref main, but a workflow_dispatch's INPUTS are chosen by whoever dispatched it; another
        # run's GITHUB_TOKEN (github-actions[bot]) or an installed app (<app>[bot]) would let branch
        # code choose them. github.actor is the original dispatcher and github.triggering_actor the
        # re-runner (a re-run replays the original inputs), so both must be the operator.
        # Canonical text: test/lib/production-boundary.mjs (BOUNDARY_STEP); the tests compare this
        # step to it byte for byte, comment lines excluded.
        if: github.event_name == 'workflow_dispatch' && (github.actor != 'HomeSignalG' || github.triggering_actor != 'HomeSignalG')
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::error::Production credentials are not issued to this dispatch (actor=$ACTOR, triggering_actor=$TRIGGERING_ACTOR). Only HomeSignalG may start or re-run a production dispatch, from main."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run source monitor
        id: monitor
        env:
          SOURCE_MONITOR_OUT_DIR: ${{ runner.temp }}/source-monitor
          # The dispatch inputs reach the shell through env, never expanded into the script.
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          INCLUDE_WIRED_INPUT: ${{ github.event.inputs.include_wired }}
        run: |
          ARGS=""
          if [ "$DRY_RUN_INPUT" = "true" ]; then ARGS="--dry-run"; fi
          if [ "$INCLUDE_WIRED_INPUT" = "true" ]; then ARGS="--dry-run --include-wired"; fi
          mkdir -p "$SOURCE_MONITOR_OUT_DIR"
          # tee hides node's exit code (no pipefail), so keep it: a crash must not pass green. The
          # outputs below are still written, and every later step runs under always().
          node scripts/source-monitor.mjs $ARGS | tee monitor-out.txt
          rc=${PIPESTATUS[0]}
          cp monitor-out.txt "$SOURCE_MONITOR_OUT_DIR/monitor-out.txt"
          if grep -q '^REGISTRY_PROPOSED=1$' monitor-out.txt; then
            echo "registry_proposed=true" >> "$GITHUB_OUTPUT"
          else
            echo "registry_proposed=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -q '^STATUS_DRIFT=1$' monitor-out.txt; then
            echo "status_drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "status_drift=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -q '^TYPE_DRIFT=1$' monitor-out.txt; then
            echo "type_drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "type_drift=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::scripts/source-monitor.mjs exited $rc: the monitor did not finish, so this run's report is incomplete."
            exit "$rc"
          fi

      # The run's evidence, kept 30 days: run-report.md (the same section the job summary shows),
      # proposed-registry-entries.json (`[]` when nothing passed the gate) and the full log. This
      # replaces the nightly commit to docs/source-monitor-report.md. `always()`: a run that goes
      # red is exactly the run whose evidence matters.
      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-monitor-${{ github.run_id }}
          path: ${{ runner.temp }}/source-monitor/
          retention-days: 30
          if-no-files-found: warn

      # A candidate passed the fail-closed auto-wire gate. Until 2026-10-22 this job appended it to
      # the registry and pushed it to main; that credential is gone, so the finding is reported and
      # the run goes red until someone wires it through a PR. Never dropped silently: an entry that
      # is not wired is proposed again on every nightly run. Only entries NOT already in the
      # registry raise REGISTRY_PROPOSED, so an include_wired validation run cannot trip it on
      # entries that are already wired.
      - name: Fail on a proposed registry entry (passed the auto-wire gate, needs a PR to wire)
        if: always() && steps.monitor.outputs.registry_proposed == 'true'
        run: |
          echo "::error::A source passed the auto-wire gate, but nothing is wired automatically any more. The registry entry it built is in this run's job summary (section 'Proposed registry entries') and in its source-monitor artifact as proposed-registry-entries.json. To wire it, add that entry to supabase/functions/get-address-report/jurisdiction-registry.json on a branch, open a PR and merge it, then run deploy-edge-functions with function=get-address-report."
          exit 1

      # An unmapped status DROPS records, so the run must go red — but the artifact upload above
      # has to complete first, or the evidence dies with the failed run. `| tee` masks node's own
      # exit code, hence the grep-able STATUS_DRIFT marker (same idiom as REGISTRY_PROPOSED).
      - name: Fail on status-domain drift (unmapped statuses are dropping records)
        if: always() && steps.monitor.outputs.status_drift == 'true'
        run: |
          echo "::error::Unmapped status value(s) found in live data for one or more registry entries — those records are being DROPPED by the connectors. See the 'Status-domain drift' table in this run's job summary (also in its source-monitor artifact) for the exact registry_id, status field, values and record counts, then add each value VERBATIM to that entry's status_to_bucket in jurisdiction-registry.json."
          exit 1

      # Its own step, not folded into the status one: the two failures need DIFFERENT fixes
      # (status_to_bucket vs include_types + type_map), and one shared error message would send
      # whoever reads it to the wrong file. Same `always()` discipline, so the artifact upload
      # above still completes before the run goes red.
      - name: Fail on type-domain drift (unlisted include_types values are never fetched)
        if: always() && steps.monitor.outputs.type_drift == 'true'
        run: |
          echo "::error::Live type value(s) found that are in NEITHER include_types NOR observed_types_unreviewed for one or more registry entries. Because include_types is pushed down into the query, those records are NEVER FETCHED — no record, no quarantine, no unclassified pin, only a count that fails to grow (Cleveland's 'Install Permits' was dropped this way for five months). See the 'Type-domain drift' Tier 1 table in this run's job summary (also in its source-monitor artifact), then add each value VERBATIM to that entry's include_types WITH a type_map line — or, if it is deliberate noise, to observed_types_unreviewed with that decision recorded."
          exit 1
      # MOVED AFTER THE MONITOR, 2026-08-19. It used to run first, and for **11+ consecutive
      # runs** (every scheduled run from at least 2026-08-09 through 2026-08-19, plus a dispatch)
      # it threw on a `dev_zip_source_ids` statement timeout ~80 s in and killed the job — so
      # `source-monitor.mjs` never executed and NEITHER drift gate ran for eleven days. The
      # status-domain gate was correct in code and unreachable in practice the entire time.
      #
      # A REPORTING step was gating DETECTION steps, which is backwards. Nothing downstream
      # breaks if the ranked work list is late; a silently-dropped record class is exactly what
      # the drift gates exist to catch. Detection first, reporting second.
      #
      # STILL NOT continue-on-error — the original reason stands verbatim: it was, and the step
      # completed in <=1s reporting success, so a failure was indistinguishable from a pass in
      # the one step whose whole job is to report a number (workbook row 429). The script asserts
      # its own row count and throws rather than emit a scoreboard of zeroes, and that throw has
      # to be able to fail the job or the assertion is decorative. It still fails the run — it
      # just no longer takes the drift gates down with it.
      #
      # LAST, and `always()`, for the SAME reason the drift-fail steps are: every step above
      # (today the artifact upload; until 2026-10-22 the report commit, registry auto-wire push
      # and engine deploy dispatch) must complete first. Merely moving this below the monitor was
      # not enough — a scoreboard throw would then have SKIPPED the evidence step, and the
      # monitor's evidence would die with it, which is the same class of mistake in a new place.
      #
      # Public reads use the committed anon key from config.js. The ONE internal read (dev_zip_source_ids) needs the service
      # role key, scoped to this step only: anon lost SELECT on app_zip_source_ids on 2026-09-26
      # (phase1_revoke_anon_internal_read_surface) and this step has failed with HTTP 401 / 42501 every night since.
      # Since 2026-10-25 the key is PROD_SUPABASE_SERVICE_ROLE_KEY from the environment `production`, and the if: also
      # needs the boundary step not to have refused: always() alone would still hand the key to a refused dispatch.
      - name: Live scoreboard (ranked work list)
        if: always() && steps.boundary.outcome != 'failure'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/live-scoreboard.mjs

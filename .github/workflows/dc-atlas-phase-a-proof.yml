name: dc-atlas-phase-a-proof

# The HARDENED Phase A zero-effect proof (supersedes dc-atlas-phase-a-counterfactual). Production is
# only READ. See scripts/dc-atlas-phase-a-proof.sh:
#   * the common pre-identity state at 2026-09-25T15:25:00.080497Z is reconstructed from production's
#     own history and VALIDATED (snapshot Map 1, the live 14:52:45Z Map 1 fingerprint, the snapshot
#     identity fingerprint, and replay-vs-production);
#   * OLD (pre-#1335) and NEW (Phase A, Atlas unadmitted) each run their own resolvers from it;
#   * every comparison and every positive control goes through ONE comparator
#     (scripts/dc_phase_a_proof.py), itself mutation-tested offline first.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'scripts/dc-atlas-phase-a-proof.sh'
      - 'scripts/dc_phase_a_proof.py'
      - 'test/dc_phase_a_proof/**'
      - '.github/workflows/dc-atlas-phase-a-proof.yml'

permissions:
  contents: read

concurrency:
  group: dc-atlas-phase-a-proof
  cancel-in-progress: false

jobs:
  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Comparator tests (every detection class, synthetic data with a known answer)
        run: python3 test/dc_phase_a_proof/test_compare.py
      - name: Comparator mutation test (every mutant must be killed)
        run: python3 test/dc_phase_a_proof/mutate.py

  proof:
    needs: comparator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgis:
        image: supabase/postgres:17.6.1.127
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres" --health-interval 5s --health-timeout 5s --health-retries 40
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: supabase_admin
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Hardened proof on production's own evidence (production is only read)
        env:
          PROD_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGOPTIONS: '-c client_min_messages=warning'
        run: bash scripts/dc-atlas-phase-a-proof.sh

# RESEARCH PROBE — read-only. Round 3: settle ONE thing.
# Round 2 reported that FRS 110070182593 (TXI - Garfield Sand & Gravel) is absent from
# TX_FACILITY_FILE.CSV. That was an ANCHORED grep, so before reporting "absent" it has to be
# ruled out that the anchor, not the data, produced the zero. Envirofacts returns this
# registry id with state TEXAS, so the two sources disagree and one of them is being misread.
#
# Writes nothing, commits nothing. Delete when settled.
name: frs-archive-probe

on:
  push:
    branches: [claude/maps-property-card-audit-8jbt0t]
    paths: ['.github/workflows/frs-archive-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  garfield:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch and extract
        run: |
          set -euo pipefail
          curl -sS -L --fail --retry 3 -o tx.zip \
            https://ordsext.epa.gov/FLA/www3/state_files/state_combined_tx.zip
          unzip -o -q tx.zip TX_FACILITY_FILE.CSV TX_ORGANIZATION_FILE.CSV

      - name: Is the anchor the problem, or is the facility really absent?
        run: |
          set -euo pipefail
          echo '--- header + first data row of TX_FACILITY_FILE ---'
          head -2 TX_FACILITY_FILE.CSV | cut -c1-200
          echo
          CTRL=$(sed -n '2p' TX_FACILITY_FILE.CSV | cut -d'"' -f2)
          echo "POSITIVE CONTROL registry id taken from row 2: $CTRL"
          echo -n '  anchored   : '; grep -c "^\"$CTRL\"" TX_FACILITY_FILE.CSV || true
          echo -n '  unanchored : '; grep -c "$CTRL" TX_FACILITY_FILE.CSV || true
          echo
          for ID in 110070182593 110070376640 110005052085 110071708120; do
            echo "=== $ID ==="
            echo -n '  FACILITY  anchored   : '; grep -c "^\"$ID\"" TX_FACILITY_FILE.CSV || true
            echo -n '  FACILITY  unanchored : '; grep -c "$ID" TX_FACILITY_FILE.CSV || true
            echo -n '  ORG       unanchored : '; grep -c "$ID" TX_ORGANIZATION_FILE.CSV || true
          done

      - name: What DOES the extract say about Norwood Ln / Garfield?
        run: |
          set -euo pipefail
          echo '--- facility rows mentioning GARFIELD SAND ---'
          grep -i 'GARFIELD SAND' TX_FACILITY_FILE.CSV | cut -c1-260 | head -10 || echo '(none)'
          echo
          echo '--- facility rows on NORWOOD LN in DEL VALLE ---'
          grep -i 'NORWOOD' TX_FACILITY_FILE.CSV | grep -i 'DEL VALLE' | cut -c1-260 | head -10 || echo '(none)'

# RESEARCH PROBE — read-only. Round 4, final: print the actual organization rows for the
# Del Valle facilities. Round 3 corrected a false zero of my own making (REGISTRY_ID is the
# SECOND column of TX_FACILITY_FILE — the first is FRS_FACILITY_DETAIL_REPORT_URL — so the
# anchored grep in round 2 could never match) and surfaced two facilities worth reading in
# full: a second Martin-Marietta-named FRS record at the same Garfield address, and two
# organization rows for the BFI facility whose operator the identity layer left unresolved.
#
# Writes nothing, commits nothing. Delete after this.
name: frs-archive-probe

on:
  push:
    branches: [claude/maps-property-card-audit-8jbt0t]
    paths: ['.github/workflows/frs-archive-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delvalle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch and extract
        run: |
          set -euo pipefail
          curl -sS -L --fail --retry 3 -o tx.zip \
            https://ordsext.epa.gov/FLA/www3/state_files/state_combined_tx.zip
          unzip -o -q tx.zip TX_ORGANIZATION_FILE.CSV

      - name: Organization rows for every FRS facility at 3901 Norwood Ln, Del Valle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          csv.field_size_limit(10_000_000)
          TARGETS = {
            '110070182593': 'TXI - GARFIELD SAND & GRAVEL   (the record the pilot resolves)',
            '110070376640': 'TXI - GARFIELD SAND & GRAVEL PLANT',
            '110071427904': 'MM - GARFIELD S&G              (same address, MM-named)',
            '110034344494': 'CEMEX CONSTRUCTION MATERIALS LP (same address)',
            '110070171250': 'AGGREGATE HAULERS DEL VALLE     (same address)',
            '110005052085': 'BFI WASTE SYSTEMS OF TEXAS LP   (operator UNRESOLVED in the pilot)',
            '110071708120': 'GIGA TEXAS OFFSITE WASTEWATER INTERCEPTOR',
          }
          keep = {k: [] for k in TARGETS}
          with open('TX_ORGANIZATION_FILE.CSV', newline='', encoding='utf-8', errors='replace') as fh:
              r = csv.reader(fh); hdr = next(r)
              i = {h: n for n, h in enumerate(hdr)}
              for row in r:
                  rid = row[i['REGISTRY_ID']]
                  if rid in keep:
                      keep[rid].append(row)
          for rid, label in TARGETS.items():
              print(f'===== {rid}  {label}')
              if not keep[rid]:
                  print('   NO ORGANIZATION ROWS')
              for row in keep[rid]:
                  print('   {:<16} {:<22} {:<38} start={:<10} end={:<10} duns={:<10} ein={}'.format(
                      row[i['PGM_SYS_ACRNM']], row[i['AFFILIATION_TYPE']], row[i['ORG_NAME']][:38],
                      row[i['START_DATE']] or '-', row[i['END_DATE']] or '-',
                      row[i['DUNS_NUMBER']] or '-', row[i['EIN']] or '-'))
              print()
          PY

      - name: Reverse lookup by the two Southwest spellings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, collections
          csv.field_size_limit(10_000_000)
          want = {'MARTIN MARIETTA MATERIALS SOUTHWEST LLC', 'MARTIN MARIETTA MATERIALS SOUTHWEST LTD'}
          ids = collections.defaultdict(set); roles = collections.Counter()
          with open('TX_ORGANIZATION_FILE.CSV', newline='', encoding='utf-8', errors='replace') as fh:
              r = csv.reader(fh); hdr = next(r); i = {h: n for n, h in enumerate(hdr)}
              for row in r:
                  nm = row[i['ORG_NAME']].strip().upper()
                  if nm in want:
                      ids[nm].add(row[i['REGISTRY_ID']])
                      roles[(nm, row[i['AFFILIATION_TYPE']])] += 1
          for nm in sorted(want):
              print(f'{nm}: {len(ids[nm])} distinct FRS registry ids')
          both = ids['MARTIN MARIETTA MATERIALS SOUTHWEST LLC'] & ids['MARTIN MARIETTA MATERIALS SOUTHWEST LTD']
          print(f'facilities carrying BOTH spellings: {len(both)}')
          print()
          for (nm, role), n in sorted(roles.items()):
              print(f'  {n:>4}  {role:<20} {nm}')
          PY

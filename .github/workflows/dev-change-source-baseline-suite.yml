name: dev-change-source-baseline-suite

# TIME-BOUNDED SOURCE BASELINE (docs/dev-change-source-baseline.sql; applied to production 2026-10-14, City of Denton).
# Runs the SHIPPED file against a DISPOSABLE Postgres whose ledger is built from the repo's own SQL of record plus the real
# recovery splice (proved equal to the live observe_zip md5 inside the run): 22 checks, then every prohibited mutation must be
# killed by a check that ran and failed. A final `gate` job fails unless the suite job concluded `success`. Never addresses production.

on:
  pull_request:
    paths:
      - 'docs/dev-change-source-baseline.sql'
      - 'docs/dev-change-recovery.sql'
      - 'docs/dev-change-ledger.sql'
      - 'docs/dev-change-baseline.sql'
      - 'docs/dev-change-reportable.sql'
      - 'docs/dev-source-receipt.sql'
      - 'test/lib/**'
      - 'test/dev_collect_harness/**'
      - 'test/dev_change_source_baseline_pg/**'
      - 'test/dev_change_recovery_pg/fixture.sql'
      - '.github/workflows/dev-change-source-baseline-suite.yml'
  push:
    branches: [main]
    paths:
      - 'docs/dev-change-source-baseline.sql'
      - 'test/dev_change_source_baseline_pg/**'

jobs:
  source-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dev_change_source_baseline_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run if any Supabase credential is present
        run: |
          if [ -n "${SUPABASE_DB_URL:-}${SUPABASE_ACCESS_TOKEN:-}${SUPABASE_WRITE_KEY:-}" ]; then
            echo "ABORT: this suite must only ever address the disposable container."; exit 1
          fi
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Shipped file passes; every prohibited mutation is killed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dev_change_source_baseline_disposable
        run: |
          set -o pipefail
          bash test/dev_change_source_baseline_pg/run.sh 2>&1 | grep -v NOTICE | tee /tmp/dcsb.log
          grep -q '^CHECKS: 22 passed, 0 failed' /tmp/dcsb.log
          grep -q '^MUTATIONS: 4 of 4 killed' /tmp/dcsb.log
          if grep -qE '^(FAIL|SURVIVED)' /tmp/dcsb.log; then echo 'a check failed or a mutation survived'; exit 1; fi

  gate:
    if: always()
    needs: [source-baseline]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "source-baseline=${{ needs.source-baseline.result }}"
          [ "${{ needs.source-baseline.result }}" = success ]

name: verify-maps-uncap

# Phase 4 of the Maps uncap — live completeness + performance verification.
# Serves THIS CHECKOUT's maps.html locally (so the branch's page code is what
# runs) against LIVE Supabase data on a runner with egress, and asserts:
#   every materialized development record + facility is reachable from Maps
#   (totals == REST count=exact), the complete sidebar enumeration works down
#   to the deepest tail record, the GL rest layer carries the full remainder,
#   and payload/ready budgets hold on the densest cached ZIP (44127, 5,424).
# VERIFICATION ONLY — touches no product data.

# RETIRED 2026-09-04 with the second map. This workflow's subject was maps.html, which is
# now a redirect stub to the one primary map, so its automatic triggers were removed: a
# scheduled or push-triggered run could only ever fail, and a permanently-red check teaches
# people to ignore red (the same reasoning unit-tests.yml records for its own trigger scoping).
# workflow_dispatch is KEPT so the job and its script stay available and this is reversible.
# The script itself is not deleted - it is the record of how that page was verified.
on:
  workflow_dispatch:
    inputs:
      zips:
        description: 'Comma-separated ZIPs (typical,dense,densest)'
        required: false
        default: '85234,55407,44127'

jobs:
  verify:
    runs-on: ubuntu-latest
    # Bound added 2026-08-02: an unbounded job inherits GitHub's 6-HOUR default, which is how
    # verify-geocodes burned 11 consecutive 6 h cancellations on an account previously halted
    # at $0. Measured max successful run: 1.2 min -> bound 15.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright (chromium)
        run: npm init -y >/dev/null 2>&1 && npm i -D playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium
      - name: Serve this checkout + verify completeness and performance
        run: |
          mkdir -p shots
          python3 -m http.server 8765 &
          sleep 2
          SITE_BASE=http://localhost:8765 ZIPS='${{ github.event.inputs.zips }}' node scripts/verify-maps-uncap.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uncap-shots
          path: shots/
          if-no-files-found: ignore

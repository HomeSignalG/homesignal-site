name: dc-epoch-dryrun

# PRODUCTION DRY RUN of automatic Epoch canonical geography. WRITES NOTHING AND LOCKS NOTHING LIVE:
#   0. every object the apply creates, and every canonical table it alters or its resolvers write,
#      is built in a scratch schema (dcdry) that exists only inside the dry run's own transaction;
#      live objects are only READ. (2026-09-24: the first dry run applied DDL to the LIVE schema in
#      a rolled-back transaction and held ACCESS EXCLUSIVE on public.dc_entity_geography for ~7
#      minutes; one resident map1_dc_zip_members call returned 500. The generator now REFUSES any
#      statement that targets public: test/dc_epoch_geography_pg/build_apply.py.)
#   1. the queue is computed inside a transaction that ROLLS BACK (the new DDL exists only there);
#   2. the production geocoding ladder runs with DCG_DRY_RUN=1 -- the geocode cache is read, never
#      written;
#   3. before-snapshot, DDL, load, the scheduled resolvers and the report all run inside ONE
#      transaction that ROLLS BACK.
# The apply body opens with the drift guard, so this refuses if live definitions moved from main.
# Evidence comes back through this job's log (artifact storage is unreachable from the sandbox).

on:
  workflow_dispatch: {}
  # a pull request that changes what the dry run measures re-runs it (it writes nothing)
  pull_request:
    paths:
      - 'docs/dc-epoch-geography-apply.sql'
      - 'docs/dc-epoch-dryrun-report.sql'
      - 'docs/dc-geocode-observations-load.sql'
      - 'docs/dc-geocode-observations-queue.sql'
      - 'scripts/dc-geocode-observations.ts'
      - 'test/dc_epoch_geography_pg/build_apply.py'
      - '.github/workflows/dc-epoch-dryrun.yml'

permissions:
  contents: read

concurrency:
  group: dc-epoch-dryrun
  cancel-in-progress: false

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build the scratch-schema dry run (refuses any statement that targets a live object)
        run: |
          set -euo pipefail
          python3 test/dc_epoch_geography_pg/build_apply.py --self-test
          python3 test/dc_epoch_geography_pg/build_apply.py --dryrun-body dcdry > /tmp/dry-body.sql
          python3 test/dc_epoch_geography_pg/build_apply.py --dryrun-rewrite dcdry docs/dc-geocode-observations-load.sql > /tmp/dry-load.sql
          python3 test/dc_epoch_geography_pg/build_apply.py --dryrun-rewrite dcdry docs/dc-epoch-dryrun-report.sql > /tmp/dry-report.sql
          python3 test/dc_epoch_geography_pg/build_apply.py --dryrun-rewrite dcdry docs/dc-geocode-observations-queue.sql > /tmp/dry-queue.sql

      - name: Queue (DDL applied inside a transaction that rolls back)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -P pager=off <<'SQL'
          begin;
          set local lock_timeout = '5s';
          \i /tmp/dry-body.sql
          \copy (select json_build_object('geocoder_query', geocoder_query, 'ladder_version', ladder_version)::text from dcdry.dc_geocode_queue order by geocoder_query collate "C") to '/tmp/dcg-in.jsonl'
          rollback;
          SQL
          echo "queued addresses: $(grep -c . /tmp/dcg-in.jsonl || true)"

      - name: Derive through the production ladder (dry-run store; nothing written)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DCG_INPUT: /tmp/dcg-in.jsonl
          DCG_OUTPUT: /tmp/dcg-out.jsonl
          RUN_REF: dryrun:${{ github.run_id }}
          DCG_DRY_RUN: '1'
        run: deno run --allow-net --allow-env --allow-read --allow-write=/tmp scripts/dc-geocode-observations.ts

      - name: Resolve and report (ONE transaction, always rolled back)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -tA -F'|' -P pager=off <<'SQL' | tee /tmp/report.txt
          begin;
          set local statement_timeout = 0;
          set local lock_timeout = '5s';
          create temp table _before as
            select r.zip, m.* from public.canonical_zip_registry r cross join lateral public.map1_dc_zip_members(r.zip) m;
          \i /tmp/dry-body.sql
          create temp table _dcg_in(j jsonb);
          \copy _dcg_in(j) from '/tmp/dcg-out.jsonl' with (format csv, quote e'\x01', delimiter e'\x02')
          \i /tmp/dry-load.sql
          select 'RESOLVE_CANONICAL', metric, value from dcdry.dc_resolve_canonical(true, false);
          select 'RESOLVE_GEOGRAPHY', metric, value from dcdry.dc_resolve_geography(true);
          \i /tmp/dry-report.sql
          rollback;
          SQL

      - name: Prove nothing persisted
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -tA -v ON_ERROR_STOP=1 -c "select 'scratch schema exists after rollback: ' || (to_regnamespace('dcdry') is not null)::text, 'public.dc_address_geocode exists: ' || (to_regclass('public.dc_address_geocode') is not null)::text, 'live map1 reader md5: ' || (select md5(prosrc) from pg_proc where proname = 'map1_dc_zip_members' and pronamespace = 'public'::regnamespace)"

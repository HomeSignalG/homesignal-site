name: dc-geocode-probe

# ZERO-WRITE PROBE: every current Epoch data-centre address (plus an Atlas calibration set)
# through HomeSignal's PRODUCTION geocoding ladder, then analysed against real ZCTA polygons.
#
# Why a runner: the sandbox cannot reach the Census geocoder or the database (proxy 403); a
# GitHub-hosted runner can. Same established pattern as n5-geocode-probe / map1-live-proof.
#
# WRITES NOTHING, by construction:
#   * inputs are read in a READ ONLY transaction;
#   * scripts/dc-geocode-probe.ts hands resolveGeocode a store whose put() is a no-op;
#   * the analysis loads the probe output into a SESSION-TEMPORARY table, then switches the
#     transaction to READ ONLY before running a single analysis query, and ROLLS BACK.
# Evidence comes back through this job's log (artifact storage is unreachable from the sandbox).

# Manual dispatch only (2026-10-22). It ran on pull requests that changed it, and its job holds
# SUPABASE_DB_URL and SUPABASE_SERVICE_ROLE_KEY with no event guard, so every such PR run was handed
# both. Dispatch it from main after the change merges. (test/workflow-secret-exposure.test.mjs)
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dc-geocode-probe
  cancel-in-progress: false

jobs:
  probe:
    environment: { name: production, deployment: false }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Production boundary: refuse a dispatch the operator did not start'
        id: boundary
        # FIRST step, before any step that holds a secret. The production environment admits only
        # ref main, but a workflow_dispatch's INPUTS are chosen by whoever dispatched it; another
        # run's GITHUB_TOKEN (github-actions[bot]) or an installed app (<app>[bot]) would let branch
        # code choose them. github.actor is the original dispatcher and github.triggering_actor the
        # re-runner (a re-run replays the original inputs), so both must be the operator.
        # Canonical text: test/lib/production-boundary.mjs (BOUNDARY_STEP); the tests compare this
        # step to it byte for byte, comment lines excluded.
        if: github.event_name == 'workflow_dispatch' && (github.actor != 'HomeSignalG' || github.triggering_actor != 'HomeSignalG')
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::error::Production credentials are not issued to this dispatch (actor=$ACTOR, triggering_actor=$TRIGGERING_ACTOR). Only HomeSignalG may start or re-run a production dispatch, from main."
          exit 1
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql --version

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5, what @v2 resolved to on 2026-10-25
        with:
          deno-version: v2.x

      - name: Read inputs (READ ONLY transaction)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          PGOPTIONS='-c default_transaction_read_only=on' \
            psql "$SUPABASE_DB_URL" -X -q -tA -v ON_ERROR_STOP=1 -P pager=off \
                 -f docs/dc-geocode-probe-inputs.sql > /tmp/probe-in.jsonl
          echo "inputs by kind:"
          grep -o '"kind" : "[a-z]*"' /tmp/probe-in.jsonl | sort | uniq -c

      - name: Geocode through the production ladder (no writes)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          PROBE_INPUT: /tmp/probe-in.jsonl
          PROBE_OUTPUT: /tmp/probe-out.jsonl
        run: deno run --allow-net --allow-env --allow-read --allow-write=/tmp scripts/dc-geocode-probe.ts

      - name: Analyse against ZCTA polygons (temp table, then READ ONLY, then ROLLBACK)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off -P footer=off <<'SQL'
          begin;
          create temp table probe(j jsonb) on commit drop;
          \copy probe(j) from '/tmp/probe-out.jsonl' with (format csv, quote e'\x01', delimiter e'\x02')
          set transaction read only;
          \i docs/dc-geocode-probe-analysis.sql
          rollback;
          SQL

      - name: Raw probe output (machine-readable receipt)
        run: |
          echo "----- BEGIN PROBE JSONL -----"
          cat /tmp/probe-out.jsonl
          echo "----- END PROBE JSONL -----"

name: dc-osm-map1-apply

# C3c: the Map 1 change the OpenStreetMap layer check makes. Admits ('openstreetmap', 'telecom_data_center')
# in dc_derived_address_admitted and ships the map1_dc_zip_members body that withholds an OSM pin its own
# address contradicts and flags one it corroborates (docs/dc-osm-map1-apply.sql). No pin moves; OSM stays a
# separate layer.
#
# THE AUTOMATED GATE decides (founder, 2026-09-26: "no manual human review", "automated checks"):
#   offline  (every PR + dispatch) the gate and the apply script proven on a disposable stand-in:
#            gate passes on the real artifact and REFUSES a consistently wrong one; drift, bounded lock
#            wait, apply, repeat refusal, rollback byte for byte, re-apply (test/dc_osm_layer_pg/map1_offline.sh);
#   gate     (dispatch from main) scripts/dc-osm-map1-gate.sh on TODAY's production data, production only
#            read, the change applied to a replica: after == prediction exactly, no pin moved, no row
#            added, every change an admitted OSM check outcome, canonical rows byte-identical;
#   apply    needs BOTH, in the SAME run, and the typed confirmation APPLY-OSM-MAP1-C3C;
#   rollback needs offline and ROLLBACK-OSM-MAP1-C3C.
# A dispatch with any other confirm string runs offline + gate only: the rehearsal on production data.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'APPLY-OSM-MAP1-C3C gates then applies; ROLLBACK-OSM-MAP1-C3C withdraws it; anything else runs the offline proof + the gate (rehearsal) only'
        required: false
        default: ''
  pull_request:
    paths:
      - 'scripts/dc-osm-map1-apply.sh'
      - 'scripts/dc-osm-map1-gate.sh'
      - 'docs/dc-osm-map1-apply.sql'
      - 'docs/dc-osm-map1-rollback.sql'
      - 'docs/dc-osm-map1-gate.sql'
      - 'docs/dc-step3d-derived-location.sql'
      - 'docs/dc-step3b-canonical-geography.sql'
      - 'docs/map1-dc-publication.sql'
      - 'test/dc_osm_layer_pg/**'
      - '.github/workflows/dc-osm-map1-apply.yml'

permissions:
  contents: read

concurrency:
  group: dc-osm-map1-apply
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgis:
        image: supabase/postgres:17.6.1.127
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres" --health-interval 5s --health-timeout 5s --health-retries 40
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: supabase_admin
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: The artifact is what its generator emits from the DDL of record
        run: python3 test/dc_osm_layer_pg/build_map1.py --check
      - name: Offline proof of the gate and the apply script
        env:
          PGOPTIONS: '-c client_min_messages=warning'
        run: bash test/dc_osm_layer_pg/map1_offline.sh

  gate:
    needs: offline
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm != 'ROLLBACK-OSM-MAP1-C3C'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      # the replica the change is rehearsed on (production's own database build)
      postgis:
        image: supabase/postgres:17.6.1.127
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres" --health-interval 5s --health-timeout 5s --health-retries 40
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: supabase_admin
      PGPASSWORD: postgres
    steps:
      - name: Refuse any ref other than main
        run: |
          set -euo pipefail
          [ "${GITHUB_REF}" = "refs/heads/main" ] || { echo "REFUSED: ${GITHUB_REF} is not main"; exit 1; }
      - uses: actions/checkout@v4
      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: THE GATE on today's production data (production only read; the change applied to a replica)
        env:
          PROD_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGOPTIONS: '-c client_min_messages=warning'
        run: bash scripts/dc-osm-map1-gate.sh

  apply:
    needs: [offline, gate]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'APPLY-OSM-MAP1-C3C'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # the definition-parity replica (production's own database build)
      postgis:
        image: supabase/postgres:17.6.1.127
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres" --health-interval 5s --health-timeout 5s --health-retries 40
    steps:
      - uses: actions/checkout@v4
      - name: Refuse any ref other than main
        run: |
          set -euo pipefail
          [ "${GITHUB_REF}" = "refs/heads/main" ] || { echo "REFUSED: ${GITHUB_REF} is not main"; exit 1; }
      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: APPLY the C3c Map 1 change in production
        env:
          PROD_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/dc-osm-map1-apply.sh

  rollback:
    needs: offline
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'ROLLBACK-OSM-MAP1-C3C'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # the definition-parity replica (production's own database build)
      postgis:
        image: supabase/postgres:17.6.1.127
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres" --health-interval 5s --health-timeout 5s --health-retries 40
    steps:
      - uses: actions/checkout@v4
      - name: Refuse any ref other than main
        run: |
          set -euo pipefail
          [ "${GITHUB_REF}" = "refs/heads/main" ] || { echo "REFUSED: ${GITHUB_REF} is not main"; exit 1; }
      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: ROLL BACK the C3c Map 1 change in production
        env:
          DCO_MODE: rollback
          PROD_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/dc-osm-map1-apply.sh

name: db-sql

# Run a COMMITTED .sql file against the project via the Supabase Management API
# (api.supabase.com /database/query) from a GitHub runner. The runner-based cousin of
# the recon-fetch pattern: when the sandbox's direct DB path (MCP pooler) is wedged but
# the instance itself is healthy, SQL still needs an execution channel. Uses the same
# SUPABASE_ACCESS_TOKEN the deploy-edge-functions workflow already holds; the SQL comes
# from a committed file so every statement is code-reviewed and auditable. Results print
# into the job log (the receipt channel — the sandbox cannot reach the artifact store).
#
# Manual dispatch remains the primary operator path. A push trigger exists so merges
# that land apply-on-merge SQL can execute without workflow_dispatch (cloud agents
# lack actions:write for manual dispatch -- STALE, corrected below). Two path families:
#
# CORRECTED 2026-09-21: a cloud session CAN dispatch this workflow. Measured -- eight
# run_workflow calls returned 204 Queued, on main and on a feature branch (site runs
# 35629215077, 35629340978, 35629637485, 35629719775, 35629790501, 35630013915,
# 35630168446, 35630236053).
#
# ⛔ RETIRED 2026-09-24 - the feature-branch READ loop (write docs/adhoc/query.sql on a branch,
# dispatch with ref=<branch>). It gave branch code the Management API token: arbitrary SQL,
# writes and DDL included. This job now takes its credential from the main-restricted
# `production` Environment, so a dispatch from any other ref receives nothing, and its first
# step refuses a dispatch chained from another workflow. It runs SQL committed to main only.
# A main-controlled diagnostic path is REQUIRED and does not exist yet; until it does, ad-hoc
# reads use the Supabase MCP tool. See CLAUDE.md "PRIVILEGED PRODUCTION DATABASE CREDENTIALS".
#   docs/candidates/**/*.sql  — gov-feed candidate INSERTs
#   docs/*-capture.sql        — parked capture-contract DDL (waitlist, ZIP requests)

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'Repo path to the .sql file to run (e.g. docs/communities-zipcodes-gin-index.sql)'
        required: true
  push:
    branches: [main]
    paths:
      - 'docs/candidates/**/*.sql'
      - 'docs/*-capture.sql'

permissions:
  contents: read

jobs:
  run-sql:
    # Privileged production credentials are issued ONLY through the main-restricted
    # GitHub Environment `production` (tested by test/production-credential-boundary.test.mjs).
    environment: production
    runs-on: ubuntu-latest
    # Bound added 2026-08-02: an unbounded job inherits GitHub's 6-HOUR default, which is how
    # verify-geocodes burned 11 consecutive 6 h cancellations on an account previously halted
    # at $0. Measured max successful run: 0.2 min -> bound 15.
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: qwnnmljucajnexpxdgxr
    steps:
      - name: 'Production boundary: refuse a dispatch chained from another workflow'
        # First step, before anything else runs. A workflow_dispatch whose triggering actor is
        # github-actions[bot] was started by ANOTHER workflow's GITHUB_TOKEN - i.e. by branch
        # code - and would otherwise enter the main-only production Environment with inputs that
        # branch chose. Enforced by main's copy of this file, which a branch cannot redefine.
        if: github.event_name == 'workflow_dispatch' && github.triggering_actor == 'github-actions[bot]'
        run: |
          echo "::error::Production credentials are not issued to a dispatch chained from another workflow (triggering actor github-actions[bot]). Dispatch it from main as an operator."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Execute SQL via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          run_file() {
            local FILE="$1"
            echo "Running: $FILE"
            python3 - "$FILE" <<'PY'
          import json, os, sys, urllib.request
          sql = open(sys.argv[1]).read()
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{os.environ['SUPABASE_PROJECT_REF']}/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  # WITHOUT THIS HEADER THE REQUEST NEVER REACHES SUPABASE, and this
                  # workflow has been failing on it since 2026-07-21. api.supabase.com
                  # sits behind Cloudflare, which rejects Python's default
                  # "Python-urllib/3.x" signature with HTTP 403 "error code: 1010"
                  # BEFORE authentication — so it presents exactly like a bad token
                  # and is not one. Measured 2026-08-12, same request and a
                  # deliberately invalid token: default UA -> 403/1010; explicit UA
                  # -> 401 "JWT could not be decoded", i.e. it got through.
                  # Do not remove it as an apparently pointless header.
                  "User-Agent": "HomeSignal-db-sql/1.0 (+https://homesignal.net)",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  body = r.read().decode()
                  print(f"HTTP {r.status}")
                  print("----- BEGIN RESULT -----")
                  print(body[:20000])
                  print("----- END RESULT -----")
          except urllib.error.HTTPError as e:
              print(f"HTTP {e.code}")
              print(e.read().decode()[:4000])
              sys.exit(1)
          PY
          }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_file "${{ github.event.inputs.sql_file }}"
          else
            mapfile -t CHANGED < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -E '^(docs/candidates/.+\.sql|docs/[^/]+-capture\.sql)$' || true)
            if [ "${#CHANGED[@]}" -eq 0 ]; then
              echo "No candidate SQL files changed"
              exit 1
            fi
            for FILE in "${CHANGED[@]}"; do
              run_file "$FILE"
            done
          fi

name: db-sql

# Run a COMMITTED .sql file against the project via the Supabase Management API
# (api.supabase.com /database/query) from a GitHub runner. The runner-based cousin of
# the recon-fetch pattern: when the sandbox's direct DB path (MCP pooler) is wedged but
# the instance itself is healthy, SQL still needs an execution channel. Uses the same
# SUPABASE_ACCESS_TOKEN the deploy-edge-functions workflow already holds; the SQL comes
# from a committed file so every statement is code-reviewed and auditable. Results print
# into the job log (the receipt channel — the sandbox cannot reach the artifact store).
#
# Manual dispatch remains the primary operator path. A push trigger on docs/candidates/
# exists so merges that land candidate INSERT SQL can execute without workflow_dispatch
# (cloud agents lack actions:write for manual dispatch).

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'Repo path to the .sql file to run (e.g. docs/communities-zipcodes-gin-index.sql)'
        required: true
  push:
    branches: [main]
    paths:
      - 'docs/candidates/**/*.sql'

permissions:
  contents: read

jobs:
  run-sql:
    runs-on: ubuntu-latest
    # Bound added 2026-08-02: an unbounded job inherits GitHub's 6-HOUR default, which is how
    # verify-geocodes burned 11 consecutive 6 h cancellations on an account previously halted
    # at $0. Measured max successful run: 0.2 min -> bound 15.
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: qwnnmljucajnexpxdgxr
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Execute SQL via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          run_file() {
            local FILE="$1"
            echo "Running: $FILE"
            python3 - "$FILE" <<'PY'
          import json, os, sys, urllib.request
          sql = open(sys.argv[1]).read()
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{os.environ['SUPABASE_PROJECT_REF']}/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  # WITHOUT THIS HEADER THE REQUEST NEVER REACHES SUPABASE, and this
                  # workflow has been failing on it since 2026-07-21. api.supabase.com
                  # sits behind Cloudflare, which rejects Python's default
                  # "Python-urllib/3.x" signature with HTTP 403 "error code: 1010"
                  # BEFORE authentication — so it presents exactly like a bad token
                  # and is not one. Measured 2026-08-12, same request and a
                  # deliberately invalid token: default UA -> 403/1010; explicit UA
                  # -> 401 "JWT could not be decoded", i.e. it got through.
                  # Do not remove it as an apparently pointless header.
                  "User-Agent": "HomeSignal-db-sql/1.0 (+https://homesignal.net)",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  body = r.read().decode()
                  print(f"HTTP {r.status}")
                  print("----- BEGIN RESULT -----")
                  print(body[:20000])
                  print("----- END RESULT -----")
          except urllib.error.HTTPError as e:
              print(f"HTTP {e.code}")
              print(e.read().decode()[:4000])
              sys.exit(1)
          PY
          }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_file "${{ github.event.inputs.sql_file }}"
          else
            mapfile -t CHANGED < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -E '^docs/candidates/.+\.sql$' || true)
            if [ "${#CHANGED[@]}" -eq 0 ]; then
              echo "No candidate SQL files changed"
              exit 1
            fi
            for FILE in "${CHANGED[@]}"; do
              run_file "$FILE"
            done
          fi

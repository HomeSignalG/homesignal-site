name: verify-development

# Automated, live end-to-end check that every cached ZIP development page resolves on the
# real site and — the invariant that matters — that every rendered marker carries an
# official record_url (docs/development-tracker-source-of-truth.md §9). Runs where network
# egress works (GitHub-hosted runner), the piece the build sandbox cannot do. Zero-touch:
# it reads the live `development_reports` table, so newly-cached ZIPs need no code change.

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Optional: cap the number of ZIPs checked (e.g. "1" for a smoke run)'
        required: false
        default: ''
  schedule:
    # WEEKLY, not daily, since 2026-08-06 (quota). At 187.5 runner-min/run this was 45.4% of
    # ALL Actions spend on this repo — 2,626 min in six days — and it failed 7 of 14 runs.
    # Weekly keeps the regression signal at a seventh of the cost; workflow_dispatch above
    # covers on-demand checks, and the push trigger below still fires on the files that matter.
    # The real fix is the scoped-but-unbuilt worker pool (one Playwright page, serial, ~1.37s
    # per ZIP) — that cuts the cost itself rather than the cadence. Restore daily after it ships.
    - cron: '37 13 * * 1'   # weekly, Mondays 13:37 UTC
  push:
    branches: [main]
    paths:
      - 'homesignalmap.html'
      - 'config.js'
      - 'shell.js'
      - 'partials/shell.html'
      - 'lib/data.js'
      - 'docs/*-development-reports-seed.sql'
      - 'docs/development-reports-cache.sql'
      - 'scripts/verify-development.mjs'
      - 'scripts/verify-representative-zips.mjs'
      - 'scripts/lib/verify-dev-helpers.mjs'
      - '.github/workflows/verify-development.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    # Bound added 2026-08-02: an unbounded job inherits GitHub's 6-HOUR default, which is how
    # verify-geocodes burned 11 consecutive 6 h cancellations on an account previously halted
    # at $0. Measured max successful run: 251.6 min -> bound 330.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright (chromium)
        run: npm init -y >/dev/null 2>&1 && npm i -D playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium
      - name: Verify development pages
        env:
          SITE_BASE: https://homesignal.net
          ZIP_PATH: '/homesignalmap.html?zip={zip}'   # canonical live route (no per-ZIP files)
          SAMPLE: ${{ github.event.inputs.sample }}
        run: node scripts/verify-development.mjs

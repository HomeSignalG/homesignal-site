name: youtube-channel-sync-suite

# YouTube channel sync (docs/youtube-channel-sync.sql), applied on top of the live video queue files, against a DISPOSABLE Postgres with stand-ins for
# Supabase's auth/storage/social_posts. No Supabase credential is used or reachable here.
on:
  pull_request:
    paths:
      - 'docs/video-bluesky-queue.sql'
      - 'docs/youtube-video-review.sql'
      - 'docs/youtube-video-file-decide-queue-apply.sql'
      - 'docs/youtube-channel-sync.sql'
      - 'test/youtube_channel_sync_pg/**'
      - 'test/video_bluesky_queue_pg/**'
      - '.github/workflows/youtube-channel-sync-suite.yml'
  push:
    branches: [main]
    paths:
      - 'docs/video-bluesky-queue.sql'
      - 'docs/youtube-video-review.sql'
      - 'docs/youtube-video-file-decide-queue-apply.sql'
      - 'docs/youtube-channel-sync.sql'
      - 'test/youtube_channel_sync_pg/**'
      - 'test/video_bluesky_queue_pg/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run if any Supabase credential is present
        run: |
          if [ -n "${SUPABASE_DB_URL:-}${SUPABASE_ACCESS_TOKEN:-}${SUPABASE_WRITE_KEY:-}" ]; then
            echo "a Supabase credential is present; this suite must not see one"; exit 1
          fi
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql
      - name: Run the channel sync suite (exit code is the result)
        run: bash test/youtube_channel_sync_pg/run.sh

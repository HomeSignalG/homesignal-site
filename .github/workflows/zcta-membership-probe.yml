name: zcta-membership-probe

# READ-ONLY. Answers one question with its own positive control attached: does the PINNED
# TIGER/ZCTA archive the geography pipeline is built on contain a given canonical ZIP?
#
# It exists because the classification `not_measured / NO_ZCTA_IN_TIGER_2025` is a claim
# about that archive, and on 2026-09-06 it was nearly made from `geo.n5_zcta`, which
# returned 0 for the ZIPs under test AND 0 for its own positive control - the table is
# empty. A failed positive control invalidates the instrument, so that table can never
# establish absence.
#
# MANUAL DISPATCH ONLY, like phase2-b1-zcta.yml, and for the same reasons: the sandbox has
# no egress to www2.census.gov, and the archive is 505 MB and must never be committed.
# The receipt channel is the job log.
#
# It WRITES NOTHING. SUPABASE_ACCESS_TOKEN is present for READS only - the ZIP populations
# are computed by SQL rather than transcribed into the script (CLAUDE.md rule 7), so this
# workflow cannot carry a stale or mistyped list.

on:
  workflow_dispatch:

concurrency:
  group: zcta-membership-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe the pinned TIGER/ZCTA archive (read-only, positive-control gated)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/zcta_membership_probe.py

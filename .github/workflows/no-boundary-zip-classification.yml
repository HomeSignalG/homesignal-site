name: no-boundary-zip-classification

# Fix 4 (2026-10-01). Regenerates the classification of every canonical ZIP with no Census ZCTA
# boundary from its committed inputs and the pinned USPS dataset (zipcodes 3.0.0), and fails if
# the committed CSV or summary differ. The offline unit test
# (test/no-boundary-zip-classification.test.mjs) checks the committed files against the Census
# evidence; this job is the half that needs PyPI. Holds no secret and reads no database.

on:
  pull_request:
    paths:
      - 'docs/maps-coverage/fix4/**'
      - 'scripts/fix4_classify_no_boundary_zips.py'
      - 'test/no-boundary-zip-classification.test.mjs'
      - '.github/workflows/no-boundary-zip-classification.yml'
  push:
    branches: [main]
    paths:
      - 'docs/maps-coverage/fix4/**'
      - 'scripts/fix4_classify_no_boundary_zips.py'
      - 'test/no-boundary-zip-classification.test.mjs'
      - '.github/workflows/no-boundary-zip-classification.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned USPS dataset
        run: pip install zipcodes==3.0.0
      - name: Regenerate and compare
        run: python3 scripts/fix4_classify_no_boundary_zips.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline invariants
        run: node test/no-boundary-zip-classification.test.mjs

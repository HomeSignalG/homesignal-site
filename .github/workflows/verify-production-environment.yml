name: verify-production-environment

# Proves that the three PROD_ secrets of the GitHub environment `production` work, without
# printing any of them. Dispatch-only and writes nothing: the database check runs with
# default_transaction_read_only=on, every HTTP check is a GET.
#   From main: every row must PASS.
#   From any other branch: the environment must refuse the job before a runner starts (0 steps).
#
# DRAFT, DO NOT MERGE YET. This job names the environment `production`, which does not exist yet.
# A job that names a missing environment can create it with no protection rules, so this file
# must not reach main until the founder says the environment is ready (deployment branches: main
# only; no admin bypass; holding PROD_SUPABASE_DB_URL, PROD_SUPABASE_SERVICE_ROLE_KEY and
# PROD_SUPABASE_ACCESS_TOKEN).
#
# The environment line and the first step are the canonical boundary text in
# test/lib/production-boundary.mjs, pinned by test/production-boundary-new-workflows.test.mjs.
#
# Every check prints expected vs observed to the log and the job summary. Observed values are only
# HTTP codes, counts, the port, the project ref and status, and the control count; never a secret,
# a response body or the database URL. A single FAIL makes the run red.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verify-production-environment
  cancel-in-progress: false

jobs:
  verify:
    environment: { name: production, deployment: false }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: qwnnmljucajnexpxdgxr
    steps:
      - name: 'Production boundary: refuse a dispatch the operator did not start'
        id: boundary
        # FIRST step, before any step that holds a secret. The production environment admits only
        # ref main, but a workflow_dispatch's INPUTS are chosen by whoever dispatched it; another
        # run's GITHUB_TOKEN (github-actions[bot]) or an installed app (<app>[bot]) would let branch
        # code choose them. github.actor is the original dispatcher and github.triggering_actor the
        # re-runner (a re-run replays the original inputs), so both must be the operator.
        # Canonical text: test/lib/production-boundary.mjs (BOUNDARY_STEP); the tests compare this
        # step to it byte for byte, comment lines excluded.
        if: github.event_name == 'workflow_dispatch' && (github.actor != 'HomeSignalG' || github.triggering_actor != 'HomeSignalG')
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::error::Production credentials are not issued to this dispatch (actor=$ACTOR, triggering_actor=$TRIGGERING_ACTOR). Only HomeSignalG may start or re-run a production dispatch, from main."
          exit 1
      # Only for config.js: the public anon key is the negative control for the service key.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /config.js
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Install the psql client if the runner lacks it
        run: |
          set -euo pipefail
          if command -v psql >/dev/null; then psql --version; exit 0; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql --version
      - name: Check the three PROD_ secrets (values never printed)
        env:
          PROD_DB_URL: ${{ secrets.PROD_SUPABASE_DB_URL }}
          SERVICE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json, os, re, subprocess, urllib.error, urllib.parse, urllib.request

          REF = os.environ["PROJECT_REF"]
          REST = "https://%s.supabase.co" % REF
          API = "https://api.supabase.com/v1/projects/%s" % REF
          # api.supabase.com sits behind Cloudflare, which refuses Python's default User-Agent with
          # HTTP 403 (error 1010) before authentication. Sent on every request here.
          UA = "HomeSignal-verify-prod/1.0 (+https://homesignal.net)"
          DB_URL = os.environ.get("PROD_DB_URL", "")
          SERVICE = os.environ.get("SERVICE_KEY", "")
          TOKEN = os.environ.get("ACCESS_TOKEN", "")
          rows = []

          def clean(v, n=60):
              """Observed values are codes, counts and identifiers only: keep a safe charset."""
              return re.sub(r"[^A-Za-z0-9_.,:()<>=/*+ -]", "?", str(v))[:n]

          def row(name, expected, observed, ok):
              rows.append((name, clean(expected, 80), clean(observed), "PASS" if ok else "FAIL"))

          def get(url, headers=None):
              """GET. Returns (status, parsed JSON or None). status 0 = no HTTP answer. Never prints."""
              h = {"User-Agent": UA, "Accept": "application/json"}
              h.update(headers or {})
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=30) as r:
                      status, raw = r.status, r.read()
              except urllib.error.HTTPError as e:
                  status, raw = e.code, e.read()
              except Exception:
                  return 0, None
              try:
                  return status, json.loads(raw.decode("utf-8", "replace"))
              except ValueError:
                  return status, None

          def key_headers(key):
              return {"apikey": key, "Authorization": "Bearer " + key}

          # C0: the three secrets reach this step.
          for name, value in (("PROD_SUPABASE_DB_URL", DB_URL), ("PROD_SUPABASE_SERVICE_ROLE_KEY", SERVICE),
                              ("PROD_SUPABASE_ACCESS_TOKEN", TOKEN)):
              row("C0 %s is set" % name, "set", "set" if value else "MISSING", bool(value))

          # C1: the database URL. Parsed here, never printed.
          row("C1a URL names project %s" % REF, "yes", "yes" if REF in DB_URL else "no", REF in DB_URL)
          try:
              u = urllib.parse.urlsplit(DB_URL)
              port = u.port or 5432          # libpq's default; the same rule scripts/dc-*-apply.sh use
              query = urllib.parse.parse_qs(u.query)
              if "port" in query:
                  port = int(query["port"][-1])
              port_seen = str(port) if u.scheme in ("postgres", "postgresql") else "not a postgres:// URI"
          except ValueError:
              port_seen = "unparseable"

          def classify(err):
              e = err.lower()
              for needle, label in (("password authentication failed", "authentication failed"),
                                    ("tenant or user not found", "pooler: tenant or user not found"),
                                    ("timeout expired", "connect timeout"),
                                    ("could not translate host name", "host name not resolved"),
                                    ("connection refused", "connection refused"),
                                    ("does not exist", "relation or database does not exist"),
                                    ("permission denied", "permission denied"),
                                    ("ssl", "ssl error")):
                  if needle in e:
                      return label
              return "other error (text withheld)"

          env = {k: v for k, v in os.environ.items() if k not in ("SERVICE_KEY", "ACCESS_TOKEN")}
          env.update(PGCONNECT_TIMEOUT="15",
                     PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=20s")
          try:
              p = subprocess.run(["psql", DB_URL, "-XAtq", "-F,", "-v", "ON_ERROR_STOP=1", "-c",
                                  "select 1, (select count(*) from public.canonical_zip_registry)"],
                                 env=env, capture_output=True, text=True, timeout=60)
              db_seen = p.stdout.strip() if p.returncode == 0 else "psql exit %d (%s)" % (p.returncode, classify(p.stderr))
          except subprocess.TimeoutExpired:
              db_seen = "psql timed out"
          except OSError:
              db_seen = "psql not runnable"
          row("C1b read-only select 1 and the canonical ZIP count", "1,12722", db_seen, db_seen == "1,12722")
          row("C1c port: 5432 (direct or session pooler), never 6543 (transaction pooler)", "5432", port_seen,
              port_seen == "5432")

          # C2: the service-role key. Each positive check is paired with the public anon key on the
          # same request, so a PASS proves the key can do more than anon can.
          m = re.search(r"SUPABASE_ANON_KEY:\s*'([^']+)'", open("config.js", encoding="utf-8").read())
          anon = m.group(1) if m else ""
          row("C2 control: anon key found in config.js", "found", "found" if anon else "missing", bool(anon))
          table = REST + "/rest/v1/app_zip_source_ids?limit=0"
          s, _ = get(table, key_headers(SERVICE))
          a, _ = get(table, key_headers(anon)) if anon else (0, None)
          row("C2a service key reads app_zip_source_ids", "200", s, s == 200)
          row("C2b control: anon refused on the same read", "401 or 403", a, a in (401, 403))
          # Storage: storage.buckets has RLS and no anon policy. The service role bypasses RLS and
          # sees every bucket; for anon, Storage answers either with an error status or with an empty
          # list, depending on its version. Both mean anon cannot list buckets, so either passes the
          # control; anon seeing any bucket fails it (the check could not tell the two keys apart).
          buckets = REST + "/storage/v1/bucket"
          s, sb = get(buckets, key_headers(SERVICE))
          a, ab = get(buckets, key_headers(anon)) if anon else (0, None)
          s_n = len(sb) if isinstance(sb, list) else None
          a_n = len(ab) if isinstance(ab, list) else None
          row("C2c service key lists storage buckets", "200, >= 1 bucket", "%s, %s bucket(s)" % (s, s_n),
              s == 200 and bool(s_n))
          row("C2d control: anon refused, or sees no bucket", "400/401/403, or 200 with 0 buckets",
              "%s, %s bucket(s)" % (a, a_n), a in (400, 401, 403) or (a == 200 and a_n == 0))

          # C3: the Management API token.
          bearer = {"Authorization": "Bearer " + TOKEN}
          c, project = get(API, bearer)
          row("C3a token reads the project", "200", c, c == 200)
          project = project if isinstance(project, dict) else {}
          ref = project.get("ref") or project.get("id") or ""
          status = project.get("status") or ""
          row("C3b project ref (field ref, else id) and status", "%s ACTIVE_*" % REF, "%s %s" % (ref, status),
              ref == REF and str(status).startswith("ACTIVE_"))
          n, _ = get(API)
          row("C3c control: the same request with no token is refused", "401", n, n == 401)
          f, functions = get(API + "/functions", bearer)
          f_n = len(functions) if isinstance(functions, list) else None
          row("C3d token lists the project's edge functions (function scope)", "200",
              "%s, %s function(s)" % (f, f_n), f == 200)

          fails = sum(1 for r in rows if r[3] == "FAIL")
          table_md = ["| check | expected | observed | result |", "|---|---|---|---|"]
          table_md += ["| %s | %s | %s | %s |" % r for r in rows]
          print("\n".join(table_md))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(table_md) + "\n")
          print("ref=%s sha=%s checks=%d failures=%d" % (os.environ.get("GITHUB_REF", ""), os.environ.get("GITHUB_SHA", ""),
                                                        len(rows), fails))
          if fails:
              print("::error::%d of %d production-environment checks failed" % (fails, len(rows)))
              raise SystemExit(1)
          PY

name: dev-change-recovery-suite

# HISTORICAL-RECOVERY PROTECTION (docs/dev-change-recovery.sql). Runs the SHIPPED migration against a DISPOSABLE
# Postgres whose ledger is built from the repo's own SQL of record (proved equal to the live bodies by md5 inside the
# run): 81 checks (rule_version 3: a stamped first sighting is the one-time BASELINE for its ZIP x source only until that
# pair is verified READY; after it a new record is an ordinary first detection; an incomplete/failed source HOLDS records
# and cannot establish readiness; fallback lapses readiness; neighbouring ZIPs sharing a key never double-announce; legacy
# unstamped records unchanged; deferral on any unsynchronised cache/materialisation state — one current plus stale rows,
# empty materialisation, invalid or missing generation, concurrent collector write or failure-row commit during the probe,
# with a positive control), idempotence, three refusals, then every prohibited mutation (32) —
# each MUST fail the suite. Never addresses production.

on:
  pull_request:
    paths:
      - 'docs/dev-change-recovery.sql'
      - 'docs/dev-change-ledger.sql'
      - 'docs/dev-change-baseline.sql'
      - 'docs/dev-change-reportable.sql'
      - 'test/dev_change_recovery_pg/**'
      - '.github/workflows/dev-change-recovery-suite.yml'
  push:
    branches: [main]
    paths:
      - 'docs/dev-change-recovery.sql'
      - 'test/dev_change_recovery_pg/**'

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dev_change_recovery_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run if any Supabase credential is present
        run: |
          if [ -n "${SUPABASE_DB_URL:-}${SUPABASE_ACCESS_TOKEN:-}${SUPABASE_WRITE_KEY:-}" ]; then
            echo "ABORT: this suite must only ever address the disposable container."; exit 1
          fi
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Shipped migration passes; every prohibited mutation is killed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dev_change_recovery_disposable
        run: |
          set -o pipefail
          bash test/dev_change_recovery_pg/run.sh 2>&1 | grep -v NOTICE | tee /tmp/dcr.log

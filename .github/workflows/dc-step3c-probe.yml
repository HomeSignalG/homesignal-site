name: dc-step3c-probe

# STEP 3C — ask the ORIGINAL publishers (OpenStreetMap via Overpass, EPA ECHO) what they still
# publish for the data-centre records residents see. READ-ONLY: writes no evidence, no run, no
# registry row. It measures whether onboarding through dc_evidence_writer is possible; it is not
# the onboarding.
#
# No schedule. Manual dispatch only (2026-10-22): it also ran on pull requests that changed the
# probe, and its job handed those PR runs SUPABASE_ACCESS_TOKEN (account-wide) with no event guard.
# Dispatch it from main after the change merges. EPA is asked at ~1 request / 1.2 s (~6 min for the
# resident facilities); Overpass once, by element id.

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Probe one cohort only (osm | epa | permits); empty = all'
        required: false
        default: ''

# A superseded head's probe is load on public publishers that nobody will read.
concurrency:
  group: dc-step3c-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    environment: { name: production, deployment: false }
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: qwnnmljucajnexpxdgxr
    steps:
      - name: 'Production boundary: refuse a dispatch the operator did not start'
        id: boundary
        # FIRST step, before any step that holds a secret. The production environment admits only
        # ref main, but a workflow_dispatch's INPUTS are chosen by whoever dispatched it; another
        # run's GITHUB_TOKEN (github-actions[bot]) or an installed app (<app>[bot]) would let branch
        # code choose them. github.actor is the original dispatcher and github.triggering_actor the
        # re-runner (a re-run replays the original inputs), so both must be the operator.
        # Canonical text: test/lib/production-boundary.mjs (BOUNDARY_STEP); the tests compare this
        # step to it byte for byte, comment lines excluded.
        if: github.event_name == 'workflow_dispatch' && (github.actor != 'HomeSignalG' || github.triggering_actor != 'HomeSignalG')
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::error::Production credentials are not issued to this dispatch (actor=$ACTOR, triggering_actor=$TRIGGERING_ACTOR). Only HomeSignalG may start or re-run a production dispatch, from main."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: probe the original publishers (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
          PROBE_ONLY: ${{ github.event.inputs.only }}
        run: node scripts/dc-step3c-probe-publishers.mjs

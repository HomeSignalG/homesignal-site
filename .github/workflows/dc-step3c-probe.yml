name: dc-step3c-probe

# STEP 3C — ask the ORIGINAL publishers (OpenStreetMap via Overpass, EPA ECHO) what they still
# publish for the data-centre records residents see. READ-ONLY: writes no evidence, no run, no
# registry row. It measures whether onboarding through dc_evidence_writer is possible; it is not
# the onboarding.
#
# No schedule. It runs when the probe itself changes and on manual dispatch. EPA is asked at
# ~1 request / 1.2 s (~6 min for the resident facilities); Overpass once, by element id.

on:
  # pull_request REMOVED (production credential boundary): a PR run executed the PR's own
  # code while holding production credentials. Run it from main via workflow_dispatch.
  workflow_dispatch:
    inputs:
      only:
        description: 'Probe one cohort only (osm | epa | permits); empty = all'
        required: false
        default: ''

# A superseded head's probe is load on public publishers that nobody will read.
concurrency:
  group: dc-step3c-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    # Privileged production credentials are issued ONLY through the main-restricted
    # GitHub Environment `production` (tested by test/production-credential-boundary.test.mjs).
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: qwnnmljucajnexpxdgxr
    steps:
      - name: 'Production boundary: refuse a dispatch chained from another workflow'
        # First step, before anything else runs. A workflow_dispatch whose triggering actor is
        # github-actions[bot] was started by ANOTHER workflow's GITHUB_TOKEN - i.e. by branch
        # code - and would otherwise enter the main-only production Environment with inputs that
        # branch chose. Enforced by main's copy of this file, which a branch cannot redefine.
        if: github.event_name == 'workflow_dispatch' && github.triggering_actor == 'github-actions[bot]'
        run: |
          echo "::error::Production credentials are not issued to a dispatch chained from another workflow (triggering actor github-actions[bot]). Dispatch it from main as an operator."
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: probe the original publishers (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROBE_ONLY: ${{ github.event.inputs.only }}
        run: node scripts/dc-step3c-probe-publishers.mjs

name: youtube-engagement-suite

# docs/youtube-engagement.sql (the count tables, the youtube channel splice and the reader) against a DISPOSABLE Postgres
# with stand-ins for production. No Supabase credential is used or reachable here.
on:
  pull_request:
    paths:
      - 'docs/youtube-engagement.sql'
      - 'docs/acquisition-attribution.sql'
      - 'test/youtube_engagement_pg/**'
      - '.github/workflows/youtube-engagement-suite.yml'
  push:
    branches: [main]
    paths:
      - 'docs/youtube-engagement.sql'
      - 'docs/acquisition-attribution.sql'
      - 'test/youtube_engagement_pg/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run if any Supabase credential is present
        run: |
          if [ -n "${SUPABASE_DB_URL:-}${SUPABASE_ACCESS_TOKEN:-}${SUPABASE_WRITE_KEY:-}" ]; then
            echo "a Supabase credential is present; this suite must not see one"; exit 1
          fi
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql
      - name: Run the suite (exit code is the result)
        run: bash test/youtube_engagement_pg/run.sh

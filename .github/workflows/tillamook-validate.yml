name: tillamook-validate
on:
  workflow_dispatch:
  push:
    branches: [claude/tillamook-validate]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Diagnose Tillamook county cases (read-only, public county pages)
        run: node scripts/_tillamook_diag.mjs

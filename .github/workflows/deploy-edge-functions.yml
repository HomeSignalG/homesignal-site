name: deploy-edge-functions

# Deploy Supabase Edge Functions straight from the repo — the transmission-free deploy path.
# The Supabase CLI reads the function's multi-file source from disk on a GitHub runner (which has
# egress), bundles it, and deploys. No hand-copied bundle, byte-exact every time, and the
# non-technical founder never has to run anything locally. This is the durable replacement for the
# MCP inline-bundle deploy (which has a ~30 KB payload ceiling and must be hand-transmitted).
#
# ONE-TIME SETUP (repo → Settings → Secrets and variables → Actions):
#   • SUPABASE_ACCESS_TOKEN — a personal access token from https://supabase.com/dashboard/account/tokens
#   (SUPABASE_PROJECT_REF is hard-coded below; it is not a secret — it's in docs already.)
#
# Manual by default so a deploy is always a deliberate act. Flip `push:` on if you want
# auto-deploy when the function source changes on main.

on:
  workflow_dispatch:
    inputs:
      function:
        description: 'Edge function slug to deploy'
        required: true
        default: 'get-address-report'
  # Uncomment to auto-deploy on source changes to main:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'supabase/functions/get-address-report/**'

concurrency:
  group: deploy-edge-${{ github.event.inputs.function || 'get-address-report' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Bound added 2026-08-02: an unbounded job inherits GitHub's 6-HOUR default, which is how
    # verify-geocodes burned 11 consecutive 6 h cancellations on an account previously halted
    # at $0. Measured max successful run: 0.6 min -> bound 15.
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: qwnnmljucajnexpxdgxr
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge function (byte-exact, from repo source)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          FN="${{ github.event.inputs.function || 'get-address-report' }}"
          echo "Deploying edge function: $FN → project $SUPABASE_PROJECT_REF"
          # --no-verify-jwt: get-address-report authenticates via the anon apikey at the gateway and
          # is called from the browser + pg_net; it has no per-request JWT gate (matches its live config).
          supabase functions deploy "$FN" \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      # Recompute the live-metric exclusion list FROM the registry JSON just deployed and
      # full-replace public.registry_incomplete_entries in one transaction. This is the ONLY
      # writer of that table; every Live-page query reads it via v_incomplete_registry_entries
      # instead of an inlined array (docs/registry-incomplete-entries-migration.sql).
      #
      # FAIL-LOUD BY DESIGN — no continue-on-error, set -euo pipefail, and a non-2xx or SQL
      # error exits 1: a deploy that succeeds while this step fails must show a RED run,
      # because the alternative is a silently stale exclusion list that misstates the metric
      # while every query "works". registry_sha256 rows carry the hash of the exact JSON this
      # run computed from, so staleness is independently checkable (see the migration file).
      - name: Recompute + load registry_incomplete_entries (fail-loud)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          echo "--- computed exclusion list:"
          node scripts/compute-incomplete-registry.mjs
          node scripts/compute-incomplete-registry.mjs --sql > /tmp/incomplete-load.sql
          python3 - /tmp/incomplete-load.sql <<'PY'
          import json, os, sys, urllib.request
          sql = open(sys.argv[1]).read()
          req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{os.environ['SUPABASE_PROJECT_REF']}/database/query",
              data=json.dumps({"query": sql}).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  # Load-bearing header — api.supabase.com sits behind Cloudflare, which 403s
                  # Python's default UA (error 1010) BEFORE auth. Documented in db-sql.yml;
                  # do not remove it as an apparently pointless header.
                  "User-Agent": "HomeSignal-db-sql/1.0 (+https://homesignal.net)",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  body = r.read().decode()
                  print(f"HTTP {r.status}")
                  print(body[:4000])
                  if r.status // 100 != 2:
                      sys.exit(1)
          except urllib.error.HTTPError as e:
              print(f"HTTP {e.code}")
              print(e.read().decode()[:4000])
              sys.exit(1)
          PY

      - name: Reminder — repopulate the cache
        run: |
          echo "Deployed. New behavior is live for address mode immediately."
          echo "For ZIP pages, re-cache so env populates: re-run the development_reports refresh"
          echo "(pg_net → get-address-report {zip,lat,lng}) for the target ZIPs, or wait for the"
          echo "daily dev_refresh cron. verify-development CI does the live browser check."

name: maps-zip-email-suite

# The "What is changing in my zip code?" email stream (A12) against a DISPOSABLE Postgres.
#
# WHY postgres:17 AND NOT THE POSTGIS IMAGE THE OTHER SUITES USE: A12 changes a generated
# column with ALTER COLUMN ... SET EXPRESSION, which exists only from PostgreSQL 17, and
# production is 17.6. On 16 the harness has to shim that one statement; here it runs the
# shipped file unmodified, so CI proves the statement production will actually execute.
#
# THIS JOB RUNS THE SITE HALF ONLY. The delivery half is homesignal-ingest's
# supabase/migrations/20260925230000_maps_email_delivery.sql, and homesignal-ingest is
# PRIVATE: this repo's token cannot read it. The first version of this job tried, and its
# first run failed with "Not Found" -- the wall check-alert-subscription-parity.yml already
# records. So the COMBINED run (A12 + delivery, every D-check and every delivery mutation)
# lives in homesignal-ingest's check-maps-email-pg.yml, which clones THIS public repo, the
# one direction that works. Here the delivery checks print SKIP, which the runner never
# counts as a pass; there REQUIRE_DELIVERY=1 turns a missing delivery file into a failure.
on:
  pull_request:
    paths:
      - 'docs/alert-subscription-canonical-a12.sql'
      - 'test/maps_zip_email_pg/**'
      - '.github/workflows/maps-zip-email-suite.yml'
  push:
    branches: [main]
    paths:
      - 'docs/alert-subscription-canonical-a12.sql'
      - 'test/maps_zip_email_pg/**'
      - '.github/workflows/maps-zip-email-suite.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maps_zip_email_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run if any Supabase credential is present
        run: |
          if [ -n "${SUPABASE_DB_URL:-}${SUPABASE_ACCESS_TOKEN:-}${SUPABASE_WRITE_KEY:-}" ]; then
            echo "ABORT: this suite must only ever address the disposable container."; exit 1
          fi
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: A12 passes (applied twice); every prohibited A12 mutation is killed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: maps_zip_email_disposable
        run: |
          set -o pipefail
          bash test/maps_zip_email_pg/run.sh 2>&1 | grep -v NOTICE

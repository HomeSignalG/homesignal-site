name: pages

# Builds the GitHub Pages deployment artifact: the whole static site PLUS one generated
# HTML document per canonical ZIP geography at /community/<zip>/.
#
# ARCHITECTURE (founder decision, 2026-09-04): one shared implementation
# (lib/community-page.js + the template in scripts/gen_zip_pages.py) plus a data-driven
# build. The generated documents exist ONLY in this artifact and are NEVER committed —
# CLAUDE.md §0 prohibits maintained per-community source files, not deterministic
# build output. Adding or removing a canonical ZIP needs no hand-written HTML.
#
# SAFETY: the `build` job runs on every push to this workflow's inputs and proves the
# gates. The `deploy` job runs ONLY on main, so the existing "deploy from a branch"
# production path is untouched until the repository Pages Source is switched to
# "GitHub Actions" — a one-time setting change that is not performable from CI.

on:
  workflow_dispatch:
  # PUBLISH TRIGGER — must mirror what the artifact SHIPS, not what the ZIP generator reads.
  #
  # This list used to name the nine generator/gate inputs, which is the wrong question: the
  # "Stage the static site" step below rsyncs the WHOLE repo minus .github/docs/test/
  # node_modules, so 339 of the 344 shipped files had no publish trigger — index.html,
  # app.css, homesignalmap.html, partials/shell.html and every lib/*.js among them. Measured
  # over the 20 commits before this change: 18 touched a shipped file and pages fired on push
  # for 0 of them. Publishing worked only because someone dispatched it by hand after nearly
  # every merge (17 of 22 main runs were workflow_dispatch); when nobody did, the site waited
  # for the 06:40 cron. Keep this list in step with the rsync excludes — a mismatch is silent,
  # so test/pages-publish-trigger.test.mjs derives the shipped set from that rsync line and
  # fails when the two drift.
  #
  # Scoped to main: the deploy job is already `if: github.ref == 'refs/heads/main'`, so a
  # branch build could never publish, and a broad path list on every branch push would run
  # this 30-minute Playwright build on every commit of every branch. The pull_request trigger
  # below keeps the pre-merge proof that branch pushes used to give (20 of 42 runs), on the
  # same narrow generator inputs it has always covered. Same split, and the same reasoning,
  # as unit-tests.yml.
  push:
    branches: [main]
    paths:
      - '**'
      - '!.github/**'
      - '!docs/**'
      - '!test/**'
      - '!node_modules/**'
      # …then the gate inputs that live inside those excluded trees. Order matters: a later
      # positive pattern re-includes a path an earlier '!' removed.
      - '.github/workflows/pages.yml'
      - 'test/zip-pages-seo.test.mjs'
      - 'test/zip-pages-no-point.test.mjs'
      - 'test/community-page-contract.test.mjs'
      - 'test/fixtures/zip-pages.json'
  # PRE-MERGE PROOF, unchanged in scope: the generator/gate inputs, so a change to the ZIP
  # build is proven before it reaches main. Builds, never deploys.
  pull_request:
    paths:
      - 'scripts/gen_zip_pages.py'
      - 'scripts/prove-zip-pages.mjs'
      - 'lib/community-page.js'
      - 'community.html'
      - '404.html'
      - 'test/zip-pages-seo.test.mjs'
      - 'test/zip-pages-no-point.test.mjs'
      - 'test/community-page-contract.test.mjs'
      - 'test/fixtures/zip-pages.json'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '40 6 * * *'   # daily, after the ingest cycle; keeps robots current as ZIPs cross Rule F

permissions:
  contents: read

concurrency:
  group: pages-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage the static site
        run: |
          mkdir -p _site
          # everything that ships today, minus VCS/CI/dev-only trees
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' \
                   --exclude 'test' --exclude 'docs' --exclude 'node_modules' \
                   ./ _site/

      - name: Generate one document per canonical ZIP
        run: |
          set -euo pipefail
          python3 scripts/gen_zip_pages.py --out _site | tee -a "$RUNNER_TEMP/receipts.txt"

      - name: Build gates
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/receipts.txt") 2>&1
          test -f _site/zip-pages-manifest.json
          DOCS=$(find _site/community -mindepth 2 -name index.html | wc -l)
          echo "generated documents: $DOCS"
          # every generated path is a 5-digit canonical ZIP directory, nothing else
          BAD=$(find _site/community -mindepth 1 -maxdepth 1 -type d \
                  ! -regex '.*/[0-9][0-9][0-9][0-9][0-9]$' | wc -l)
          echo "non-canonical path shapes: $BAD"; test "$BAD" -eq 0
          test ! -e _site/community/80249            # the removed drift ZIP must not exist
          echo "artifact size: $(du -sh _site | cut -f1)"
          # SITEMAP RECONCILIATION — the advertised set must BE the index-eligible set.
          python3 - <<'PY'
          import json, re, sys
          man = json.load(open('_site/zip-pages-manifest.json'))
          sm = open('_site/sitemap.xml', encoding='utf-8').read()
          zips = re.findall(r'<loc>[^<]*/community/(\d{5})/</loc>', sm)
          assert not re.search(r'community\.html\?zip=', sm), 'legacy community URL still advertised'
          assert sorted(zips) == man['indexable_zips'], 'sitemap != Rule F pass set'
          assert len(zips) == man['rule_f_pass'], 'sitemap count != Rule F pass count'
          assert 'homesignalmap.html?zip=' in sm, 'development sitemap half was destroyed'
          print(f"sitemap reconciled: {len(zips)} community URLs == rule_f_pass {man['rule_f_pass']}")
          PY
          # nothing generated may ever enter git
          git status --porcelain | grep -E '^\?\?\s+community/' && \
            { echo 'ERROR: generated ZIP HTML appeared in the working tree'; exit 1; } || true
          echo "GATES OK"

      - name: Confirm no generated HTML is tracked by git
        run: |
          if git ls-files --error-unmatch community/ >/dev/null 2>&1; then
            echo 'ERROR: community/ is tracked in git — generated output must never be committed'
            exit 1
          fi
          echo "git is clean of generated ZIP documents"

      - name: Offline gates for the generated documents
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/receipts.txt") 2>&1
          for t in zip-pages-seo zip-pages-no-point community-page-contract; do
            echo "--- test/$t.test.mjs"
            node "test/$t.test.mjs" | tail -3
          done

      - name: Install Playwright (chromium)
        run: npm init -y >/dev/null 2>&1 && npm i -D playwright@1 >/dev/null 2>&1 && npx playwright install chromium

      - name: Candidate crawler proof (initial HTML + JS + Googlebot UAs)
        env:
          SITE_DIR: _site
          # FROZEN CONTROLS — classes A-J, re-derived from live data 2026-09-04 14:26-14:35Z
          # and pinned here so a reclassification by normal ingestion is a visible one-line
          # replacement. 07010 was the prior unit's "Alerts PASS + development FAIL" control
          # and has since become development PASS (its map page qualified); 01034 Granville
          # MA replaces it in that class. See docs/alerts-seo-build-2026-09-04.md.
          #   A 01001 Agawam MA        Alerts PASS + development PASS
          #   B 01034 Granville MA     Alerts PASS + development FAIL (Alerts alone qualifies)
          #   C 01002 Amherst MA       Alerts FAIL + development PASS (development cannot)
          #   D 02543 Woods Hole MA    Alerts FAIL + development FAIL
          #   E 01001                  Rule F carried by local news only
          #   F 04401 Bangor ME        weather present, still under Rule F
          #   G 02543                  honest-empty
          #   H 22030 Fairfax VA       60 notices fanned out from one jurisdiction
          #   J 28468 Sunset Beach NC  19,536 development records - no point may leak
          CONTROLS: >-
            {"pass_dev_pass":"01001","pass_dev_fail":"01034","fail_dev_pass":"01002",
             "fail_dev_fail":"02543","local_news":"01001","weather_thin":"04401",
             "honest_empty":"02543","fanout":"22030","point_dense":"28468"}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/receipts.txt") 2>&1
          node scripts/prove-zip-pages.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Report build stats
        if: always()
        run: |
          echo "----- RECEIPTS (replayed: the artifact upload lists 12,722 paths and"
          echo "      pushes every earlier step out of the retrievable log tail) -----"
          cat "$RUNNER_TEMP/receipts.txt" || echo "NO RECEIPTS FILE — the gates did not run"
          echo "----- BUILD STATS -----"
          python3 - <<'EOF'
          import json, os
          m = json.load(open('_site/zip-pages-manifest.json'))
          tot = n = mx = 0
          for root, _, files in os.walk('_site/community'):
              for f in files:
                  b = os.path.getsize(os.path.join(root, f)); tot += b; n += 1; mx = max(mx, b)
          print('documents       :', m['documents'])
          print('rule F pass     :', m['rule_f_pass'])
          print('rule F fail     :', m['rule_f_fail'])
          print('indexable zips  :', len(m['indexable_zips']))
          print('html files      :', n)
          print('uncompressed    : %.1f MB' % (tot/1048576))
          print('avg html bytes  :', tot // max(n,1))
          print('max html bytes  :', mx)
          EOF
          echo "site total: $(du -sh _site | cut -f1)"
          echo "----- END BUILD STATS -----"

  deploy:
    # Only main deploys. Requires the repository Pages Source = "GitHub Actions".
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: pages

# Builds the GitHub Pages deployment artifact: the whole static site PLUS one generated
# HTML document per canonical ZIP geography at /community/<zip>/.
#
# ARCHITECTURE (founder decision, 2026-09-04): one shared implementation
# (lib/community-page.js + the template in scripts/gen_zip_pages.py) plus a data-driven
# build. The generated documents exist ONLY in this artifact and are NEVER committed —
# CLAUDE.md §0 prohibits maintained per-community source files, not deterministic
# build output. Adding or removing a canonical ZIP needs no hand-written HTML.
#
# SAFETY: `deploy` runs ONLY on main (`if: github.ref == 'refs/heads/main'`), so no branch
# or pull-request run can publish. `build` proves the gates before that.
#
# DEPLOYMENT RELIABILITY (2026-09-06). Two defects, which have to be fixed together:
#
#   1. The push filter named the ZIP GENERATOR's inputs while "Stage the static site"
#      rsynced the WHOLE repo minus .github/docs/test/node_modules into the artifact.
#      339 of 344 shipped files - index.html, app.css, homesignalmap.html,
#      partials/shell.html, every lib/*.js - could merge to main and never deploy.
#      (That rsync is GONE as of Fix 19 - see "Stage the static site" below - but the
#      push filter it motivated is still the thing keeping deploys reliable.)
#
#   2. `concurrency: pages-build` was ONE group shared by every run on every ref. GitHub
#      keeps only the newest PENDING run per group, so a branch run queued behind a main
#      run cancelled main's deploy. Measured: run #54 for 3e0f763 was cancelled 39s in
#      with zero jobs, and that commit only reached production after a manual re-dispatch.
#
# Widening (1) ALONE is what forced the revert in #1072: more branch runs meant more
# chances for a branch build to starve the production deploy. Both halves ship together.
#
#   push is scoped to main   -> a branch push cannot enter the group at all
#   the group is per-ref     -> a branch DISPATCH, which is still allowed, gets its own
#                               group and so cannot contend with refs/heads/main either
#
# pull_request keeps the pre-merge proof that branch pushes used to give, on the SAME
# narrow generator inputs it has always covered. That is not extra scope: if the build
# breaks, main does not deploy, so catching it before merge is part of deploying reliably.
# Its ref is refs/pull/N/merge, a different concurrency group, so it cannot starve main.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # A deliberate SUPERSET of what the artifact ships. Since Fix 19 the artifact is an
      # allowlist (scripts/stage_site.py), which is strictly narrower than this filter, so
      # the trigger can only ever over-fire — it rebuilds and redeploys an identical
      # artifact. That is the safe direction: under-firing is the Fix 18-era defect where
      # 339 of 344 shipped files could merge to main and never deploy.
      - '**'
      - '!.github/**'
      - '!docs/**'
      - '!test/**'
      # The gate inputs this build itself runs, and this workflow, so a change here proves
      # itself.
      - 'test/zip-pages-seo.test.mjs'
      - 'test/zip-pages-no-point.test.mjs'
      - 'test/community-page-contract.test.mjs'
      - 'test/site-artifact-contract.test.mjs'
      - 'test/fixtures/zip-pages.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'scripts/stage_site.py'
      - 'test/site-artifact-contract.test.mjs'
      - 'scripts/gen_zip_pages.py'
      - 'scripts/prove-zip-pages.mjs'
      # The pure control-resolution core the proof runs on, and now also the producer of the
      # membership the DEPLOYED twin reads. A lib-only change that never ran this build could
      # ship an artifact whose controls file the live monitor cannot use.
      - 'scripts/lib/zip-page-controls.mjs'
      - 'lib/community-page.js'
      - 'community.html'
      - '404.html'
      - 'test/zip-pages-seo.test.mjs'
      - 'test/zip-pages-no-point.test.mjs'
      - 'test/community-page-contract.test.mjs'
      - 'test/fixtures/zip-pages.json'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '40 6 * * *'   # daily, after the ingest cycle; keeps robots current as ZIPs cross Rule F

permissions:
  contents: read

concurrency:
  # PER REF, not one global group. main's deploys only ever contend with other main runs;
  # a branch or pull-request run lands in its own group and cannot cancel a queued deploy.
  # cancel-in-progress stays false so an in-flight actions/deploy-pages is never interrupted.
  group: pages-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage the static site
        run: |
          set -euo pipefail
          # FIX 19: an ALLOWLIST, not the old six-flag rsync denylist. scripts/stage_site.py
          # holds the artifact contract and is the only producer; a path ships only if it is
          # named there, so internal files fail CLOSED instead of shipping by default.
          python3 scripts/stage_site.py --src . --out _site | tee -a "$RUNNER_TEMP/receipts.txt"

      - name: Generate one document per canonical ZIP
        run: |
          set -euo pipefail
          python3 scripts/gen_zip_pages.py --out _site | tee -a "$RUNNER_TEMP/receipts.txt"

      - name: Build gates
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/receipts.txt") 2>&1
          test -f _site/zip-pages-manifest.json
          DOCS=$(find _site/community -mindepth 2 -name index.html | wc -l)
          echo "generated documents: $DOCS"
          # every generated path is a 5-digit canonical ZIP directory, nothing else
          BAD=$(find _site/community -mindepth 1 -maxdepth 1 -type d \
                  ! -regex '.*/[0-9][0-9][0-9][0-9][0-9]$' | wc -l)
          echo "non-canonical path shapes: $BAD"; test "$BAD" -eq 0
          test ! -e _site/community/80249            # the removed drift ZIP must not exist
          echo "artifact size: $(du -sh _site | cut -f1)"
          # SITEMAP RECONCILIATION — the advertised set must BE the index-eligible set.
          python3 - <<'PY'
          import json, re, sys
          man = json.load(open('_site/zip-pages-manifest.json'))
          sm = open('_site/sitemap.xml', encoding='utf-8').read()
          zips = re.findall(r'<loc>[^<]*/community/(\d{5})/</loc>', sm)
          assert not re.search(r'community\.html\?zip=', sm), 'legacy community URL still advertised'
          assert sorted(zips) == man['indexable_zips'], 'sitemap != Rule F pass set'
          assert len(zips) == man['rule_f_pass'], 'sitemap count != Rule F pass count'
          assert 'homesignalmap.html?zip=' in sm, 'development sitemap half was destroyed'
          print(f"sitemap reconciled: {len(zips)} community URLs == rule_f_pass {man['rule_f_pass']}")
          PY
          # nothing generated may ever enter git
          git status --porcelain | grep -E '^\?\?\s+community/' && \
            { echo 'ERROR: generated ZIP HTML appeared in the working tree'; exit 1; } || true
          echo "GATES OK"

      - name: Artifact contract gate (Fix 19)
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/receipts.txt") 2>&1
          node test/site-artifact-contract.test.mjs | tail -6

      - name: Audit the REAL artifact (Fix 19)
        # The gate above proves the producer. This proves the ARTIFACT — the actual _site
        # tree after every build step has written into it, which is what GitHub Pages
        # uploads. A repo-side test cannot see a later step copying something in, so the
        # thing that ships is inspected directly rather than inferred from the thing that
        # made it.
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/receipts.txt") 2>&1
          python3 - <<'PY'
          import os, subprocess, sys
          contract = set(subprocess.run(
              [sys.executable, 'scripts/stage_site.py', '--src', '.', '--list-only'],
              capture_output=True, text=True, check=True).stdout.split())
          actual = set()
          for root, _, files in os.walk('_site'):
              for f in files:
                  actual.add(os.path.relpath(os.path.join(root, f), '_site').replace(os.sep, '/'))
          # everything the build legitimately ADDS to the staged contract
          def generated(p):
              return p == 'zip-pages-manifest.json' or p.startswith('community/')
          unexpected = sorted(p for p in actual - contract if not generated(p))
          # an empty audit is not a clean audit
          assert len(actual) > len(contract), f'artifact ({len(actual)}) did not grow past the contract ({len(contract)})'
          assert 'index.html' in actual, 'index.html absent from the real artifact'
          print(f'artifact files: {len(actual)}  contract: {len(contract)}  '
                f'generated: {len(actual) - len(contract)}  unexpected: {len(unexpected)}')
          if unexpected:
              print('UNEXPECTED FILES IN THE PUBLISHED ARTIFACT:')
              for p in unexpected[:40]:
                  print('   ', p)
              sys.exit(1)
          # and the internal families, named, against the real tree
          for bad in ('CLAUDE.md', 'QUEUE.md', 'PLAN.md', 'DECISIONS.md', 'PROGRESS.md', '.gitignore'):
              assert bad not in actual, f'{bad} is in the published artifact'
          for tree in ('scripts/', 'verify/', 'fixtures/', 'supabase/', 'data/', '.claude/', 'docs/', 'test/'):
              hit = [p for p in actual if p.startswith(tree)]
              assert not hit, f'{tree} shipped: {hit[:5]}'
          print('ARTIFACT AUDIT OK — the published tree is the contract plus generated ZIP documents')
          PY

      - name: Confirm no generated HTML is tracked by git
        run: |
          if git ls-files --error-unmatch community/ >/dev/null 2>&1; then
            echo 'ERROR: community/ is tracked in git — generated output must never be committed'
            exit 1
          fi
          echo "git is clean of generated ZIP documents"

      - name: Offline gates for the generated documents
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/receipts.txt") 2>&1
          for t in zip-pages-seo zip-pages-no-point community-page-contract; do
            echo "--- test/$t.test.mjs"
            node "test/$t.test.mjs" | tail -3
          done

      - name: Install Playwright (chromium)
        run: npm init -y >/dev/null 2>&1 && npm i -D playwright@1 >/dev/null 2>&1 && npx playwright install chromium

      - name: Candidate crawler proof (initial HTML + JS + Googlebot UAs)
        env:
          SITE_DIR: _site
          # CONTROLS — classes A-J. Only point_dense is still PINNED, and only because
          # "the densest development ZIP leaks no point/radius string" is a strictly stronger
          # claim than "some page leaks none": deriving it would replace the worst case with
          # an average one. Everything else is DERIVED from the build each run and asserted
          # NON-EMPTY, so drift substitutes and reports instead of reddening the build.
          #
          # WHY THIS STOPPED BEING FROZEN. Pinned controls rotted three times — 07010, then
          # 01002 Amherst MA and 04401 Bangor ME on 2026-09-11 — every time by NORMAL
          # INGESTION, as real content pushed a ZIP across Rule F. rule_f_pass read 8,291 /
          # 8,380 / 8,372 across three builds, TWO OF THEM ON THE SAME COMMIT. Each rot went
          # red, and a red pages build means the site does not update.
          #
          # The argument for freezing was that a control derived from the build it tests
          # cannot catch a build-wide misclassification, because the class comes back empty
          # and its assertion passes over nothing. That premise is true; the conclusion is
          # not. Asserting the class is NON-EMPTY covers exactly that case, and is now done.
          # Pinned selection was never the only way to get the property — only the way that
          # also turned ordinary ingestion into an outage.
          CONTROLS: >-
            {"point_dense":"28468"}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/receipts.txt") 2>&1
          node scripts/prove-zip-pages.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Report build stats
        if: always()
        run: |
          echo "----- RECEIPTS (replayed: the artifact upload lists 12,722 paths and"
          echo "      pushes every earlier step out of the retrievable log tail) -----"
          cat "$RUNNER_TEMP/receipts.txt" || echo "NO RECEIPTS FILE — the gates did not run"
          echo "----- BUILD STATS -----"
          python3 - <<'EOF'
          import json, os
          m = json.load(open('_site/zip-pages-manifest.json'))
          tot = n = mx = 0
          for root, _, files in os.walk('_site/community'):
              for f in files:
                  b = os.path.getsize(os.path.join(root, f)); tot += b; n += 1; mx = max(mx, b)
          print('documents       :', m['documents'])
          print('rule F pass     :', m['rule_f_pass'])
          print('rule F fail     :', m['rule_f_fail'])
          print('indexable zips  :', len(m['indexable_zips']))
          print('html files      :', n)
          print('uncompressed    : %.1f MB' % (tot/1048576))
          print('avg html bytes  :', tot // max(n,1))
          print('max html bytes  :', mx)
          EOF
          echo "site total: $(du -sh _site | cut -f1)"
          echo "----- END BUILD STATS -----"

  deploy:
    # Only main deploys. Requires the repository Pages Source = "GitHub Actions".
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

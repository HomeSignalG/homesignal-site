name: denton-launch-audit

# READ-ONLY audit of the 32 Denton County ZIP pages (founder directive 2026-10-12).
# Manual dispatch only. Writes nothing to production: every SQL statement is a SELECT inside
# `begin read only` (scripts/denton-launch-audit.py refuses anything else), publisher calls are
# GET/POST queries to public ArcGIS endpoints, page checks load public pages.
# Results are in the job log between BEGIN/END markers (artifacts are unreadable from the sandbox).
on:
  workflow_dispatch:
    inputs:
      site_base:
        description: "Origin to check (defaults to production)"
        required: false
        default: "https://homesignal.net"
      task:
        description: "audit = full 32-ZIP audit; pages = live pages only; jurisdictions = which places each ZIP overlaps; coverage = ZIPs intersecting Denton County vs the 32-ZIP list; investigate = duplicate permit ids, TxDOT line check, 76262 centroid marker"
        required: false
        default: "audit"

permissions:
  contents: read

jobs:
  data:
    if: ${{ github.event.inputs.task != 'investigate' && github.event.inputs.task != 'pages' && github.event.inputs.task != 'jurisdictions' && github.event.inputs.task != 'coverage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Database + publisher audit (read only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/denton-launch-audit.py
  pages:
    if: ${{ github.event.inputs.task != 'investigate' && github.event.inputs.task != 'jurisdictions' && github.event.inputs.task != 'coverage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i -D playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Live pages, desktop and mobile
        env:
          SITE_BASE: ${{ github.event.inputs.site_base || 'https://homesignal.net' }}
        run: |
          # site_base=local serves THIS checkout (the branch under test) on localhost; data still comes from the live read APIs.
          if [ "$SITE_BASE" = "local" ]; then
            python3 -m http.server 8099 >/dev/null 2>&1 &
            sleep 2; export SITE_BASE=http://localhost:8099
          fi
          node scripts/denton-launch-pages.mjs
  investigate:
    if: ${{ github.event.inputs.task == 'investigate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Investigation (read only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/denton-launch-investigate.py
  jurisdictions:
    if: ${{ github.event.inputs.task == 'jurisdictions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Jurisdictions per ZIP (read only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/denton-launch-jurisdictions.py
  coverage:
    if: ${{ github.event.inputs.task == 'coverage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: County coverage vs the 32-ZIP list (read only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/denton-launch-coverage.py

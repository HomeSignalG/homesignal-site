name: denton-launch-audit

# READ-ONLY audit of the 32 Denton County ZIP pages (founder directive 2026-10-12).
# Manual dispatch only. Writes nothing to production: every SQL statement is a SELECT inside
# `begin read only` (scripts/denton-launch-audit.py refuses anything else), publisher calls are
# GET/POST queries to public ArcGIS endpoints, page checks load public pages.
# Results are in the job log between BEGIN/END markers (artifacts are unreadable from the sandbox).
on:
  workflow_dispatch:
    inputs:
      site_base:
        description: "Origin to check (defaults to production)"
        required: false
        default: "https://homesignal.net"
      task:
        description: "audit = full 32-ZIP audit; pages = live pages only; jurisdictions = which places each ZIP overlaps; coverage = ZIPs intersecting Denton County vs the 32-ZIP list; investigate = duplicate permit ids, TxDOT line check, 76262 centroid marker"
        required: false
        default: "audit"

permissions:
  contents: read

jobs:
  data:
    if: ${{ github.event.inputs.task != 'investigate' && github.event.inputs.task != 'pages' && github.event.inputs.task != 'jurisdictions' && github.event.inputs.task != 'coverage' && github.event.inputs.task != 'sources' && github.event.inputs.task != 'sources-focus' && github.event.inputs.task != 'sources-denton' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Database + publisher audit (read only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p out
          OUT_AUDIT=out/audit.json python3 scripts/denton-launch-audit.py
      - uses: actions/upload-artifact@v4
        with: { name: denton-audit, path: out/audit.json, retention-days: 7 }
  pages:
    if: ${{ github.event.inputs.task != 'investigate' && github.event.inputs.task != 'jurisdictions' && github.event.inputs.task != 'coverage' && github.event.inputs.task != 'sources' && github.event.inputs.task != 'sources-focus' && github.event.inputs.task != 'sources-denton' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i -D playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Live pages, desktop and mobile
        env:
          SITE_BASE: ${{ github.event.inputs.site_base || 'https://homesignal.net' }}
        run: |
          # site_base=local serves THIS checkout (the branch under test) on localhost; data still comes from the live read APIs.
          if [ "$SITE_BASE" = "local" ]; then
            python3 -m http.server 8099 >/dev/null 2>&1 &
            sleep 2; export SITE_BASE=http://localhost:8099
          fi
          mkdir -p out
          OUT_PAGES=out/pages.json node scripts/denton-launch-pages.mjs
      - uses: actions/upload-artifact@v4
        with: { name: denton-pages, path: out/pages.json, retention-days: 7 }
  investigate:
    if: ${{ github.event.inputs.task == 'investigate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Investigation (read only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/denton-launch-investigate.py
  jurisdictions:
    if: ${{ github.event.inputs.task == 'jurisdictions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Jurisdictions per ZIP (read only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/denton-launch-jurisdictions.py
  coverage:
    if: ${{ github.event.inputs.task == 'coverage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: County coverage vs the 32-ZIP list (read only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/denton-launch-coverage.py
  sources:
    # Step 6: read-only first-party source probe (scripts/denton-source-probe.mjs). GET only, robots respected.
    if: ${{ startsWith(github.event.inputs.task, 'sources') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe Denton sources (read only)
        env:
          PROBE_MODE: ${{ github.event.inputs.task == 'sources-focus' && 'focus' || github.event.inputs.task == 'sources-denton' && 'denton' || 'broad' }}
        run: node scripts/denton-source-probe.mjs
  accept:
    # Final acceptance: needs BOTH halves to have completed. A skipped or failed half means this job does not run, so it can never grade from nothing.
    needs: [data, pages]
    if: ${{ needs.data.result == 'success' && needs.pages.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: denton-audit, path: out }
      - uses: actions/download-artifact@v4
        with: { name: denton-pages, path: out }
      - name: Acceptance verdicts (no network, no database)
        run: python3 scripts/denton-launch-accept.py out/audit.json out/pages.json

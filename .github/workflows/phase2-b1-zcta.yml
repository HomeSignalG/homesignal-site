name: phase2-b1-zcta

# Phase 2 execution workflow — B1 boundary load, and B3 source-geometry recovery.
#
# One workflow rather than several, because "the approved manually dispatched workflow"
# is the thing that carries the restrictions: no schedule, no trigger from production,
# no new credential, concurrency 1. Adding a mode keeps those properties; adding a
# second workflow would duplicate them and let them drift apart.
#
# Phase 2 / B1 — authoritative Box Elder ZCTA boundary acquisition and load.
#
# MANUAL DISPATCH ONLY. There is deliberately no `schedule:` and no trigger from
# production: this workflow does nothing at all until a human dispatches it, which is
# the restriction it was approved under (founder ruling 2026-09-01).
#
# It runs on a GitHub runner because the build sandbox has no egress to
# www2.census.gov, and because the TIGER archive is 505 MB and must NEVER be committed
# to this repository. Nothing is uploaded as an artifact either — the receipt channel
# is the job log, as with recon-fetch.yml and db-sql.yml.
#
# The B1 modes, and the separation is the point:
#   validate  acquire, checksum, read the archive's own .prj, count features, derive
#             the in-scope ZCTA set, size the payload. NO DATABASE CREDENTIAL IS
#             EVEN PLACED IN THE ENVIRONMENT, so it cannot write if it tried.
#   load      re-acquire, refuse unless the recorded sha256 and GEOID-set fingerprint
#             both reproduce exactly, then send ONE SQL request that is ONE
#             transaction. Any in-transaction assertion raises and the whole
#             transaction rolls back.
#
#   n5-verify re-derive the completed shards' geometry-verified associations from the
#             frozen snapshot alone and compare them, exactly, against what those shards
#             wrote. Read-only against every durable N5 artifact; its one write is a
#             scratch boundary table it creates and drops in the same run, because the
#             per-shard ZCTA slices are correctly discarded at cleanup.
#
# Credentials: SUPABASE_ACCESS_TOKEN only, and never in B1 validate mode. It already
# exists (db-sql.yml, deploy-edge-functions.yml). No new secret was created for this
# work. B3's two modes both hold it: b3-probe to READ the frozen candidate list,
# b3-load to write recovered geometry.

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'pilot batch key for n3-zcta / n3-recover (786 | 207)'
        required: false
        default: '786'
        type: string
      mode:
        description: 'validate | load (B1) · b3-* (B3 source geometry) · n2a-* | n2b-resolve | n2c-diagnose (national classification, read-only)'
        required: true
        type: choice
        options: [validate, load, b3-probe, b3-load, b3-nvdot, b3-invalid-probe, n2a-zcta, n2a-classify, n2a-fidelity, n2b-resolve, n2c-diagnose, n2c-attrgeom, n3-zcta, n3-recover, n5-shard, n5-verify, n5-acquire, n5-zcta-stats, n5-boundary-first, n5-unit-a, n5-a3-clip, n5-a3-marker, n5-a4-index, n5-a4-bench]
        default: validate
      z3:
        description: 'n5-shard: ZIP3 to build, or AUTO for the next pending shard'
        required: false
        default: 'AUTO'
        type: string
      max_shards:
        description: 'n5-shard: how many shards this run may complete'
        required: false
        default: '1'
        type: string
      prefix:
        description: 'n5-boundary-first: the ONE ZIP3 prefix to probe'
        required: false
        default: ''
        type: string
      prefixes:
        description: 'n5-boundary-first: comma-separated ZIP3 list, run sequentially in one process'
        required: false
        default: ''
        type: string
      marker_mode:
        description: 'n5-a3-marker: measure (component primitives) | build (marker relation)'
        required: false
        default: 'measure'
        type: string
      bench_passes:
        description: 'n5-a4-bench: comma-separated pass numbers to record (default 3,4)'
        required: false
        default: '3,4'
        type: string
      registry_id:
        description: 'n5-acquire: the ONE registry_id to acquire in full'
        required: false
        default: ''
        type: string
      expect_sha256:
        description: 'load only: archive sha256 recorded by the validate run'
        required: false
        default: ''
      expect_geoid_fp:
        description: 'load only: in-scope GEOID-set md5 recorded by the validate run'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  b1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Unconditional, offline, no credential. sql() guards EVERY mode below, so the
      # instrument that decides whether a batch survives a gateway throttle is itself
      # checked on every dispatch rather than trusted.
      - name: 'Self-test: sql() retries 429 only and still fails closed'
        run: python3 scripts/test_sql_retry.py

      - name: Validate (no database credential in scope)
        if: ${{ github.event.inputs.mode == 'validate' }}
        env:
          MODE: validate
        run: python3 scripts/phase2_b1_zcta.py

      - name: 'B3 probe (read-only): source cardinality, CRS, payload size'
        if: ${{ github.event.inputs.mode == 'b3-probe' }}
        env:
          MODE: b3-probe
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/phase2_b3_geometry.py

      - name: B3 recover source geometry (tranched, network never inside a transaction)
        if: ${{ github.event.inputs.mode == 'b3-load' }}
        env:
          MODE: b3-load
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/phase2_b3_geometry.py

      - name: B3 complete NVDOT (bounded retries, resume only what was never attempted)
        if: ${{ github.event.inputs.mode == 'b3-nvdot' }}
        env:
          MODE: b3-nvdot
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/phase2_b3_geometry.py

      - name: N2A step 0 - re-derive national ZCTA denominators (read-only)
        if: ${{ github.event.inputs.mode == 'n2a-zcta' }}
        env:
          MODE: n2a-zcta
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/n2a_classify.py

      - name: N2A step 1 - classify publisher geometry types (read-only)
        if: ${{ github.event.inputs.mode == 'n2a-classify' }}
        env:
          MODE: n2a-classify
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/n2a_classify.py

      - name: N2A step 3 - POINT stored-coordinate fidelity (read-only)
        if: ${{ github.event.inputs.mode == 'n2a-fidelity' }}
        env:
          MODE: n2a-fidelity
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/n2a_classify.py

      - name: N2B - resolve remaining POINT-capable sources (read-only)
        if: ${{ github.event.inputs.mode == 'n2b-resolve' }}
        env:
          MODE: n2b-resolve
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/n2a_classify.py

      - name: N2C - diagnose the 20 unresolved sources (read-only)
        if: ${{ github.event.inputs.mode == 'n2c-diagnose' }}
        env:
          MODE: n2c-diagnose
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/n2c_diagnose.py

      - name: N2C pass 2 - coordinate-column and set-membership fidelity (read-only)
        if: ${{ github.event.inputs.mode == 'n2c-attrgeom' }}
        env:
          MODE: n2c-attrgeom
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/n2c_diagnose.py

      - name: N3 pilot - acquire the 37 ZIP3-786 ZCTA polygons
        if: ${{ github.event.inputs.mode == 'n3-zcta' }}
        env:
          MODE: n3-zcta
          BATCH: ${{ github.event.inputs.batch }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/n3_pilot.py

      - name: N3 pilot - recover TxDOT authoritative polyline geometry
        if: ${{ github.event.inputs.mode == 'n3-recover' }}
        env:
          MODE: n3-recover
          BATCH: ${{ github.event.inputs.batch }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/n3_pilot.py

      - name: N5 - bounded national association build, shard by shard
        if: ${{ github.event.inputs.mode == 'n5-shard' }}
        env:
          MODE: n5-shard
          SNAPSHOT: phase1-2026-09-01
          Z3: ${{ github.event.inputs.z3 }}
          MAX_SHARDS: ${{ github.event.inputs.max_shards }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/n5_shard.py

      - name: N5 Part 1 - does the snapshot reproduce what the shards built (read-only)
        if: ${{ github.event.inputs.mode == 'n5-verify' }}
        env:
          MODE: n5-verify
          SNAPSHOT: phase1-2026-09-01
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/n5_verify_snapshot.py

      - name: N5 A2 - acquire ONE registry's geometry in full (not a shard run)
        if: ${{ github.event.inputs.mode == 'n5-acquire' }}
        env:
          MODE: n5-acquire
          SNAPSHOT: phase1-2026-09-01
          REGISTRY_ID: ${{ github.event.inputs.registry_id }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/n5_acquire_registry.py

      - name: N5 Part 2 - national ZCTA geometry distribution (read-only, no DB credential)
        if: ${{ github.event.inputs.mode == 'n5-zcta-stats' }}
        env:
          MODE: n5-zcta-stats
        run: python3 scripts/n5_zcta_stats.py

      - name: N5 S1 - boundary-first membership probe, ONE prefix
        if: ${{ github.event.inputs.mode == 'n5-boundary-first' }}
        env:
          MODE: n5-boundary-first
          SNAPSHOT: phase1-2026-09-01
          PREFIX: ${{ github.event.inputs.prefix }}
          PREFIXES: ${{ github.event.inputs.prefixes }}
          DISK_FLOOR_MB: '2048'
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/n5_boundary_first.py

      - name: N5 Unit A - authoritative SHADOW read product (no production read change)
        if: ${{ github.event.inputs.mode == 'n5-unit-a' }}
        env:
          MODE: n5-unit-a
          SNAPSHOT: phase1-2026-09-01
          DISK_FLOOR_MB: '2048'
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/n5_unit_a_shadow.py

      - name: N5 Unit A3 - clipped-geometry measurement for the marker-grain decision
        if: ${{ github.event.inputs.mode == 'n5-a3-clip' }}
        env:
          MODE: n5-a3-clip
          SNAPSHOT: phase1-2026-09-01
          DISK_FLOOR_MB: '2048'
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/n5_a3_clip_stats.py

      - name: N5 Unit A3 - authoritative marker grain (measure primitives | build relation)
        if: ${{ github.event.inputs.mode == 'n5-a3-marker' }}
        env:
          MODE: n5-a3-marker
          MARKER_MODE: ${{ github.event.inputs.marker_mode }}
          # Optional. Restricts a build to the named prefixes so a batch never rebuilds
          # markers under ZIPs that are already production_geography_verified (the
          # delete/insert window would make those live pages raise). Empty = all.
          PREFIXES: ${{ github.event.inputs.prefixes }}
          SNAPSHOT: phase1-2026-09-01
          DISK_FLOOR_MB: '2048'
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/n5_a3_markers.py

      - name: N5 Unit A4 - create the measured-required source_key index
        if: ${{ github.event.inputs.mode == 'n5-a4-index' }}
        env:
          MODE: n5-a4-index
          A4_MODE: index
          DISK_FLOOR_MB: '2048'
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/n5_a4_index.py

      - name: N5 Unit A4 - re-benchmark the authoritative project lookup
        if: ${{ github.event.inputs.mode == 'n5-a4-bench' }}
        env:
          MODE: n5-a4-bench
          A4_MODE: bench
          BENCH_PASSES: ${{ github.event.inputs.bench_passes }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/n5_a4_index.py

      - name: B3 invalid-geometry probe (read-only, native CRS)
        if: ${{ github.event.inputs.mode == 'b3-invalid-probe' }}
        env:
          MODE: b3-invalid-probe
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/phase2_b3_geometry.py

      - name: Load (one transaction, fail closed)
        if: ${{ github.event.inputs.mode == 'load' }}
        env:
          MODE: load
          EXPECT_SHA256: ${{ github.event.inputs.expect_sha256 }}
          EXPECT_GEOID_FP: ${{ github.event.inputs.expect_geoid_fp }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/phase2_b1_zcta.py

name: debug-home-browser-tmp
# TEMPORARY (removed in the next commit): shows why the two homepage browser suites fail on #1655's CI.
on:
  push:
    branches: [claude/new-session-5mi0nm]
    paths: ['.github/workflows/debug-home-browser-tmp.yml']
jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install playwright and leaflet as the unit-tests browser job does
        working-directory: ${{ github.workspace }}/..
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.0 leaflet@1.9.4
          npx playwright install --with-deps chromium
      - name: Run the two homepage suites three times each, full output
        run: |
          for i in 1 2 3; do
            for t in home-index home-zip-or-address; do
              echo "=== run $i: $t"; node test/$t.browser.test.mjs 2>&1 | grep -v "^PASS" | tail -40; echo "rc=${PIPESTATUS[0]}"
            done
          done

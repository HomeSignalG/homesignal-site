name: maps-subscriber-zips-monitor-suite

# docs/maps-subscriber-zips-monitor.sql (the hourly monitor sees a development-alert subscriber
# who gets no email) against a DISPOSABLE Postgres. Never production.
on:
  pull_request:
    paths:
      - 'docs/maps-zip-order-subscriber-zips.sql'
      - 'docs/maps-subscriber-zips-monitor.sql'
      - 'docs/maps-subscriber-zips-monitor-real-only.sql'
      - 'test/maps_zip_order_subscribers_pg/fixture.sql'
      - 'test/maps_subscriber_zips_monitor_pg/**'
      - '.github/workflows/maps-subscriber-zips-monitor-suite.yml'
  push:
    branches: [main]
    paths:
      - 'docs/maps-zip-order-subscriber-zips.sql'
      - 'docs/maps-subscriber-zips-monitor.sql'
      - 'docs/maps-subscriber-zips-monitor-real-only.sql'
      - 'test/maps_zip_order_subscribers_pg/fixture.sql'
      - 'test/maps_subscriber_zips_monitor_pg/**'
      - '.github/workflows/maps-subscriber-zips-monitor-suite.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run if any Supabase credential is present
        run: |
          if [ -n "${SUPABASE_DB_URL:-}${SUPABASE_ACCESS_TOKEN:-}${SUPABASE_WRITE_KEY:-}" ]; then
            echo "ABORT: this suite must only ever address the disposable container."; exit 1
          fi
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: The maps_subscriber_zips health check; every prohibited mutation is killed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -o pipefail
          bash test/maps_subscriber_zips_monitor_pg/run.sh 2>&1 | grep -v NOTICE

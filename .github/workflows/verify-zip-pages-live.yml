name: verify-zip-pages-live

# PRODUCTION proof for the canonical ZIP community pages at /community/<zip>/.
#
# READ-ONLY: it fetches public URLs and renders them. No commit, no DB write, no secret, no
# site change. It exists because the build sandbox has no egress to homesignal.net (the
# agent proxy answers 403 to CONNECT) — the same reason verify-communities.yml exists.
#
# Every SEO assertion is made against the INITIAL HTTP RESPONSE BODY. JavaScript is executed
# afterwards and asserted only to have NOT reversed the build-time decision. The deployed
# twin of the pre-deployment proof inside pages.yml.

on:
  workflow_dispatch:
    inputs:
      controls:
        description: 'JSON control map (classes A-J). Empty = the frozen defaults below.'
        required: false
        default: ''
  schedule:
    - cron: '20 7 * * *'   # daily, after the 06:40 pages rebuild

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright (chromium)
        # No --with-deps: the runner image already carries chromium's shared libraries, and
        # the apt half is what hung an earlier capture run past its own bound.
        run: npm init -y >/dev/null 2>&1 && npm i -D playwright@1 >/dev/null 2>&1 && npx playwright install chromium
      - name: Prove the production ZIP pages
        env:
          SITE_BASE: https://homesignal.net
          # ONLY THE NON-DERIVED CONTROLS ARE PINNED. Classes A-H are read from the
          # membership the build published into the artifact it deployed
          # (zip-page-controls.json), so a reclassification by normal ingestion substitutes
          # and reports instead of reddening this monitor. Every class is still asserted
          # NON-EMPTY, which is what the freezing was protecting.
          #
          # WHY THIS STOPPED BEING FROZEN. The pins here named 01002 Amherst MA
          # (fail_dev_pass) and 04401 Bangor ME (weather_thin). Both left their class by
          # NORMAL INGESTION on 2026-09-11 — real content pushed 01002 across Rule F, and
          # 04401's NWS weather alert expired. pages.yml was converted to derived controls
          # the same day (#1157, #1158) and this workflow was not, so it went red on
          # 2026-09-12 on three assertions that were each describing CORRECT production
          # behaviour, and stayed red. A permanently red monitor reports nothing.
          #
          # point_dense stays pinned because "the densest development ZIP leaks no
          # point/radius string" is a strictly stronger claim than "some page leaks none".
          # The three meetings ZIPs are a jurisdiction control, not a Rule F class: two ZIPs
          # in one county (Santa Clara CA, 60 ZIP children) which must receive the same
          # cascade, and one in another county which must receive none of it.
          DEFAULT_CONTROLS: >-
            {"point_dense":"28468",
             "meetings_same_a":"95002","meetings_same_b":"95008","meetings_other":"10001"}
        run: |
          set -euo pipefail
          CONTROLS="${{ github.event.inputs.controls }}"
          if [ -z "$CONTROLS" ]; then CONTROLS="$DEFAULT_CONTROLS"; fi
          export CONTROLS
          node scripts/prove-zip-pages-live.mjs

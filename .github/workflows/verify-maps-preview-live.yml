# PRODUCTION PROOF — the founder can see the exact MAPS visual in the live dashboard.
#
# Read-only against production: it fetches the deployed page, reads social_posts, and
# downloads image objects. It NEVER approves, schedules, publishes, or writes anything.
name: Verify MAPS founder preview (live)

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site origin to verify'
        required: false
        default: 'https://homesignal.net'

permissions:
  contents: read

concurrency:
  group: verify-maps-preview-live
  cancel-in-progress: false

jobs:
  verify:
    # Privileged production credentials are issued ONLY through the main-restricted
    # GitHub Environment `production` (tested by test/production-credential-boundary.test.mjs).
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 'Production boundary: refuse a dispatch chained from another workflow'
        # First step, before anything else runs. A workflow_dispatch whose triggering actor is
        # github-actions[bot] was started by ANOTHER workflow's GITHUB_TOKEN - i.e. by branch
        # code - and would otherwise enter the main-only production Environment with inputs that
        # branch chose. Enforced by main's copy of this file, which a branch cannot redefine.
        if: github.event_name == 'workflow_dispatch' && github.triggering_actor == 'github-actions[bot]'
        run: |
          echo "::error::Production credentials are not issued to a dispatch chained from another workflow (triggering actor github-actions[bot]). Dispatch it from main as an operator."
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # Pinned, and the browser is installed rather than assumed: a browser suite that
      # silently skips is success-shaped output attesting to nothing.
      - name: Install Playwright + Chromium
        run: |
          npm i --no-save playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Verify the live founder review
        env:
          SITE_URL: ${{ inputs.site_url || 'https://homesignal.net' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/verify-maps-preview-live.mjs

# PRODUCTION PROOF — the founder can see the exact MAPS visual in the live dashboard.
#
# Read-only against production: it fetches the deployed page, reads social_posts, and
# downloads image objects. It NEVER approves, schedules, publishes, or writes anything.
name: Verify MAPS founder preview (live)

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site origin to verify'
        required: false
        default: 'https://homesignal.net'

permissions:
  contents: read

concurrency:
  group: verify-maps-preview-live
  cancel-in-progress: false

jobs:
  verify:
    environment: { name: production, deployment: false }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 'Production boundary: refuse a dispatch the operator did not start'
        id: boundary
        # FIRST step, before any step that holds a secret. The production environment admits only
        # ref main, but a workflow_dispatch's INPUTS are chosen by whoever dispatched it; another
        # run's GITHUB_TOKEN (github-actions[bot]) or an installed app (<app>[bot]) would let branch
        # code choose them. github.actor is the original dispatcher and github.triggering_actor the
        # re-runner (a re-run replays the original inputs), so both must be the operator.
        # Canonical text: test/lib/production-boundary.mjs (BOUNDARY_STEP); the tests compare this
        # step to it byte for byte, comment lines excluded.
        if: github.event_name == 'workflow_dispatch' && (github.actor != 'HomeSignalG' || github.triggering_actor != 'HomeSignalG')
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "::error::Production credentials are not issued to this dispatch (actor=$ACTOR, triggering_actor=$TRIGGERING_ACTOR). Only HomeSignalG may start or re-run a production dispatch, from main."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # Pinned, and the browser is installed rather than assumed: a browser suite that
      # silently skips is success-shaped output attesting to nothing.
      - name: Install Playwright + Chromium
        run: |
          npm i --no-save playwright@1.47.2
          npx playwright install --with-deps chromium

      - name: Verify the live founder review
        env:
          SITE_URL: ${{ inputs.site_url || 'https://homesignal.net' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/verify-maps-preview-live.mjs

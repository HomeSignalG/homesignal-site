name: gate2b-full-inventory-parity

# GATE 2B — full Del Valle inventory parity across Street / Satellite / Focus.
# Runs HERE rather than in the build sandbox because the sandbox has no egress and cannot
# export the complete live inventory. Read-only: it reads app_projects with the PUBLIC anon
# key the site already ships, renders the real maps.html in real Chromium, and writes no
# production data. Manual trigger only.
#
# NO ROW COUNT IN THIS COMMENT, DELIBERATELY. It used to read "full 457-record" while the
# script asserted 517 and production held 540 — three numbers, none of them checkable from
# here. The inventory size is measured by the run and reported in gate2b-out/gate2b-report.json
# (step1_export.total); a count restated in a comment can only ever go stale silently.

# NOTE ON TRIGGERS: workflow_dispatch cannot be used yet — the GitHub API only dispatches
# workflows already registered on the DEFAULT branch, and this file exists only on the
# feature branch (merging first is not permitted). So the gate also runs on pull_request,
# which fires on the already-open PR for this branch without merging anything.
# RETIRED 2026-09-04 with the second map. scripts/gate2/full-inventory.mjs drives
# maps.html?zip=...&data=seed in real Chromium; that page is now a redirect stub to the one
# primary map, so an automatic run could only ever fail. Its pull_request trigger is removed
# for the same reason as the other maps.html verifiers: a permanently-red check teaches
# people to ignore red. workflow_dispatch is KEPT so the job and its evidence stay available.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Playwright + Chromium
        run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Run full-inventory parity
        run: node scripts/gate2/full-inventory.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2b-evidence
          path: gate2b-out/
          if-no-files-found: warn

name: n5-db-connectivity

# SELECT-ONLY production PG-wire connectivity proof for the N5 canonical-geometry migration.
#
# This workflow APPLIES NOTHING. It opens one PostgreSQL wire connection over the approved
# session-mode path and reads. Three independent safety layers make a write impossible:
#   1. PGOPTIONS forces default_transaction_read_only=on, so the SERVER rejects any write
#      or DDL in any transaction on this connection;
#   2. the script contains no INSERT/UPDATE/DELETE/DDL statement at all;
#   3. ON_ERROR_STOP=1 aborts on the first error rather than continuing.
#
# The credential is read from the environment only. It is never echoed, never passed as a
# command-line argument (which would appear in `ps`), and `set -x` is never enabled. Only the
# PORT and a host-shape boolean are printed - never the URL, host, user or password.

# TRIGGER NOTE: workflow_dispatch alone is not enough. GitHub only registers a dispatchable
# workflow once its FILE exists on the default branch, so this could not be dispatched from
# the PR branch (HTTP 404) and #1016 must not be merged before the migration is applied. The
# pull_request trigger is scoped to this file's own path, so it fires when the workflow
# changes and otherwise never - and it can be re-run on demand from the Actions UI ("Re-run
# jobs") after the credential is added, with no merge to main required. Secrets are available
# to same-repo pull_request runs; this repo takes no fork PRs.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/n5-db-connectivity.yml'

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Presence only. Prints SET / NOT SET, never the value.
      - name: Is a PG-wire credential provisioned?
        id: cred
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "SUPABASE_DB_URL: NOT SET"
            echo "CREDENTIAL PROVISIONING REQUIRED - founder action, see docs/n5-production-application-plan.md 4."
            exit 1
          fi
          echo "SUPABASE_DB_URL: SET (value never printed)"

      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql --version

      # Port is asserted from the URL, because 6543 is transaction-mode pooling and is
      # NOT acceptable for this migration: session state is not guaranteed there.
      - name: Assert the endpoint shape (port only - no host, user or password printed)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          from urllib.parse import urlparse
          u = urlparse(os.environ["SUPABASE_DB_URL"])
          host = (u.hostname or "")
          print(f"client-side port            : {u.port}")
          print(f"host is a Supavisor pooler  : {host.endswith('pooler.supabase.com')}")
          print(f"host is the direct endpoint : {host.endswith('.supabase.co')}")
          print(f"sslmode present in query    : {'sslmode' in (u.query or '')}")
          if u.port == 6543:
              sys.exit("STOP: port 6543 is TRANSACTION-mode pooling. Session state is not "
                       "guaranteed, so SET LOCAL, multi-statement transactions and "
                       "transactional DDL cannot be relied on. Use session mode on 5432.")
          if u.port not in (5432, None):
              sys.exit(f"STOP: unexpected port {u.port}; expected 5432 (session mode or direct).")
          PY

      - name: SELECT-only connectivity, identity and session-semantics proof
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Layer 1: the SERVER refuses every write and every DDL on this connection.
          PGOPTIONS: "-c default_transaction_read_only=on"
          PGSSLMODE: require
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off -f - <<'SQL'
          \echo '--- 1. connection + read-only posture -------------------------------------'
          select 1 as select_one,
                 current_setting('transaction_read_only') as session_read_only,
                 current_setting('default_transaction_read_only') as default_read_only;

          \echo '--- 2. TLS ----------------------------------------------------------------'
          select ssl, version as tls_version, cipher
            from pg_stat_ssl where pid = pg_backend_pid();

          \echo '--- 3. server identity ----------------------------------------------------'
          select current_database()      as db,
                 inet_server_port()      as server_port,
                 current_setting('cluster_name', true) as cluster,
                 version()               as postgresql,
                 postgis_full_version()  as postgis;

          \echo '--- 4. this is the INTENDED production database (N5 fingerprint) ----------'
          select (select count(*) from geo.n5_geom where provenance='proven_stored_point') as canonical_proven,
                 (select count(*) from geo.n5_point_reject)                                as rejects,
                 (select count(*) from geo.n5_shard)                                       as shards,
                 (select min(detail->>'snapshot') from geo.n5_point_reject)                as reject_snapshot;

          \echo '--- 5. migration pre-state classification (expect A_LEGACY) ---------------'
          select (select exists (select 1 from information_schema.columns
                    where table_schema='geo' and table_name='n5_geom'
                      and column_name='verdict_snapshot_id'))                     as has_verdict_snapshot_id,
                 (select exists (select 1 from pg_constraint
                    where conname='n5_geom_verdict_snapshot_ck'))                 as has_biconditional,
                 (select exists (select 1 from pg_constraint
                    where conname='n5_geom_pt_namespace_ck'))                     as has_pt_namespace,
                 (select pg_get_constraintdef(c.oid) from pg_constraint c
                   where c.conrelid='geo.n5_point_reject'::regclass and c.contype='p') as reject_pk,
                 (select pg_get_constraintdef(c.oid) from pg_constraint c
                   where c.conrelid='geo.n5_association'::regclass and c.contype='p')   as association_pk;

          \echo '--- 6. SESSION semantics: a bare SET must survive to the NEXT statement ---'
          \echo '     (under transaction-mode pooling this is not guaranteed)'
          set application_name = 'n5-preflight-session-probe';
          select current_setting('application_name') as app_name_persisted_across_statements;

          \echo '--- 7. the migration timeout policy works on THIS connection --------------'
          begin;
            set local lock_timeout      = '5s';
            set local statement_timeout = '15min';
            select current_setting('lock_timeout')      as lock_timeout_in_txn,
                   current_setting('statement_timeout') as statement_timeout_in_txn;
          commit;
          select current_setting('lock_timeout')      as lock_timeout_after_commit,
                 current_setting('statement_timeout') as statement_timeout_after_commit;

          \echo '--- 8. writer quiescence AT THIS INSTANT (evidence only, re-check at apply)'
          select now() as measured_at_utc,
                 (select count(*) from pg_stat_activity
                   where state <> 'idle' and pid <> pg_backend_pid()
                     and query ilike '%n5_%')                                      as active_n5_queries,
                 (select count(*) from pg_locks l
                    join pg_class c on c.oid = l.relation
                    join pg_namespace n on n.oid = c.relnamespace
                   where n.nspname='geo'
                     and c.relname in ('n5_geom','n5_point_reject','n5_association')
                     and l.pid <> pg_backend_pid())                                as n5_relation_locks,
                 (select count(*) from geo.n5_shard where state='running')         as shards_running,
                 (select count(*) from pg_replication_slots where not active)      as inactive_repl_slots;

          \echo '--- 9. writes are impossible on this connection (proof, not assertion) ----'
          \echo '     the next statement MUST fail with 25006 read_only_sql_transaction'
          \set ON_ERROR_STOP off
          create temporary table n5_readonly_probe (x int);
          \set ON_ERROR_STOP on
          \echo '     ^ an error above is the EXPECTED and required result'
          SQL
          echo ""
          echo "PG-WIRE SELECT-ONLY CONNECTIVITY: completed with exit 0"

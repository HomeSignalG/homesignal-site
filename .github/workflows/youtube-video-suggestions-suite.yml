name: youtube-video-suggestions-suite

# Tab 16 Suggest a video: docs/youtube-video-suggestions.sql (with docs/impact-stories.sql for _hs_is_admin) against a DISPOSABLE Postgres with stand-ins for Supabase's
# auth/vault/net. No Supabase credential is used or reachable here.
on:
  pull_request:
    paths:
      - 'docs/impact-stories.sql'
      - 'docs/youtube-video-suggestions.sql'
      - 'test/youtube_video_suggestions_pg/**'
      - 'test/impact_stories_pg/stubs.sql'
      - '.github/workflows/youtube-video-suggestions-suite.yml'
  push:
    branches: [main]
    paths:
      - 'docs/impact-stories.sql'
      - 'docs/youtube-video-suggestions.sql'
      - 'test/youtube_video_suggestions_pg/**'
      - 'test/impact_stories_pg/stubs.sql'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run if any Supabase credential is present
        run: |
          if [ -n "${SUPABASE_DB_URL:-}${SUPABASE_ACCESS_TOKEN:-}${SUPABASE_WRITE_KEY:-}" ]; then
            echo "a Supabase credential is present; this suite must not see one"; exit 1
          fi
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql
      - name: Run the suite (exit code is the result)
        run: bash test/youtube_video_suggestions_pg/run.sh

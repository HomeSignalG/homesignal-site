name: dc-source-freshness-suite

# DATA-CENTRE SOURCE FRESHNESS (docs/dc-source-freshness.sql): per ACTIVE data-centre source, the
# publisher's stated edition date, our newest complete read and our newest attempt with its outcome.
# Runs the SHIPPED SQL against a DISPOSABLE Postgres: the three separate dates, the weakest-distribution
# rule, an open run, who may run it, and what it never exposes. Every prohibited mutation in
# test/dc_source_freshness_pg/run.sh MUST fail the suite.

on:
  pull_request:
    paths:
      - 'docs/dc-source-freshness.sql'
      - 'test/dc_source_freshness_pg/**'
      - '.github/workflows/dc-source-freshness-suite.yml'
  push:
    branches: [main]
    paths:
      - 'docs/dc-source-freshness.sql'
      - 'test/dc_source_freshness_pg/**'
      - '.github/workflows/dc-source-freshness-suite.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dc-source-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dc_source_freshness_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run if any Supabase credential is present
        run: |
          if [ -n "${SUPABASE_DB_URL:-}${SUPABASE_ACCESS_TOKEN:-}${SUPABASE_WRITE_KEY:-}" ]; then
            echo "ABORT: this suite must only ever address the disposable container."; exit 1
          fi
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Shipped SQL passes; behaviours hold; every prohibited mutation is killed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dc_source_freshness_disposable
        run: |
          set -o pipefail
          bash test/dc_source_freshness_pg/run.sh 2>&1 | grep -v -E 'NOTICE|DETAIL|drop cascades' | tee /tmp/dcsf.log
      - name: Receipt
        if: always()
        run: |
          { echo '## Data-centre source freshness'; echo '```'; grep -E 'SHIPPED|PASS|FAIL|KILLED|SURVIVED|NO-OP|\|f$' /tmp/dcsf.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

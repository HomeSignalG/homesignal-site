name: dc-source-freshness-suite

# DATA-CENTRE LAYER FRESHNESS (docs/map1-dc-source-freshness.sql): runs the shipped reader against
# a DISPOSABLE Postgres with stand-in tables and checks its answers: the last successful refresh is
# the read whose records Map 1 shows, a failed newer read is reported as an attempt that did not
# refresh, the one-time OpenStreetMap load is never called scheduled, and no failure detail leaks.

on:
  pull_request:
    paths:
      - 'docs/map1-dc-source-freshness.sql'
      - 'test/map1_dc_source_freshness_pg/**'
      - '.github/workflows/dc-source-freshness-suite.yml'
  push:
    branches: [main]
    paths:
      - 'docs/map1-dc-source-freshness.sql'
      - 'test/map1_dc_source_freshness_pg/**'
      - '.github/workflows/dc-source-freshness-suite.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dc-source-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dc_source_freshness_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run if any Supabase credential is present
        run: |
          if [ -n "${SUPABASE_DB_URL:-}${SUPABASE_ACCESS_TOKEN:-}${SUPABASE_WRITE_KEY:-}" ]; then
            echo "ABORT: this suite must only ever address the disposable container."; exit 1
          fi
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Shipped SQL answers correctly
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dc_source_freshness_disposable
        run: bash test/map1_dc_source_freshness_pg/run.sh

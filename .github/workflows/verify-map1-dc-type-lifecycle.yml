name: verify-map1-dc-type-lifecycle

# Does every data-centre row Map 1 receives draw as a Data center, in the lifecycle its source
# states, with its name? Until 2026-09-27 none did: HS.map1DcSite filled fields Map 1 does not
# classify from, so all 1,816 rows on 757 ZIP pages drew as "Other project · lifecycle unknown"
# while every offline check passed. This drives the REAL page against REAL production data and
# compares it with the backend's own answer (scripts/probe-map1-dc-type-lifecycle.mjs).
#
# On a pull request it serves the PR's checked-out tree over localhost, which still reads the live
# database with the page's public anon key — so a change is proven on production data BEFORE it
# ships. Dispatch with site_base=https://homesignal.net to check what is live. No secret is used.

on:
  workflow_dispatch:
    inputs:
      zips:
        description: 'Comma-separated ZIPs (default: the deterministic sample 01040,01852,07033,20187,23150)'
        required: false
        default: ''
      site_base:
        description: 'Where to load the page from (default: the checked-out tree on localhost)'
        required: false
        default: ''
  pull_request:
    paths:
      - 'homesignalmap.html'
      - 'lib/data.js'
      - 'lib/map.js'
      - 'lib/project-type.js'
      - 'lib/zip-authoritative.js'
      - 'scripts/probe-map1-dc-type-lifecycle.mjs'
      - 'test/fixtures/map1-dc-zip-sample-2026-09-27.json'
      - '.github/workflows/verify-map1-dc-type-lifecycle.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright (chromium)
        run: npm init -y >/dev/null 2>&1 && npm i -D playwright@1.56.0 >/dev/null 2>&1 && npx playwright install --with-deps chromium
      - name: Serve the checked-out tree
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.site_base == '' }}
        run: |
          python3 -m http.server 8099 >/tmp/http.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8099/homesignalmap.html >/dev/null && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:8099/homesignalmap.html
      - name: Probe data-centre Type and lifecycle on the sample ZIPs
        env:
          SITE_BASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.site_base != '') && inputs.site_base || 'http://localhost:8099' }}
          ZIPS: ${{ github.event_name == 'workflow_dispatch' && inputs.zips || '' }}
        run: node scripts/probe-map1-dc-type-lifecycle.mjs

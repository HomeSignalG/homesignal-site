name: db-migrate

# Apply a COMMITTED .sql file to production. Replaces the interactive Supabase MCP approval for migrations: nothing here has
# a response deadline. The human gate is a GitHub environment with required reviewers; the job simply waits in "Waiting"
# until a reviewer approves or rejects it (GitHub keeps it for up to 30 days, then cancels it - a cancel is a rejection,
# never an approval). See docs/db-migration-runner.md for the one-time setup and the recovery path.
#
#   preflight  environment prod-db-read   no reviewers; READ-ONLY queries only; posts the sha256 + summary the approver reads
#   apply      environment prod-db-write  required reviewers; runs the file once, records it in public.migration_runs
#   verify     environment prod-db-read   optional committed select-only file, read-only
#
# Dispatch only (no pull_request / push trigger), so branch code never runs with these secrets unless a person dispatches it
# and, for writes, a reviewer approves that exact sha256.

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'Committed migration, e.g. docs/video-bluesky-queue.sql'
        required: true
      sha256:
        description: 'sha256 of that file (sha256sum <file>). The approver approves exactly this content.'
        required: true
      verify_sql_file:
        description: 'Optional committed select-only file to run read-only afterwards'
        required: false
      verify_sha256:
        description: 'sha256 of verify_sql_file (required when verify_sql_file is set)'
        required: false

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: qwnnmljucajnexpxdgxr

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod-db-read
    steps:
      - uses: actions/checkout@v4
      - name: Read-only preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SQL_FILE: ${{ inputs.sql_file }}
          SQL_SHA: ${{ inputs.sha256 }}
        run: python3 scripts/db_migrate.py preflight "$SQL_FILE" "$SQL_SHA"

  apply:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod-db-write
    steps:
      - uses: actions/checkout@v4
      - name: Apply the committed file
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SQL_FILE: ${{ inputs.sql_file }}
          SQL_SHA: ${{ inputs.sha256 }}
        run: python3 scripts/db_migrate.py apply "$SQL_FILE" "$SQL_SHA"

  verify:
    needs: apply
    if: ${{ inputs.verify_sql_file != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod-db-read
    steps:
      - uses: actions/checkout@v4
      - name: Read-only verification
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SQL_FILE: ${{ inputs.verify_sql_file }}
          SQL_SHA: ${{ inputs.verify_sha256 }}
        run: python3 scripts/db_migrate.py verify "$SQL_FILE" "$SQL_SHA"

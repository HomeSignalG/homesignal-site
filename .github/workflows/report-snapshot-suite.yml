name: report-snapshot-suite

# DURABLE REPORT SNAPSHOTS (docs/report-snapshot.sql; Development Activity plan Order F) and their
# PRIVACY BOUNDARY (docs/report-private-context.sql; F2, founder decision 2026-09-29): the immutable
# snapshot holds permanent intelligence only, and the customer-entered street address lives in a separate,
# deletable private context that is purged 90 days after the last thing needing it (at once on a verified
# privacy request).
# Runs the SHIPPED SQL against a DISPOSABLE Postgres, twice over:
#   1. the private layer — retention clock, purge in place, audit log, lock-down — then every prohibited
#      mutation of that SQL, each of which MUST fail the suite;
#   2. the snapshot — the database mints report_id, content_hash must be the SHA-256 of the stored body,
#      the body is kept byte for byte, a snapshot is immutable, nothing private can enter it, purging the
#      private context leaves it byte-identical; the exact Order F table that is live in production
#      upgrades to a fresh-install shape (and is refused if a report is stored); then every prohibited
#      mutation, each of which MUST fail the suite.
#   3. the NATIONAL REPORT ENGINE (Order G): its real output, assembled for six subject addresses, is stored by the
#      real snapshot module through the real writer, and every assertion is about what the database holds — one
#      permanent report for six customers, no private value or fragment in it, the private layer holding exactly what
#      was entered, a purge leaving the report byte-identical, and each kind of leak caught where it can be.
#   4. the PURGE SCHEDULE (docs/report-private-context-purge-schedule.sql; Order F2 gate 5): the pg_cron job that runs
#      the F2 purge batch every 15 minutes, and the alertable monitor check that pages when a private context is more
#      than an hour past its purge date. Against a stand-in pg_cron and a stand-in monitor: the job and its schedule, the
#      health read, every monitor outcome, the scheduled command purging exactly what is due, a check that cannot run
#      failing instead of killing the monitor, an exact rollback, two refusals that arm nothing, and every prohibited
#      mutation, each of which MUST fail the suite.
#   5. CHANGES SINCE REPORT and FOLLOW (Order G follow-up; contract §6 gate 4): the real edge function handler and data layer,
#      driven against the shipped ledger, reportable-events view, private layer and snapshot SQL. A report is assembled by the
#      real engine and stored by the real writer; events are written; the reader answers "what changed since" while a Follow
#      keeps the private context alive AND after the context is purged, byte-identically (for the same clock and ledger state); a
#      purged context is named, not reopened; nothing private appears in any response; and the data layer touches only the four data
#      relations it is allowed plus the gate's allow-list and user lookup and the two need functions. Not shipped, and stated: the
#      transport is a PostgREST translator, the sign-in and allow-list are canned, and the failure TABLE under the source-health view
#      and the roles are stand-ins (the view the reader queries is production's own, sliced from docs/dev-change-baseline.sql).
#   6. the SHARE-LINK PRIMITIVE (docs/report-share.sql; Order J unit J1): an opaque, revocable, optionally expiring link to one
#      stored report. The database holds only the SHA-256 of the token, decides in ONE function whether a link is usable
#      (ACTIVE / EXPIRED / REVOKED / UNKNOWN, revoked beating expired, the report handed back only for ACTIVE), never changes an
#      expiry and never undoes a revoke, and touches nothing of the snapshot or the private layer; a share survives a purge of
#      its report's private context. Against the REAL snapshot and private-layer SQL: the checks, a second apply, the rollback
#      with shares stored, the refusal without the snapshot table, and every prohibited mutation, each of which MUST fail a
#      NAMED check of the suite (a mutation that only crashes it fails the run). No caller, no endpoint, no page.
#   7. SHARE AND PDF (docs/report-share-delivery.sql; Development Activity build step 8): the layer that gives that primitive its
#      owner, its caller and its lifetime. A member of the brokerage that owns a stored report makes a link that lasts 6 months, lists the
#      report's links and revokes them; a client who holds a link reads the report. Against the REAL account spine, private layer,
#      snapshot, entitlement, saved-reports and share-primitive SQL: the checks, two REAL concurrent sessions racing for a report's last
#      place (exactly one wins), a create under REPEATABLE READ refused, a second apply, the rollback with shares stored, the refusal
#      without the primitive, and every prohibited mutation, each of which MUST fail a NAMED check of the suite.
#   8. THE WATCH (docs/property-watch.sql, docs/property-watch-schedule.sql; Development Activity build step 9): an agent watches the
#      property of one of its brokerage's stored reports; a daily system job checks it and emails the agent when a nearby project's official
#      status changes. Against the REAL account spine, private layer, snapshot, entitlement and saved-reports SQL: the watch layer's checks, two
#      REAL concurrent sessions racing for a brokerage's last place under the limit of 25 (exactly one wins), two job runs claiming at once (disjoint),
#      a start under REPEATABLE READ refused, a second apply, the rollback with watches stored (every follow need CLOSED), the refusal without
#      the saved-reports functions and every prohibited mutation; then the schedule (the pg_cron job, the wrapper, the health read and the
#      alertable monitor check) against stand-ins for pg_cron, pg_net, the vault and the monitor, with its own exact rollback, refusals and
#      prohibited mutations. Each mutation MUST fail a NAMED check of the suite (a mutation that only crashes it fails the run).
#   9. BILLING (docs/brokerage-billing.sql; Development Activity build step 11): the $79 a month plan's database layer, in its own job so its
#      mutation loop does not share the first job's time. A processor subscription is bound to one brokerage, the plan state is derived from the
#      payment ledger's latest live event, a paid brokerage's reports are charged to a 100-a-month allotment kept in its own append-only ledger (the
#      cap is a CONSTRAINT), and the six readers that decide whose a report is read one view over both ledgers. Against the REAL account spine,
#      private layer, snapshot, entitlement, saved-reports, share, watch, payment-event and header SQL: the checks, two REAL sessions racing for a
#      month's 100th report, the same key sent twice at once, one subscription named for two brokerages at once, an issue under REPEATABLE READ
#      refused, a second apply, the rollback with paid reports stored (the six readers put back to exactly their earlier definitions), the refusals
#      when a layer or a splice anchor is absent, and every prohibited mutation, each of which MUST fail a NAMED check (a crash fails the run).
#  10. THE LAUNCH GATE (test/launch_gate_pg; Development Activity build step 13), in its own job: the plan's end-to-end sequence as ONE scenario, through the
#      real handlers and data layers of development-activity-trial, get-development-activity-report, manage-billing and development-activity-billing-webhook,
#      against the SHIPPED SQL of every layer the product stands on: sign-up (admin creates the trial, owner joins, owner invites an agent), ten free
#      reports, the end of the trial, the owner's checkout, the processor's test payment (which grants nothing) and live payment (which binds the subscription
#      to the brokerage and opens a month of 100), a hundred paid reports, the 101st refused, saved reports across both ledgers, another brokerage unable to
#      read or take any of it, and a cancellation that ends new reports and deletes nothing. The payment processor is a stand-in that records what it was sent:
#      NOTHING here reaches Lemon Squeezy, holds a real key or charges anyone, and the processor's field names are still the unconfirmed ones (see
#      docs/development-activity-launch-gate-2026-10-04.md). Its mutation loop (test/launch_gate_mutants.py) is manual, like the other mutation loops.
#  11. THE REPORT RATE LIMIT (docs/report-rate-limit.sql; launch-readiness, the carried open item "free-report rate limit"), in its own job: a ceiling on how
#      many report REQUESTS a member and their brokerage may make in a minute, an hour and a day, counted by the DATABASE in fixed windows, serialised, with
#      refused attempts consuming nothing. Against the REAL account spine and every entitlement and billing layer: applying it changes nothing they own (a
#      fingerprint of everything else is identical), the checks at fixed instants (every window boundary, the longer wait named, an old clock unable to reopen a
#      window, no email/address/IP stored, system-only), EIGHT real sessions racing one person's minute admit exactly ten and SIXTEEN real sessions across four
#      people of one brokerage admit exactly thirty, a claim above READ COMMITTED refused, the API roles refused by the database, a second apply, an exact
#      rollback, the refusal when a layer is absent, and every prohibited mutation, each of which MUST fail a NAMED check (a crash fails the run). The launch
#      gate's section 15 then proves the same limit end to end through the real report handler. It touches neither the 10 free reports nor the 100 paid ones.
# The offline halves (test/report-snapshot.test.mjs, test/report-snapshot-structure.test.mjs,
# test/report-private-context-structure.test.mjs, test/report-private-context-purge-structure.test.mjs,
# test/report-share.test.mjs, test/report-share-structure.test.mjs, test/report-share-delivery-structure.test.mjs,
# test/share-link-functions.test.mjs, test/shared-report-page.test.mjs, test/property-watch-*.test.mjs,
# test/national-report*.test.mjs) run in unit-tests.yml with every
# other offline suite.
#
# This workflow holds NO Supabase credential and refuses to run if one is present: it can only ever
# address the disposable container.


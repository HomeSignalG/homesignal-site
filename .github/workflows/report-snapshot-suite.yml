permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dev_change_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run if any Supabase credential is present
        run: |
          if [ -n "${SUPABASE_DB_URL:-}${SUPABASE_ACCESS_TOKEN:-}${SUPABASE_WRITE_KEY:-}" ]; then
            echo "ABORT: this suite must only ever address the disposable container."; exit 1
          fi
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      # 22, not the runner's default: the national report round trip imports the real TypeScript modules
      # (report-snapshot.ts, national-report.ts), and Node strips types on import from 22.18 — the same pin unit-tests.yml uses.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The private context passes; it applies twice; every prohibited mutation is killed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dev_change_disposable
        run: |
          set -o pipefail
          bash test/report_private_context_pg/run.sh 2>&1 | grep -v NOTICE | tee /tmp/rpc.log
      - name: The event counter is closed to the API roles; a later sequence on the layer is too; an unrelated one is untouched; every prohibited mutation is killed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dev_change_disposable
        run: |
          set -o pipefail
          bash test/report_private_context_pg/sequence_lockdown.sh 2>&1 | grep -v NOTICE | tee /tmp/rpcseq.log
      - name: The shipped snapshot passes; it applies twice; the Order F table upgrades; every prohibited mutation is killed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dev_change_disposable
        run: |
          set -o pipefail
          bash test/report_snapshot_pg/run.sh 2>&1 | grep -v NOTICE | tee /tmp/rs.log
      - name: The national report engine's real output goes through the real writer
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dev_change_disposable
        run: |
          set -o pipefail
          bash test/national_report_pg/run.sh 2>&1 | grep -v NOTICE | tee /tmp/nr.log
      - name: The purge schedule and its monitor check pass; the file applies twice and rolls back exactly; every prohibited mutation is killed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dev_change_disposable
        run: |
          set -o pipefail
          bash test/report_private_context_purge_pg/run.sh 2>&1 | grep -v NOTICE | tee /tmp/rpp.log
      - name: The report-service email alarm passes; the file applies twice and rolls back exactly; it is refused when what it stands on is missing; every prohibited mutation is killed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dev_change_disposable
        run: |
          set -o pipefail
          bash test/report_service_monitor_pg/run.sh 2>&1 | grep -v NOTICE | tee /tmp/rsm.log
      - name: Changes Since Report and Follow run end to end; the answer is the same while the context is kept and after it is purged
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dev_change_disposable
        run: |
          set -o pipefail
          bash test/changes_since_report_pg/run.sh 2>&1 | grep -v NOTICE | tee /tmp/csr.log
      - name: The share-link primitive passes; it applies twice and rolls back exactly; it touches nothing it depends on; every prohibited mutation is killed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dev_change_disposable
        run: |
          set -o pipefail
          bash test/report_share_pg/run.sh 2>&1 | grep -v NOTICE | tee /tmp/rsh.log
      - name: Creating a trial (admins only), joining it and making trial reports go through the real handlers, data layers, snapshot module and evaluation SQL; charged once, never twice, refused when used up
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dev_change_disposable
        run: |
          set -o pipefail
          bash test/trial_report_pg/run.sh 2>&1 | grep -v NOTICE | tee /tmp/trial.log
      - name: A brokerage's member makes a 6-month link to its own stored report, lists and revokes it; a client who holds it reads the report; two sessions racing for the last place cannot both have it; every prohibited mutation is killed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dev_change_disposable
        run: |
          set -o pipefail
          bash test/report_share_delivery_pg/run.sh 2>&1 | grep -v NOTICE | tee /tmp/rsd.log
      - name: The Watch passes; two sessions racing for a brokerage's last place cannot both have it; two job runs never take the same watch; the rollback closes every follow need; every prohibited mutation is killed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dev_change_disposable
        run: |
          set -o pipefail
          bash test/property_watch_pg/run.sh 2>&1 | grep -v NOTICE | tee /tmp/pw.log
      - name: The Watch's schedule, wrapper, health read and monitor check pass; the file applies twice and rolls back exactly; it is refused when what it stands on is missing; every prohibited mutation is killed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dev_change_disposable
        run: |
          set -o pipefail
          bash test/property_watch_schedule_pg/run.sh 2>&1 | grep -v NOTICE | tee /tmp/pws.log

  billing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dev_change_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to run if any Supabase credential is present
        run: |
          if [ -n "${SUPABASE_DB_URL:-}${SUPABASE_ACCESS_TOKEN:-}${SUPABASE_WRITE_KEY:-}" ]; then
            echo "ABORT: this suite must only ever address the disposable container."; exit 1
          fi
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Billing passes; two sessions racing for the 100th report of a month cannot both have it; one key is charged once; a subscription belongs to one brokerage; the file applies twice and rolls back exactly with paid reports stored; every prohibited mutation is killed
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: dev_change_disposable
        run: |
          set -o pipefail

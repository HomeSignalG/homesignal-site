name: n5-postgis-suite

# EXECUTABLE PostgreSQL + PostGIS proof for the N5 migration and the verdict publication /
# canonical synchronization lifecycle. This is the check that static source assertions
# cannot be: it applies the ACTUAL migration file and runs the ACTUAL SQL emitted by
# scripts/n5_shard.py against a real PostGIS server, then reads the results back.
#
# The target is a THROWAWAY service container created for this job and destroyed with it.
# It holds no credentials and can reach no Supabase project; the suite additionally refuses
# to start if any SUPABASE_* secret is present in the environment. It must never be pointed
# at production.
#
# Reported, NOT required: it is deliberately absent from branch protection. It is a normal
# job with no continue-on-error, so a failure shows as a RED CHECK rather than being
# swallowed - a suite that cannot go red proves nothing.

on:
  pull_request:
    paths:
      - 'scripts/n5_shard.py'
      - 'scripts/n3_pilot.py'
      - 'docs/n5-canonical-geometry-provenance.sql'
      - 'test/n5_pg/**'
      - '.github/workflows/n5-postgis-suite.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # PRODUCTION RUNS POSTGRESQL 17 (17.6, PostGIS 3.3.7 - measured 2026-09-03 via the
    # Management API). Proving the migration only on 16 would leave the production MAJOR
    # version untested, so the suite runs on both. The PostGIS minor differs from
    # production's 3.3.7 by necessity (no published image pairs PG17 with PostGIS 3.3);
    # the spatial functions this migration uses - ST_Point, ST_X/ST_Y, ST_SetSRID,
    # ST_MakePoint, ST_GeometryType, ST_SRID - all predate 3.0, and every one of them was
    # additionally exercised against production's real 3.3.7 by the read-only preflight.
    # What the 17 leg buys is the PostgreSQL half: PL/pgSQL, catalog shapes, CHECK
    # semantics, format_type/pg_get_constraintdef and create-table-if-not-exists behaviour.
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgis/postgis:16-3.4
          - postgis/postgis:17-3.5
    name: postgis (${{ matrix.image }})
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: n5_disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the driver (CI-only; the repo itself stays dependency-free)
        run: pip install --quiet psycopg2-binary

      # An instrument must prove it ran. Print the real server and PostGIS versions, and
      # fail here rather than later if the extension is missing - a suite that silently
      # skipped its spatial assertions would be success-shaped and attest to nothing.
      - name: Prove the disposable PostGIS target is real
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d n5_disposable -c "create extension if not exists postgis;"
          echo "POSTGRESQL: $(psql -h localhost -U postgres -d n5_disposable -tAc 'select version();')"
          echo "POSTGIS:    $(psql -h localhost -U postgres -d n5_disposable -tAc 'select postgis_full_version();')"
          psql -h localhost -U postgres -d n5_disposable -tAc "select 1 from pg_extension where extname='postgis';" | grep -q 1

      # The receipt has to be readable. Without this the suite's own output is buried
      # under the service container's Postgres log, which Actions appends at teardown.
      - name: Run the executable N5 database suite
        env:
          N5_TEST_DSN: "host=localhost port=5432 user=postgres password=postgres dbname=n5_disposable"
        run: |
          set -o pipefail
          python3 test/n5_pg/run_suite.py 2>&1 | tee /tmp/n5-suite.log
        continue-on-error: true
        id: suite

      - name: Publish the receipt (versions + PASS/FAIL summary + any failures)
        if: always()
        env:
          PGPASSWORD: postgres
        run: |
          {
            echo '## N5 executable PostgreSQL + PostGIS receipt'
            echo ''
            echo '```'
            psql -h localhost -U postgres -d n5_disposable -tAc 'select version();'
            psql -h localhost -U postgres -d n5_disposable -tAc "select 'POSTGIS ' || postgis_lib_version();"
            echo ''
            sed -n '/^=\{20,\}$/,$p' /tmp/n5-suite.log | head -60
            echo '```'
            echo ''
            echo '### Failing assertions'
            echo '```'
            grep '^FAIL' /tmp/n5-suite.log || echo '(none)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(PASS|FAIL)' /tmp/n5-suite.log | tail -90
          sed -n '/^=\{20,\}$/,$p' /tmp/n5-suite.log

      - name: Fail the job if any executable assertion failed
        if: steps.suite.outcome != 'success'
        run: |
          echo "The executable database suite reported failures - see the job summary."
          exit 1

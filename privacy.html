      <div class="eyebrow">Legal</div>
      <h1>HomeSignal Privacy Notice</h1>
      <p>Last updated October 9, 2026. In plain language: we do not sell your personal contact information, the development information comes from public records, and you control what you follow.</p>
    </div>
    <div class="block prose" style="max-width:840px">
      <div class="cnote"><b>The short version:</b> we do not sell your personal contact information. The development information we show comes from public government records, not from tracking you. You choose which locations and topics you follow, and you can change your preferences or unsubscribe at any time.</div>

      <h2 class="bt">What we collect</h2>
      <ul>
        <li><b>Account information</b>: your email, and optionally your name, so you can save places and receive alerts. For brokerage accounts, this includes the people a brokerage owner invites.</li>
        <li><b>Saved locations and preferences</b>: the ZIP Codes, addresses and topics you choose to follow, and the Development Activity reports you create or save.</li>
        <li><b>Public-source development information</b>: permits, hearings, agendas, and environmental and infrastructure filings. This is public data about places, not private data about you.</li>
        <li><b>Basic usage and operational data</b>: privacy-respecting analytics and logs that keep the product reliable and secure.</li>
        <li><b>Billing information for paid subscriptions</b>: see "Payments" below. Card and bank details are handled by the payment provider, not stored by HomeSignal.</li>
      </ul>

      <h2 class="bt">Why we use it</h2>
      <p>We use your email and preferences to provide your account, deliver the alerts and briefings you asked for, generate and save the reports you request, send account and service messages (such as sign-in codes, confirmations and billing notices), and improve accuracy and reliability. Aggregate usage data helps us improve the product.</p>

      <h2 class="bt">Alerts and account communications</h2>
      <p>Alert emails are sent only for what you chose to follow. Every alert email includes a one-click unsubscribe link. Account and service messages related to your account or subscription may still be sent when needed.</p>

      <h2 class="bt">Payments</h2>
      <p>Payments for paid subscriptions may be processed by our authorized merchant-of-record or payment provider. The applicable provider, and its terms and privacy notice, are presented at checkout. That provider handles your payment details and tax collection; HomeSignal does not store full card numbers.</p>

      <h2 class="bt">Sharing</h2>
      <p>We do not sell your personal contact information, and we do not share your identity with advertisers. We use service providers that help us run HomeSignal (for example, hosting, email delivery and payments), and they may process information on our behalf. We may disclose information if required by law.</p>

      <h2 class="bt">Optional anonymized insights</h2>
      <p>When you opt in (the checkbox on the topic picker), HomeSignal may share <b>anonymized, aggregated</b> information about the topics and locations people follow, for example "interest in data-center development rose in this county." No personal contact information is included, and it is off unless you choose it. You can change this in your alert settings.</p>

      <h2 class="bt">Your choices and controls</h2>
      <ul>
        <li>Change the topics and places you follow at any time.</li>
        <li>Unsubscribe from any alert email with one click.</li>
        <li>For questions about your information, email <a href="mailto:hello@homesignal.net">hello@homesignal.net</a>.</li>
      </ul>

      <h2 class="bt">Changes to this notice</h2>
      <p>If we change this notice, we will update the date at the top of this page.</p>

      <h2 class="bt">Contact</h2>
      <p>Questions about privacy? Email <a href="mailto:hello@homesignal.net">hello@homesignal.net</a> or use the <a href="contact.html">contact page</a>. See also our <a href="terms.html">Terms of Service</a> and <a href="refund-policy.html">Refund Policy</a>.</p>
    </div>
